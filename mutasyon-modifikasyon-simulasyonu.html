<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Mutasyon ve Modifikasyon Laboratuvarı</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;700;800&display=swap">
<style>
/* Düzen: sol raf (örnekler) · orta: kontrol ve deney kartları + karşılaştırma şeridi · sağ deney paneli */
:root{
  --bg:#EDF1F5; --panel:#FFFFFF; --ink:#132033; --ink2:#4E6078; --line:#D2DBE5;
  --env:#0B7F86; --on-env:#FFFFFF; --env-bg:#DCF1F1;
  --mut:#C4400C; --on-mut:#FFFFFF; --mut-bg:#FBE5DA;
  --dna:#6238B0; --on-dna:#FFFFFF; --dna-bg:#EAE2F8;
  --ok:#1B8449; --ok-bg:#DDF3E5; --warn:#B3261E; --warn-bg:#FBE1DE;
  --stage:#F1F5F2; --stage-line:#C6D3CB;
  --fd:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --fb:'Atkinson Hyperlegible','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1927; --panel:#162538; --ink:#EAF0F7; --ink2:#9DB0C6; --line:#2A3D54;
    --env:#4CC9CF; --on-env:#05262A; --env-bg:#11393F;
    --mut:#FF8C5E; --on-mut:#3A1405; --mut-bg:#4A2416;
    --dna:#B69AF0; --on-dna:#1D1040; --dna-bg:#2A2150;
    --ok:#5BD58C; --ok-bg:#143A26; --warn:#FF8F85; --warn-bg:#4A1D1A;
    --stage:#F1F5F2; --stage-line:#C6D3CB;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1927; --panel:#162538; --ink:#EAF0F7; --ink2:#9DB0C6; --line:#2A3D54;
  --env:#4CC9CF; --on-env:#05262A; --env-bg:#11393F;
  --mut:#FF8C5E; --on-mut:#3A1405; --mut-bg:#4A2416;
  --dna:#B69AF0; --on-dna:#1D1040; --dna-bg:#2A2150;
  --ok:#5BD58C; --ok-bg:#143A26; --warn:#FF8F85; --warn-bg:#4A1D1A;
  --stage:#F1F5F2; --stage-line:#C6D3CB;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{font-size:clamp(12px,1.5vh,22px)}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:1rem;line-height:1.3;overflow:hidden;-webkit-touch-callout:none}
button{font-family:inherit;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--dna);outline-offset:2px}

#app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);gap:.6rem;padding:.7rem max(16px,1rem)}
.top{display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
h1{font:800 1.6rem/1.1 var(--fd);margin:0;letter-spacing:-.01em;text-wrap:balance}
.score{font:700 1rem var(--fd);color:var(--ink2)}
.seg{display:flex;margin-left:auto;border:2px solid var(--ink);border-radius:.7rem;overflow:hidden}
.seg button{font:700 1rem var(--fd);padding:.45rem 1.2rem;border:0;background:transparent;color:var(--ink);cursor:pointer;min-height:2.6rem}
.seg button.on{background:var(--ink);color:var(--bg)}

.bench{display:grid;grid-template-columns:14.5rem minmax(0,1fr) 20rem;gap:.8rem;min-height:0}
.shelf,.panel,.spec,.ob{background:var(--panel);border:1px solid var(--line)}
.shelf{border-radius:.8rem;padding:.5rem .6rem;display:flex;flex-direction:column;gap:.05rem;min-height:0;overflow:hidden}
.shelf h3{font:700 .72rem var(--fd);letter-spacing:.09em;text-transform:uppercase;color:var(--ink2);margin:.4rem .3rem .1rem}
.shelf h3:first-child{margin-top:.1rem}
.ex{display:flex;align-items:center;text-align:left;font:700 .98rem var(--fb);border:0;background:transparent;color:var(--ink);padding:.2rem .55rem;border-radius:.4rem;min-height:2.05rem;cursor:pointer}
.ex.on{background:var(--ink);color:var(--bg)}
.gl{display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem;margin-top:.3rem}
.gn{min-height:2.7rem;font:800 1.1rem var(--fd);border:2px solid var(--line);border-radius:.5rem;background:var(--panel);color:var(--ink);cursor:pointer}
.gn.on{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.gn.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ink)}
.gn.no{border-color:var(--warn);background:var(--warn-bg);color:var(--ink)}
.gn.on.ok,.gn.on.no{outline:3px solid var(--ink);outline-offset:1px}
.shelf .note{font-size:.88rem;color:var(--ink2);margin:.2rem .3rem}

.center{display:grid;grid-template-rows:minmax(0,1fr) auto;gap:.65rem;min-height:0}
.duo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr);gap:.8rem;min-height:0}
.spec{border-radius:.9rem;padding:.55rem .7rem .6rem;display:flex;flex-direction:column;min-height:0;min-width:0}
.spec.ctl{border-top:5px solid var(--ink2)}
.spec.dev{border-top:5px solid var(--env)}
.sh{display:flex;align-items:baseline;gap:.5rem;flex-wrap:wrap;margin-bottom:.35rem}
.sh h2{font:800 1.25rem/1.1 var(--fd);margin:0}
.sh .sub{font-size:.9rem;color:var(--ink2);margin-right:auto}
.chip{display:inline-block;font:700 .82rem var(--fb);padding:.12rem .55rem;border-radius:.9rem;border:1.5px solid var(--line);color:var(--ink)}
.chip.env{background:var(--env-bg);border-color:var(--env)}
.chip.mut{background:var(--mut-bg);border-color:var(--mut)}
.mainv{flex:1.9;min-height:0;display:flex;flex-direction:column}
.kidrow{flex:1;min-height:0;display:flex;gap:.8rem;margin-top:.35rem;align-items:stretch}
.kp{height:100%;aspect-ratio:320/260;flex:none;width:auto}
.kt{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.vh{font:700 .72rem var(--fd);letter-spacing:.09em;text-transform:uppercase;color:var(--ink2);margin-bottom:.2rem}
.plate{flex:1;min-height:0;display:flex;background:var(--stage);border:1px solid var(--stage-line);border-radius:.6rem;overflow:hidden}
.plate svg{flex:1;min-width:0;min-height:0;width:100%;height:100%;font-family:var(--fb)}
.plate.empty{align-items:center;justify-content:center;border-style:dashed;color:#55645C;text-align:center;padding:.6rem;font-weight:700;font-size:.92rem}
.cap{margin:.3rem 0 0;font:700 1.05rem/1.2 var(--fb);min-height:1.3rem}
.kt .cap{font-size:1.02rem}
.strips{margin-top:.2rem}
.strip{display:grid;grid-template-columns:7.4rem minmax(0,1fr);align-items:center;gap:.5rem;margin-top:.22rem}
.sl{font-size:.82rem;font-weight:700;line-height:1.1}
.sl small{display:block;font-weight:400;color:var(--ink2)}
.sl small.d{color:var(--mut);font-weight:700}
.cells{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:2px}
.b{font:700 .8rem var(--fb);font-style:normal;text-align:center;line-height:1.45rem;border-radius:.2rem;color:#fff}
.bA{background:#3E7BEA}.bT{background:#E2A400;color:#222}.bG{background:#2FA866}.bC{background:#D9487F}
.b.gap{background:transparent;border:2px dashed var(--mut);line-height:1.2rem}
.f-sub,.f-inv{outline:3px solid var(--mut);outline-offset:1px;position:relative;z-index:1}
.dnahide{margin-top:.3rem;font-size:.88rem;color:var(--ink2);border:1.5px dashed var(--line);border-radius:.5rem;padding:.35rem .6rem}

.obs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.7rem}
.ob{border-radius:.7rem;padding:.4rem .8rem;display:flex;align-items:center;gap:.7rem;min-height:3.6rem}
.ob .k{font:700 .72rem var(--fd);letter-spacing:.09em;text-transform:uppercase;color:var(--ink2);flex:none;width:4.2rem}
.ob .val{font:800 1.15rem/1.15 var(--fd)}
.ob .val small{display:block;font:400 .86rem var(--fb);color:var(--ink2)}
.ob .dot{flex:none;width:1rem;height:1rem;border-radius:50%;background:var(--line)}
.ob.same .dot{background:var(--env)}
.ob.diff .dot{background:var(--mut)}

.panel{border-radius:.8rem;padding:.75rem .8rem;display:flex;flex-direction:column;gap:.6rem;min-height:0;overflow:hidden}
.panel h3{margin:0 0 .3rem;font:700 .72rem var(--fd);letter-spacing:.09em;text-transform:uppercase;color:var(--ink2)}
.panel .lead{margin:0;font-size:.92rem;color:var(--ink2)}
.col{display:grid;gap:.4rem}
.two{display:grid;grid-template-columns:1fr 1fr;gap:.4rem}
.btn{min-height:2.7rem;font:700 1.02rem var(--fd);border:2px solid var(--line);background:var(--panel);color:var(--ink);border-radius:.55rem;padding:.3rem .7rem;cursor:pointer;text-align:center;width:100%}
.btn:active{transform:translateY(1px)}
.btn.big.on{background:var(--env);border-color:var(--env);color:var(--on-env)}
.btn.mu{background:var(--mut-bg);border-color:var(--mut)}
.btn.tg2.on{background:var(--mut);border-color:var(--mut);color:var(--on-mut)}
.btn.go{background:var(--dna);border-color:var(--dna);color:var(--on-dna);min-height:3.1rem;font-size:1.12rem}
.btn.nx{background:var(--ink);border-color:var(--ink);color:var(--bg);min-height:3.1rem;font-size:1.12rem}
.btn.quiet{min-height:2.3rem;font-size:.92rem;color:var(--ink2);font-weight:600}
.btn.d-mut{background:var(--mut);border-color:var(--mut);color:var(--on-mut);min-height:3.1rem}
.btn.d-mod{background:var(--env);border-color:var(--env);color:var(--on-env);min-height:3.1rem}
.hint{margin:.3rem .1rem 0;font-size:.88rem;color:var(--ink2)}
.tick{display:inline-block;margin-right:.6rem;white-space:nowrap}
.tick.y{color:var(--ok);font-weight:700}
.verdict{border-radius:.6rem;padding:.6rem .7rem;border:2px solid var(--ok);background:var(--ok-bg)}
.verdict.no{border-color:var(--warn);background:var(--warn-bg)}
.verdict b.v{font:800 1.15rem var(--fd);display:block}
.verdict p{margin:.25rem 0}
.verdict ul{margin:.25rem 0 .3rem;padding-left:1.1rem;font-size:.92rem}
.verdict .why{font-size:.92rem;color:var(--ink2)}

@media (max-width:900px){
  html,body{height:auto}
  body{overflow:auto}
  #app{height:auto;display:flex;flex-direction:column}
  .bench{grid-template-columns:minmax(0,1fr)}
  .duo{grid-template-columns:minmax(0,1fr);grid-template-rows:none}
  .kidrow{flex-wrap:wrap}
  .kp{height:14rem}
  .plate{min-height:14rem}
  .obs{grid-template-columns:minmax(0,1fr)}
  .shelf,.panel{overflow:visible}
  .seg{margin-left:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.btn.mu1{width:100%;display:flex;flex-direction:column;gap:.2rem;padding:.7rem .6rem;background:#b4452c;color:#fff;border-color:#b4452c}.btn.mu1 small{font-size:.78rem;font-weight:400;opacity:.92;line-height:1.25}

.case #obs{display:none}
.case .bench{grid-template-columns:9.5rem minmax(0,1fr) 19rem}
.case .duo{display:flex;flex-direction:column;gap:.6rem;min-height:0}
.cgrid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:minmax(0,1fr) auto;gap:.6rem}
.cc{background:var(--panel);border:1px solid var(--line);border-radius:.8rem;padding:.5rem .6rem;display:flex;flex-direction:column;min-height:0;min-width:0}
.cc h3{margin:0 0 .3rem;font:700 .95rem var(--fd);display:flex;gap:.45rem;align-items:flex-start;line-height:1.2}
.cc h3 i{font-style:normal;flex:none;width:1.45rem;height:1.45rem;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:.85rem}
.cc .chips{display:flex;gap:.3rem;flex-wrap:wrap;margin-bottom:.35rem}
.cc .chips .chip{font-size:.74rem}
.cps{flex:1;min-height:0;display:flex;flex-direction:column;gap:.35rem}
.cp{margin:0;flex:1;min-height:0;display:flex;flex-direction:column;gap:.15rem}
.cp .plate{flex:1;min-height:0}
.cp figcaption{display:flex;flex-direction:column;font-size:.9rem;line-height:1.2}
.cp figcaption b{font:700 .75rem var(--fd);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.cp.dev figcaption b{color:var(--env)}
.cc.dna{grid-column:1/-1}
.cc.dna .strips{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.cc.dna .strip{margin-top:0}
.case .bench{grid-template-columns:11rem minmax(0,1fr) 19rem}.case .gl{grid-template-columns:repeat(3,1fr)}.cc h3{white-space:nowrap}.cc .chips{min-height:1.7rem}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <h1>Mutasyon ve Modifikasyon Laboratuvarı</h1>
    <span class="score" id="score" hidden></span>
    <div class="seg" role="group" aria-label="Çalışma modu">
      <button id="mKesif" class="on" data-act="mode" data-arg="kesif">Keşif</button>
      <button id="mGizli" data-act="mode" data-arg="gizli">Gizli Örnek</button>
    </div>
  </header>
  <main class="bench">
    <nav class="shelf" id="shelf" aria-label="Örnekler"></nav>
    <section class="center">
      <div class="duo" id="duo"></div>
      <div class="obs" id="obs"></div>
    </section>
    <aside class="panel" id="panel"></aside>
  </main>
</div>
<script>
/* Çizim kütüphanesi: 320x260 sahne, ortak gradyanlar window.ART.DEFS içinde */
window.ART=(function(){
var uid=0;
function f(n){return Math.round(n*10)/10;}
var OLS='stroke="#24324D" stroke-opacity=".34" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"';
function P(d,fill,x){return '<path d="'+d+'" fill="'+fill+'" '+(x||'')+'/>';}
function E(cx,cy,rx,ry,fill,x){return '<ellipse cx="'+f(cx)+'" cy="'+f(cy)+'" rx="'+f(rx)+'" ry="'+f(ry)+'" fill="'+fill+'" '+(x||'')+'/>';}
function C(cx,cy,r,fill,x){return '<circle cx="'+f(cx)+'" cy="'+f(cy)+'" r="'+f(r)+'" fill="'+fill+'" '+(x||'')+'/>';}
function R(x,y,w,h,r,fill,e){return '<rect x="'+f(x)+'" y="'+f(y)+'" width="'+f(w)+'" height="'+f(h)+'" rx="'+r+'" fill="'+fill+'" '+(e||'')+'/>';}
function L(x1,y1,x2,y2,col,w,e){return '<line x1="'+f(x1)+'" y1="'+f(y1)+'" x2="'+f(x2)+'" y2="'+f(y2)+'" stroke="'+col+'" stroke-width="'+w+'" stroke-linecap="round" '+(e||'')+'/>';}
function S(d,col,w,e){return '<path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="'+w+'" stroke-linecap="round" stroke-linejoin="round" '+(e||'')+'/>';}
function G(tr,inner,e){return '<g transform="'+tr+'" '+(e||'')+'>'+inner+'</g>';}
function shadow(cx,cy,rx){return E(cx,cy,rx,rx*0.11,'#173A2A','opacity=".17" filter="url(#fBlur)"');}
function tag(x,y,t){var w=t.length*6.3+22;return '<g><rect x="'+f(x-w/2)+'" y="'+(y-11)+'" width="'+f(w)+'" height="22" rx="11" fill="#1E2B3C"/><text x="'+x+'" y="'+(y+4.5)+'" text-anchor="middle" font-size="12.5" font-weight="700" fill="#FFFFFF">'+t+'</text></g>';}
function hash(i){var x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);}

var DEFS='<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>'+
'<filter id="fBlur" x="-30%" y="-300%" width="160%" height="700%"><feGaussianBlur stdDeviation="4"/></filter>'+
'<filter id="fSoft"><feGaussianBlur stdDeviation="1.6"/></filter>'+
[['gLeaf','#80D78E','#3FA05A'],['gLeaf2','#63BE70','#2E8A4B'],['gRed','#FF7C7C','#CF2339'],['gWhite','#FFFFFF','#D9E2EC'],['gPink','#FFA9D0','#E35A9C'],['gPurple','#B7A0F2','#6A43C6'],['gYellow','#FFE57F','#F2AC00'],
 ['gPot','#E6A076','#B4693F'],['gSoil','#8A6450','#5A3B2C'],['gSkinL','#FFE5CE','#F1BF97'],['gSkinT','#DDA474','#AB7146'],['gSkinD','#D79E70','#A9703F'],['gFurW','#FFFFFF','#DFE6EE'],['gFurD','#575764','#24242D'],['gAuburn','#EBA66E','#C5743E'],
 ['gBlood','#F5726F','#B9232E'],['gBloodD','#DE4A52','#8A1621'],['gTube','#FCE4DE','#F1BDB3'],['gBee','#FFDD5C','#EDA200'],['gBeeD','#52402C','#1E1710'],['gGoat','#E8CFA4','#C3A072'],['gHorn','#B09A80','#6E5B47'],
 ['gBact','#97D985','#4CA64A'],['gShield','#5B93E8','#1F4E9E'],['gMuscle','#F2C7A3','#D49971'],['gShirtB','#78A0E6','#4569B9'],['gShirtO','#FFA484','#E0603C'],['gShirtG','#86D493','#43A25A'],
 ['gIceBag','#D9EEFF','#86BFF2'],['gHotBag','#FFD6B8','#FF8F5E'],['gHairBr','#6A4630','#2C1C13'],['gHairW','#FFFFFF','#E6E1D6'],['gGlass','#EAF6FF','#BFD9EE'],['gMount','#B5BFCC','#7C8899']
].map(function(g){return '<linearGradient id="'+g[0]+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+g[1]+'"/><stop offset="1" stop-color="'+g[2]+'"/></linearGradient>';}).join('')+
'<linearGradient id="gTanFade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F6D3B3"/><stop offset="1" stop-color="#F6D3B3" stop-opacity="0"/></linearGradient>'+
'<radialGradient id="rIrisB" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#B4DEFF"/><stop offset="1" stop-color="#2A78C8"/></radialGradient>'+
'<radialGradient id="rIrisA" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#FFE59A"/><stop offset="1" stop-color="#C98410"/></radialGradient>'+
'<radialGradient id="rIrisBr" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#9A6A45"/><stop offset="1" stop-color="#3B2416"/></radialGradient>'+
'<radialGradient id="rIrisP" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#E8A1B6"/><stop offset="1" stop-color="#B2476A"/></radialGradient>'+
'<radialGradient id="rCell" cx=".5" cy=".5" r=".6"><stop offset="0" stop-color="#A52230"/><stop offset=".55" stop-color="#D84A52"/><stop offset="1" stop-color="#EE6F6C"/></radialGradient>'+
'<radialGradient id="rSun" cx=".4" cy=".4" r=".7"><stop offset="0" stop-color="#FFF08A"/><stop offset="1" stop-color="#FFB400"/></radialGradient>'+
'<radialGradient id="rThorax" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#E3A53B"/><stop offset="1" stop-color="#8C5A12"/></radialGradient>'+
'<radialGradient id="rKernel" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#FFEB8A"/><stop offset="1" stop-color="#EBA800"/></radialGradient>'+
'</defs></svg>';

/* ---- ortak parçalar ---- */
function leafD(len,w){return 'M0 0 C'+f(len*.2)+' '+f(-w)+' '+f(len*.75)+' '+f(-w*.9)+' '+len+' 0 C'+f(len*.75)+' '+f(w*.9)+' '+f(len*.2)+' '+f(w)+' 0 0 Z';}
function leaf(x,y,ang,len,w,fill){return '<g transform="translate('+x+' '+y+') rotate('+ang+')"><path d="'+leafD(len,w)+'" fill="'+(fill||'url(#gLeaf)')+'" '+OLS+'/><path d="M3 0 L'+f(len*.9)+' 0" stroke="rgba(255,255,255,.5)" stroke-width="1.5" fill="none" stroke-linecap="round"/></g>';}
function toothLeaf(x,y,ang,len,w,n,fill){n=n||9;var up=[],dn=[],i,t,xx,hw;for(i=0;i<=n;i++){t=i/n;xx=len*t;hw=w*Math.sin(Math.PI*Math.pow(t,.85))*(i%2?1:.6);up.push(f(xx)+' '+f(-hw));dn.push(f(xx)+' '+f(hw));}
  var d='M0 0 L'+up.join(' L')+' L'+len+' 0 L'+dn.reverse().join(' L')+' Z';

function tick(f,t){return '<span class="tick'+(f?' y':'')+'">'+(f?'✓':'○')+' '+t+'</span>';}
var EV={mod:['2. sonuç: Deney bireyi kontrolün ortamına alınınca ona benzedi.','4. sonuç: DNA şeritleri aynı, değişmedi.','3. sonuç: Yavrular aynı ortamda yetişince birbirinin aynısı oldu; değişim aktarılmadı.'],
        mut:['2. sonuç: Ortam aynı yapılsa da görünüm eski haline dönmedi.','4. sonuç: DNA’da kalıcı bir değişim var.','3. sonuç: Değişim yavruya aktarıldı (eşey hücresindeki DNA değişimi).']};
function decisionHTML(){
  var d=S.decided;
  if(!d)return '<section><h3>Karar</h3><div class="two"><button class="btn d-mut" data-act="decide" data-arg="mut">Mutasyon</button><button class="btn d-mod" data-act="decide" data-arg="mod">Modifikasyon</button></div><p class="hint">Yapılan deneyler: '+tick(S.tried.envChg,'ortam değişti')+tick(S.tried.off,'yavru üretildi')+'</p></section>';
  return '<div class="verdict'+(d.ok?'':' no')+'"><b class="v">'+(d.ok?'Doğru!':'Bu sefer olmadı.')+'</b><p><strong>'+ex.name+'</strong> · '+TL[ex.type]+'</p><ul>'+EV[ex.type].map(function(x){return '<li>'+x+'</li>';}).join('')+'</ul><p class="why">'+ex.why+'</p></div><button class="btn nx" data-act="next">Sonraki örnek</button>';
}
function renderPanel(){
  var hid=(mode==='gizli'),h='';
  h+='<p class="lead">Sağdaki <b>deney</b> bireyine uygula. Soldaki <b>kontrol</b> hiç değişmez.</p>';
  h+='<section><h3>Ortam</h3><div class="col">'+ex.env.map(function(t,i){return '<button class="btn big'+(S.env===i?' on':'')+'" data-act="env" data-arg="'+i+'">'+t+'</button>';}).join('')+'</div></section>';
  if(!hid&&ex.type==='mut'){
    if(!ex.unicell)h+='<section><h3>Hedef hücre</h3><div class="two"><button class="btn tg2'+(S.target==='body'?' on':'')+'" data-act="target" data-arg="body">Vücut hücresi</button><button class="btn tg2'+(S.target==='germ'?' on':'')+'" data-act="target" data-arg="germ">Eşey hücresi</button></div></section>';
    h+='<section><h3>Mutasyon</h3><button class="btn mu1" data-act="mut" data-arg="0"><b>Mutasyon oluştur</b><small>UV ışını, X ışını, kimyasal madde, eşlenme hatası</small></button></section>';
  }
  if(!hid&&ex.type==='mod')h+='<section><h3>Yavrunun ortamı</h3><div class="col">'+ex.env.map(function(t,i){return '<button class="btn big'+(offEnvVal()===i?' on':'')+'" data-act="oenv" data-arg="'+i+'">'+t+'</button>';}).join('')+'</div></section>';
  h+='<section><button class="btn go" data-act="off">Yavru üret</button></section>';
  h+=hid?decisionHTML():'<button class="btn quiet" data-act="reset">Başa dön</button>';
  document.getElementById('panel').innerHTML=h;
}
function renderTop(){
  var sc=document.getElementById('score'),n=0,k=0,id;
  document.getElementById('mKesif').className=mode==='kesif'?'on':'';
  document.getElementById('mGizli').className=mode==='gizli'?'on':'';
  if(mode==='gizli'){for(id in G.res){n++;if(G.res[id].ok)k++;}sc.hidden=false;sc.textContent='Doğru '+k+' · Yanıtlanan '+n+'/'+EX.length;}else sc.hidden=true;
}

/* ---------- gizli: hazır sonuçlu vaka ---------- */
function cplate(who,v,env,off){
  return '<figure class="cp '+who[1]+'"><div class="plate">'+svgOf(v,env,off)+'</div><figcaption><b>'+who[0]+'</b><span>'+ex.ph[v]+'</span></figcaption></figure>';
}
function caseHTML(){
  var mod=ex.type==='mod',K=['Kontrol','ctl'],D=['Deney','dev'],h='<div class="cgrid">';
  var steps=[
    ['1','Deney farklı ortamda yetişti','<span class="chip env">Kontrol: '+ex.env[0]+'</span><span class="chip env">Deney: '+ex.env[1]+'</span>',cplate(K,0,0,false)+cplate(D,1,1,false)],
    ['2','Deney, kontrolün ortamına alındı','<span class="chip env">İkisi de: '+ex.env[0]+'</span>',cplate(K,0,0,false)+cplate(D,mod?0:1,0,false)],
    ['3','Yavrular aynı ortamda yetişti','<span class="chip env">İkisi de: '+ex.env[0]+'</span>',cplate(K,0,0,true)+cplate(D,mod?0:1,0,true)]];
  steps.forEach(function(t){h+='<section class="cc"><h3><i>'+t[0]+'</i>'+t[1]+'</h3><div class="chips">'+t[2]+'</div><div class="cps">'+t[3]+'</div></section>';});
  h+='<section class="cc dna"><h3><i>4</i>DNA şeritleri</h3><div class="strips">';
  if(ex.unicell)h+=strip('Kontrol',S.baseCells)+strip('Deney',S.bodyCells);
  else h+=strip('Kontrol',S.baseCells)+strip('Deney',S.germCells);
  h+='</div></section></div>';
  return h;
}
function caseDecision(){
  var d=S.decided,h='<p class="lead"><b>Vaka '+(G.idx+1)+'</b> · '+(d?ex.name:'örnek gizli')+'<br>Dört sonuca bakıp karar ver.</p>';
  if(!d)return h+'<section><h3>Karar</h3><div class="col"><button class="btn d-mut" data-act="decide" data-arg="mut">Mutasyon</button><button class="btn d-mod" data-act="decide" data-arg="mod">Modifikasyon</button></div></section>';
  return h+'<div class="verdict'+(d.ok?'':' no')+'"><b class="v">'+(d.ok?'Doğru!':'Bu sefer olmadı.')+'</b><p><strong>'+TL[ex.type]+'</strong></p><ul>'+EV[ex.type].map(function(x){return '<li>'+x+'</li>';}).join('')+'</ul><p class="why">'+ex.why+'</p></div><button class="btn nx" data-act="next">Sonraki örnek</button>';
}
function render(){
  document.getElementById('app').className=mode==='gizli'?'case':'';
  renderTop();renderShelf();
  if(mode==='gizli'){document.getElementById('duo').innerHTML=caseHTML();document.getElementById('obs').innerHTML='';document.getElementById('panel').innerHTML=caseDecision();}
  else{renderCenter();renderPanel();}
}

document.getElementById('app').insertAdjacentHTML('afterbegin',ART.DEFS);
document.addEventListener('contextmenu',function(e){e.preventDefault();});
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  var a=b.getAttribute('data-act'),g=b.getAttribute('data-arg');
  if(a==='mode'){if(g!==mode)setMode(g);}
  else if(a==='ex'){ex=byId(g);S=fresh(ex,false);render();}
  else if(a==='g'){G.idx=+g;loadG();render();}
  else if(a==='shuffle'){startG();render();}
  else if(a==='env')actEnv(+g);
  else if(a==='mut')actMut(+g);
  else if(a==='target'){S.target=g;render();}
  else if(a==='oenv')actOEnv(+g);
  else if(a==='off')actOff();
  else if(a==='reset'){S=fresh(ex,false);render();}
  else if(a==='decide')actDecide(g);
  else if(a==='next')nextG();
});
S=fresh(ex,false);render();
})();
</script>
</body>
</html>
