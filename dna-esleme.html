<title>DNA Eşlenmesi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Nunito+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Layout: one screen, no scrolling. Cell stage fills the left, a control panel (buttons, 4 steps, caption, counters, sequences) sits on the right. White ground, navy old strands, raspberry new strands. */
:root{
  --bg:#ffffff; --ink:#16213a; --ink2:#566079; --line:#e2e7f1; --panel:#f6f8fc;
  --old:#2b3a67; --new:#d6336c; --oldSoft:#e8ecf8;
  --A:#22a06b; --T:#e8573f; --G:#2f7de1; --C:#f2b705;
  --ok:#14935a; --okSoft:#effaf4; --bad:#d92d3a; --badSoft:#fde9eb;
  --display:"Sora",system-ui,sans-serif; --body:"Nunito Sans",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.35;-webkit-font-smoothing:antialiased;padding:10px 12px;overflow:hidden}
h1,h3{font-family:var(--display);margin:0}
.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) clamp(390px,29vw,470px);gap:12px}
.stagebox{min-width:0;min-height:0;overflow:hidden;display:grid;place-items:center}
#cv{display:block;border-radius:16px;background:#fff}
.panel{min-width:0;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-right:2px}
.panel h1{font-size:22px;letter-spacing:-.01em}

.row{display:flex;gap:8px;align-items:center}
.btn{flex:1 1 0;min-height:54px;padding:0 10px;border-radius:14px;border:2px solid var(--old);background:#fff;color:var(--old);font:700 17px var(--body);cursor:pointer;touch-action:manipulation;transition:transform .12s ease;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--old);color:#fff;flex:1.25 1 0}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:focus-visible,.seg button:focus-visible,.steps button:focus-visible{outline:3px solid #7b61d6;outline-offset:2px}
.seg{display:flex;flex:1 1 0;border:2px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;min-width:0}
.seg button{flex:1 1 0;min-height:44px;padding:0 6px;border:0;background:#fff;color:var(--ink2);font:700 14.5px var(--body);cursor:pointer;touch-action:manipulation}
.seg button+button{border-left:2px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--old);color:#fff}
.seg.mode button[aria-pressed="true"][data-v="err"]{background:var(--bad)}
.cap{font-weight:700;color:var(--ink2);font-size:12.5px;flex:none;min-width:56px}
.progress{height:8px;border-radius:6px;background:var(--line);overflow:hidden;flex:none}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--old),var(--new))}

.steps{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.steps button{display:flex;gap:9px;align-items:center;text-align:left;min-height:56px;padding:6px 10px;border-radius:14px;border:2px solid var(--line);background:#fff;color:var(--ink2);font:700 14.5px/1.2 var(--body);cursor:pointer;touch-action:manipulation}
.steps b{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--line);color:var(--ink2);font:700 15px var(--display)}
.steps button.done{border-color:#c5cde6;background:var(--oldSoft);color:var(--old)}
.steps button.done b{background:var(--old);color:#fff}
.steps button.on{border-color:var(--old);background:var(--old);color:#fff}
.steps button.on b{background:#fff;color:var(--old)}

.caption{display:flex;flex-direction:column;gap:6px;align-items:flex-start;padding:10px 12px;border-radius:14px;background:var(--panel);border:1px solid var(--line);font:700 16px/1.35 var(--display);min-height:92px}
.caption .step{background:var(--old);color:#fff;border-radius:999px;padding:3px 12px;font:700 13px var(--body);white-space:nowrap}
.caption.bad{background:var(--badSoft);border-color:#f3b6bc}.caption.bad .step{background:var(--bad)}
.caption.good{background:var(--okSoft);border-color:#a5ddc2}.caption.good .step{background:var(--ok)}

.legend{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;font-size:12.5px;color:var(--ink2);font-weight:700}
.legend span{display:inline-flex;align-items:center;gap:5px}
.chip{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:5px;color:#fff;font:700 11px var(--mono)}
.chip.A{background:var(--A)}.chip.T{background:var(--T)}.chip.G{background:var(--G)}.chip.C{background:var(--C);color:var(--ink)}
.sw{width:18px;height:7px;border-radius:4px;display:inline-block}
.sw.old{background:var(--old)}.sw.new{background:var(--new)}

.tiles2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tiles3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{border:1px solid var(--line);border-radius:12px;padding:6px 10px;background:#fff;display:flex;flex-direction:column;gap:1px;min-width:0}
.tile .lbl{font:700 12.5px/1.2 var(--body);color:var(--ink2)}
.tile .val{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.tile .num{font:700 26px/1.15 var(--display);font-variant-numeric:tabular-nums}
.tile.flash .num{animation:pop .45s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}
.tag{font:700 11px var(--body);padding:1px 8px;border-radius:999px}
.tag.down{background:#fff1d1;color:#7d5300}
.tag.up{background:#dcf4e8;color:#0d6b41}
.tag.both{background:#e8e2fb;color:#4b36a8}

.seq{display:flex;flex-direction:column;gap:6px}
.blk{display:grid;grid-template-columns:62px minmax(0,1fr);gap:8px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:6px 8px;background:#fff}
.blk h3{font-size:13px;line-height:1.15}
.rows{display:flex;flex-direction:column;gap:3px;min-width:0}
.seqrow{display:grid;grid-template-columns:6px minmax(0,1fr);gap:5px;align-items:center}
.bar{display:block;height:100%;min-height:18px;border-radius:3px}
.bar.old{background:var(--old)}.bar.new{background:var(--new)}
.cells{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:2px}
.cell{aspect-ratio:1;border-radius:4px;display:grid;place-items:center;font:700 11px var(--mono);color:#fff}
.cell[data-l="A"]{background:var(--A)}.cell[data-l="T"]{background:var(--T)}.cell[data-l="G"]{background:var(--G)}.cell[data-l="C"]{background:var(--C);color:var(--ink)}
.cell.empty{background:transparent;border:1.5px dashed var(--line);color:transparent}
.cell.bad{outline:2.5px solid var(--bad);outline-offset:1px}
.verdicts{display:flex;flex-direction:column;gap:6px}
.verdict{border:2px solid var(--line);border-radius:12px;padding:6px 10px;font:700 14px/1.3 var(--body);color:var(--ink2)}
.verdict.yes{border-color:#9fdcbf;background:var(--okSoft);color:#0d6b41}
.verdict.no{border-color:#f3b6bc;background:var(--badSoft);color:#a3202c}
.verdict.info{border-color:#c9d3ee;background:#f2f5fd;color:var(--old)}

@media (max-width:900px){
  html,body{height:auto}
  body{overflow:auto}
  .app{height:auto;grid-template-columns:minmax(0,1fr)}
  .panel{overflow:visible}
  .btn{min-height:52px}
}

@media (max-height:900px) and (min-width:901px){
  body{padding:8px 10px}
  .panel{gap:6px}
  .btn{min-height:44px;font-size:16px}
  .seg button{min-height:34px;font-size:13.5px}
  .steps button{min-height:46px;font-size:13.5px;padding:4px 8px}
  .steps b{width:24px;height:24px;font-size:13px}
  .caption{min-height:70px;font-size:14.5px;padding:8px 10px;gap:4px}
  .tile{padding:4px 8px}.tile .num{font-size:21px}.tile .lbl{font-size:11.5px}
  .cell{font-size:10px}.bar{min-height:15px}.blk{padding:4px 8px}
  .verdict{padding:4px 8px;font-size:13px}
  .panel h1{font-size:19px}
}
@media (max-height:820px) and (min-width:901px){
  .legend{display:none}
  .panel h1{display:none}
  .progress{height:6px}
  .caption{min-height:62px}
}
@media (prefers-reduced-motion:reduce){.tile.flash .num{animation:none}}
</style>

<div class="app">
  <div class="stagebox" id="stagebox"><canvas id="cv" aria-label="Hücrede DNA eşlenmesi animasyonu"></canvas></div>

  <aside class="panel">
    <h1>DNA Eşlenmesi</h1>

    <div class="row">
      <button class="btn primary" id="btnPlay" type="button">Başlat</button>
      <button class="btn" id="btnStep" type="button">Bir adım</button>
      <button class="btn" id="btnReset" type="button">Sıfırla</button>
    </div>
    <div class="row"><span class="cap">Eşlenme</span>
      <div class="seg mode" id="segMode" role="group" aria-label="Eşlenme türü">
        <button type="button" data-v="ok" aria-pressed="true">Hatasız</button>
        <button type="button" data-v="err" aria-pressed="false">Hatalı</button>
      </div>
    </div>
    <div class="row"><span class="cap">Hız</span>
      <div class="seg" id="segSpeed" role="group" aria-label="Hız">
        <button type="button" data-v="0.09" aria-pressed="false">Yavaş</button>
        <button type="button" data-v="0.16" aria-pressed="true">Normal</button>
        <button type="button" data-v="0.3" aria-pressed="false">Hızlı</button>
      </div>
    </div>
    <div class="row"><span class="cap">Adlar</span>
      <div class="seg" id="segLabels" role="group" aria-label="Adlar">
        <button type="button" data-v="1" aria-pressed="true">Açık</button>
        <button type="button" data-v="0" aria-pressed="false">Kapalı</button>
      </div>
    </div>
    <div class="progress" aria-hidden="true"><i id="prog"></i></div>

    <nav class="steps" id="steps" aria-label="Eşlenme adımları">
      <button type="button" data-k="0"><b>1</b><span>Zincirler fermuar gibi ayrılır</span></button>
      <button type="button" data-k="1"><b>2</b><span>Serbest nükleotitler çekirdeğe girer</span></button>
      <button type="button" data-k="2"><b>3</b><span>Yeni zincirler oluşur</span></button>
      <button type="button" data-k="3"><b>4</b><span>Birbirinin kopyası 2 DNA oluşur</span></button>
    </nav>

    <div class="caption" id="caption"><span class="step" id="capStep">Hazır</span><span id="capText"></span></div>

    <div class="legend">
      <span><i class="sw old"></i>Eski zincir</span>
      <span><i class="sw new"></i>Yeni zincir</span>
      <span><i class="chip A">A</i><i class="chip T">T</i></span>
      <span><i class="chip G">G</i><i class="chip C">C</i> eşleşir</span>
    </div>

    <div class="tiles2">
      <div class="tile" id="tCyt"><span class="lbl">Sitoplazmada serbest nükleotit</span><span class="val"><span class="num" id="cCyt">44</span><span class="tag down">azalır</span></span></div>
      <div class="tile" id="tNucFree"><span class="lbl">Çekirdekte serbest nükleotit</span><span class="val"><span class="num" id="cNucFree">0</span><span class="tag both">artar, azalır</span></span></div>
    </div>
    <div class="tiles3">
      <div class="tile" id="tDna"><span class="lbl">DNA molekülü</span><span class="val"><span class="num" id="cDna">1</span><span class="tag up">artar</span></span></div>
      <div class="tile" id="tChain"><span class="lbl">DNA zinciri</span><span class="val"><span class="num" id="cChain">2</span><span class="tag up">artar</span></span></div>
      <div class="tile" id="tNuc"><span class="lbl">DNA'daki nükleotit</span><span class="val"><span class="num" id="cNuc">28</span><span class="tag up">artar</span></span></div>
    </div>

    <div class="seq" id="seq"></div>
    <div class="verdicts" id="verdicts"></div>
  </aside>
</div>

<script>
(function(){'use strict';
/* ---------- shared data ---------- */
var N=14, P0=44, ERR_COL=8, CHAIN0=2*N;
var SEQ='ATGCCGTAAGCTAG'.split('');
var COMP={A:'T',T:'A',G:'C',C:'G'};
var $=function(id){return document.getElementById(id);};
var clamp01=function(x){return x<0?0:x>1?1:x;};
function rng(seed){var s=seed>>>0;return function(){s=(s*1664525+1013904223)>>>0;return s/4294967296;};}

/* ---------- geometry (canvas units 1000 x 720) ---------- */
var W=1000,H=720;
var CELL={x:500,y:360,rx:440,ry:332};
var NUC={x:110,y:210,w:780,h:300,r:110};
var PORES=[330,500,670];
var X0=205,DX=(795-205)/(N-1),CY=360,R=52,RD=28,DL=88,KT=0.55,TMAX=4;
var MITOS=[[215,165,-18],[785,165,18],[225,560,16]];
var ER_BOX=[735,528,815,572];
var RIBOS=(function(){
  var r=rng(5),out=[],tries=0;
  while(out.length<24&&tries<6000){
    tries++;
    var x=60+r()*880,y=30+r()*660;
    var ex=(x-500)/414,ey=(y-360)/306;
    if(ex*ex+ey*ey>1)continue;
    if(x>NUC.x-18&&x<NUC.x+NUC.w+18&&y>NUC.y-18&&y<NUC.y+NUC.h+18)continue;
    if(x>235&&x<765&&((y>44&&y<152)||(y>574&&y<676)))continue;
    if(x>ER_BOX[0]-14&&x<ER_BOX[2]+14&&y>ER_BOX[1]-14&&y<ER_BOX[3]+14)continue;
    var bad=false;
    MITOS.forEach(function(m){if(Math.hypot(x-m[0],y-m[1])<54)bad=true;});
    out.forEach(function(q){if(Math.hypot(x-q[0],y-q[1])<26)bad=true;});
    if(!bad)out.push([x,y]);
  }
  return out;
})();
/* ---------- state ---------- */
var OLD=[43,58,103], NEW=[214,51,108], SLATE=[124,134,168];
var LCOL={A:[34,160,107],T:[232,87,63],G:[47,125,225],C:[242,183,5]};
var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var st={T:0,playing:false,speed:0.16,mode:'ok',labels:true,stepTarget:null,t:0,errLetter:'A',members:[],last:{}};
var cv=$('cv'), mainCtx=cv.getContext('2d'), ctx=mainCtx, off=document.createElement('canvas'), sc=1, items=[], overlay=[], phase=0;
var u1=0,u2=0,u3=0,u4=0,p1=0,DLe=DL;

function sm(x){x=clamp01(x);return x*x*(3-2*x);}
function ease3(a){return 1-Math.pow(1-a,3);}
function openAt(u){return sm((p1-u)/3);}
function attOf(i){return clamp01((u3*(N+1.5)-i)/1.5);}
function shade(c,f){var a=f>=0?[c[0]+(255-c[0])*f,c[1]+(255-c[1])*f,c[2]+(255-c[2])*f]:[c[0]*(1+f),c[1]*(1+f),c[2]*(1+f)];return 'rgb('+a.map(Math.round).join(',')+')';}
function lerpC(a,b,t){return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];}
function dshade(z){return 0.42*(1-(z+1)/2);}

/* sid: 0 eski zincir-1, 1 yeni zincir-1 (üst DNA), 2 eski zincir-2, 3 yeni zincir-2 (alt DNA) */
function strandPt(sid,u){
  var o=openAt(u),th=KT*u+phase,s=Math.sin(th),c=Math.cos(th),Rs=R+(RD-R)*o;
  var ty=CY+(sid<2?-DLe:DLe)*o,y,z;
  if(sid===0||sid===3){y=ty+Rs*s;z=c;}else{y=ty-Rs*s;z=-c;}
  return {x:X0+u*DX,y:y,z:z,ty:ty};
}

function newState(){
  st.T=0;st.playing=false;st.stepTarget=null;st.last={};
  var need=COMP[SEQ[ERR_COL]],opts='ATGC'.split('').filter(function(l){return l!==need;});
  st.errLetter=opts[Math.floor(Math.random()*opts.length)];
  var m=[];
  [0,1].forEach(function(zone){
    var slots=[],row,c;
    for(row=0;row<2;row++){for(c=0;c<11;c++){
      slots.push({x:270+c*46+(Math.random()*2-1)*6,y:(zone===0?(row?118:72):(row?602:648))+(Math.random()*2-1)*4});
    }}
    slots.sort(function(){return Math.random()-0.5;});
    var used=slots.slice(0,N).sort(function(a,b){return a.x-b.x;}),free=slots.slice(N);
    used.forEach(function(sl,col){
      var L=zone===0?COMP[SEQ[col]]:SEQ[col];
      if(zone===0&&col===ERR_COL&&st.mode==='err')L=st.errLetter;
      m.push({col:col,s:zone,letter:L,used:true,hx:sl.x,hy:sl.y,ph:Math.random()*6.28,pore:nearestPore(sl.x)});
    });
    free.forEach(function(sl){m.push({col:-1,s:zone,letter:'ATGC'[Math.floor(Math.random()*4)],used:false,hx:sl.x,hy:sl.y,ph:Math.random()*6.28,pore:0});});
  });
  st.members=m;
}
function nearestPore(x){var b=0;PORES.forEach(function(p,i){if(Math.abs(p-x)<Math.abs(PORES[b]-x))b=i;});return PORES[b];}

/* ---------- helpers ---------- */
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function pent(x,y,r){ctx.beginPath();for(var k=0;k<5;k++){var a=-Math.PI/2+k*Math.PI*2/5;ctx.lineTo(x+r*Math.cos(a),y+r*Math.sin(a));}ctx.closePath();}

/* ---------- static cell layer (drawn once per size) ---------- */
function drawStatic(){
  ctx=off.getContext('2d');ctx.setTransform(sc,0,0,sc,0,0);ctx.clearRect(0,0,W,H);
  /* hücre zarı + sitoplazma */
  var g=ctx.createRadialGradient(500,330,40,500,360,470);g.addColorStop(0,'#f3f9fd');g.addColorStop(1,'#d6e9f6');
  ctx.beginPath();ctx.ellipse(CELL.x,CELL.y,CELL.rx,CELL.ry,0,0,6.283);ctx.fillStyle=g;ctx.fill();
  ctx.lineWidth=9;ctx.strokeStyle='#e59aa6';ctx.stroke();
  ctx.beginPath();ctx.ellipse(CELL.x,CELL.y,CELL.rx-11,CELL.ry-11,0,0,6.283);ctx.lineWidth=2.5;ctx.strokeStyle='#fbd5db';ctx.setLineDash([1,7]);ctx.lineCap='round';ctx.stroke();ctx.setLineDash([]);
  /* endoplazmik retikulum */
  ctx.lineCap='round';ctx.lineWidth=7;ctx.strokeStyle='#8fb4d4';
  for(var k=0;k<4;k++){
    ctx.beginPath();
    for(var x=ER_BOX[0];x<=ER_BOX[2];x+=4){var y=ER_BOX[1]+4+k*11+4*Math.sin((x-ER_BOX[0])/9+k);if(x===ER_BOX[0])ctx.moveTo(x,y);else ctx.lineTo(x,y);}
    ctx.stroke();
  }
  /* mitokondri */
  MITOS.forEach(function(m){
    ctx.save();ctx.translate(m[0],m[1]);ctx.rotate(m[2]*Math.PI/180);
    var mg=ctx.createLinearGradient(0,-18,0,18);mg.addColorStop(0,'#ffe1c8');mg.addColorStop(1,'#f7b98c');
    ctx.beginPath();ctx.ellipse(0,0,38,18,0,0,6.283);ctx.fillStyle=mg;ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='#e08a52';ctx.stroke();
    ctx.lineWidth=2;
    for(var j=-2;j<=2;j++){ctx.beginPath();ctx.moveTo(j*12,-11);ctx.quadraticCurveTo(j*12+6,-5.5,j*12,0);ctx.quadraticCurveTo(j*12-6,5.5,j*12,11);ctx.stroke();}
    ctx.restore();
  });
  /* küçük kesecikler */
  [[865,548,12],[140,300,8],[868,300,8]].forEach(function(v){ctx.beginPath();ctx.arc(v[0],v[1],v[2],0,6.283);ctx.fillStyle='#f3d1dd';ctx.fill();ctx.lineWidth=2.5;ctx.strokeStyle='#d78ca3';ctx.stroke();});
  /* ribozomlar */
  ctx.fillStyle='#3d4d85';RIBOS.forEach(function(q){ctx.beginPath();ctx.arc(q[0],q[1],3.8,0,6.283);ctx.fill();});
  /* çekirdek */
  var ng=ctx.createLinearGradient(0,NUC.y,0,NUC.y+NUC.h);ng.addColorStop(0,'#f8f5ff');ng.addColorStop(1,'#ece7fc');
  rr(NUC.x,NUC.y,NUC.w,NUC.h,NUC.r);ctx.fillStyle=ng;ctx.fill();ctx.lineWidth=6;ctx.strokeStyle='#8d79d9';ctx.stroke();
  rr(NUC.x+12,NUC.y+12,NUC.w-24,NUC.h-24,NUC.r-12);ctx.lineWidth=2.5;ctx.strokeStyle='#bcaef0';ctx.setLineDash([22,14]);ctx.stroke();ctx.setLineDash([]);
  /* gözenekler */
  PORES.forEach(function(px){[NUC.y,NUC.y+NUC.h].forEach(function(py){
    rr(px-24,py-13,48,26,13);ctx.fillStyle='#ffffff';ctx.fill();ctx.lineWidth=3.5;ctx.strokeStyle='#8d79d9';ctx.stroke();
    ctx.lineWidth=2;ctx.strokeStyle='#cfc5f5';ctx.setLineDash([3,4]);ctx.beginPath();ctx.moveTo(px,py-9);ctx.lineTo(px,py+9);ctx.stroke();ctx.setLineDash([]);
  });});
  ctx=mainCtx;
}

/* ---------- dynamic pieces ---------- */
function seg(a,b,z,c){
  ctx.strokeStyle=shade(c,dshade(z));ctx.lineWidth=6.5+3.5*z;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
  if(z>0.1){ctx.strokeStyle='rgba(255,255,255,.3)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(a.x-1,a.y-1.5);ctx.lineTo(b.x-1,b.y-1.5);ctx.stroke();}
}
function pushRibbon(sid,h){
  var c=(sid===0||sid===2)?OLD:NEW,n=4,k;
  for(k=0;k<n;k++){(function(k){
    var a=strandPt(sid,(h+k/n)/2),b=strandPt(sid,(h+(k+1)/n)/2),z=(a.z+b.z)/2;
    items.push({z:z,f:function(){seg(a,b,z,c);}});
  })(k);}
}
function pushNuc(o){
  var len=Math.hypot(o.vx,o.vy),t=(o.z+1)/2;
  items.push({z:o.z*0.6,f:function(){
    if(len<3)return;
    var k=Math.max(0,len-(o.sh||0))/len,ex=o.nx+o.vx*k,ey=o.ny+o.vy*k,lc=LCOL[o.letter];
    ctx.lineCap='butt';
    ctx.strokeStyle=shade(lc,-0.3);ctx.lineWidth=13;ctx.beginPath();ctx.moveTo(o.nx,o.ny);ctx.lineTo(ex,ey);ctx.stroke();
    ctx.strokeStyle=shade(lc,0.4*(1-t));ctx.lineWidth=9.5;ctx.beginPath();ctx.moveTo(o.nx,o.ny);ctx.lineTo(ex,ey);ctx.stroke();
    if(len*k>=26){
      ctx.fillStyle=o.letter==='C'?'#16213a':'#fff';ctx.font='700 14px "JetBrains Mono",monospace';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(o.letter,(o.nx+ex)/2,(o.ny+ey)/2+1);
    }
  }});
  items.push({z:o.z+0.03,f:function(){
    pent(o.nx,o.ny,9.5);ctx.fillStyle=shade(o.col,dshade(o.z));ctx.fill();ctx.lineWidth=2;ctx.strokeStyle='#fff';ctx.stroke();
  }});
  items.push({z:o.pz+0.03,f:function(){
    ctx.beginPath();ctx.arc(o.px,o.py,6.5,0,6.283);ctx.fillStyle='#fff';ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=shade(o.col,dshade(o.pz));ctx.stroke();
  }});
}
function dots(x,y){
  items.push({z:0.95,f:function(){
    [-6.5,0,6.5].forEach(function(d){ctx.beginPath();ctx.arc(x,y+d,2.7,0,6.283);ctx.fillStyle='#fff';ctx.fill();ctx.lineWidth=1.2;ctx.strokeStyle='#8a93b3';ctx.stroke();});
  }});
}
function drift(m,a){var k=reduce?0:a;return {x:k*Math.sin(st.t*0.8+m.ph),y:k*0.85*Math.cos(st.t*0.65+m.ph*1.3)};}
function polyPt(pts,s){
  var ls=[],tot=0,i;
  for(i=1;i<pts.length;i++){var l=Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y);ls.push(l);tot+=l;}
  var d=s*tot,acc=0;
  for(i=0;i<ls.length;i++){
    if(d<=acc+ls[i]||i===ls.length-1){var f=ls[i]?(d-acc)/ls[i]:0;f=clamp01(f);return {x:pts[i].x+(pts[i+1].x-pts[i].x)*f,y:pts[i].y+(pts[i+1].y-pts[i].y)*f,d:d,l1:ls[0],l2:ls[1]};}
    acc+=ls[i];
  }
}
function label(text,tx,ty,lx,ly,anchor){
  ctx.save();
  ctx.strokeStyle='#6b7494';ctx.lineWidth=1.8;ctx.beginPath();ctx.moveTo(tx,ty);ctx.lineTo(lx,ly);ctx.stroke();
  ctx.beginPath();ctx.arc(lx,ly,3.5,0,6.283);ctx.fillStyle='#6b7494';ctx.fill();
  ctx.font='700 19px "Nunito Sans",sans-serif';ctx.textAlign=anchor||'left';ctx.textBaseline='alphabetic';
  ctx.lineJoin='round';ctx.lineWidth=5;ctx.strokeStyle='#fff';ctx.strokeText(text,anchor==='right'?tx:tx,ty+0);
  ctx.fillStyle='#16213a';
  ctx.restore();
}
function labelText(text,x,y){
  ctx.save();ctx.font='700 19px "Nunito Sans",sans-serif';ctx.textAlign='left';ctx.textBaseline='middle';
  ctx.lineJoin='round';ctx.lineWidth=5;ctx.strokeStyle='#fff';ctx.strokeText(text,x,y);ctx.fillStyle='#16213a';ctx.fillText(text,x,y);ctx.restore();
}
function lead(x1,y1,x2,y2){
  ctx.save();ctx.strokeStyle='#6b7494';ctx.lineWidth=1.8;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
  ctx.beginPath();ctx.arc(x2,y2,3.5,0,6.283);ctx.fillStyle='#6b7494';ctx.fill();ctx.restore();
}
var rb=RIBOS.reduce(function(a,b){return Math.hypot(b[0]-868,b[1]-118)<Math.hypot(a[0]-868,a[1]-118)?b:a;},RIBOS[0]);
function drawLabels(){
  lead(122,52,176,135);labelText('Hücre zarı',14,52);
  lead(118,150,178,163);labelText('Mitokondri',14,150);
  lead(112,672,212,596);labelText('Sitoplazma',14,672);
  lead(890,48,800,214);labelText('Çekirdek',872,48);
  lead(868,118,rb[0],rb[1]);labelText('Ribozom',872,118);
  lead(548,188,521,206);labelText('Gözenek',552,184);
  lead(838,696,800,568);labelText('Endoplazmik retikulum',742,708);
}

/* ---------- frame ---------- */
function build(){
  items.length=0;overlay.length=0;
  var i,h,err=st.mode==='err';
  var stageTop=CY-DL+68,stageBot=CY+DL-68;
  /* eski zincirler */
  [0,2].forEach(function(s){for(h=-1;h<=2*(N-1);h++){pushRibbon(s,h);}});
  /* yeni zincirler (nükleotit yerine oturunca görünür) */
  [1,3].forEach(function(s){for(h=-1;h<=2*(N-1)-1;h++){
    var idx=(h%2===0)?h/2+1:(h+1)/2;if(idx>=N)continue;
    if(attOf(idx)>=0.999)pushRibbon(s,h);
  }});
  /* eski nükleotitler */
  [0,2].forEach(function(s){for(i=0;i<N;i++){
    var n=strandPt(s,i),p=strandPt(s,i-0.5),L=s===0?SEQ[i]:COMP[SEQ[i]];
    var shorten=(err&&s===0&&i===ERR_COL&&attOf(i)>0.98)?5:0;
    pushNuc({nx:n.x,ny:n.y,vx:0,vy:n.ty-n.y,px:p.x,py:p.y,pz:p.z,z:n.z,letter:L,col:OLD,sh:shorten});
  }});
  /* yeni ve serbest nükleotitler */
  var entered=0,landed=0;
  st.members.forEach(function(m){
    var top=m.s===0,v0=top?30:-30,vS=-v0,sgn=top?1:-1;
    var s=0,e3=0,d=drift(m,6),nx=m.hx+d.x,ny=m.hy+d.y,crossed=false;
    var vy=v0,poff=sgn*-8,col=SLATE,z=0.4,pz=0.4,shorten=0;
    if(m.used){
      var a2=clamp01((u2-(m.col/(N-1))*0.6)/0.4);s=sm(a2);e3=ease3(attOf(m.col));
      if(s>0){
        var W0={x:nx,y:ny},W1={x:m.pore,y:top?NUC.y-30:NUC.y+NUC.h+30},W2={x:m.pore,y:top?NUC.y+36:NUC.y+NUC.h-36},W3={x:X0+m.col*DX,y:top?stageTop:stageBot};
        var q=polyPt([W0,W1,W2,W3],s),sd=drift(m,3),w=sm((s-0.9)/0.1);
        nx=q.x+sd.x*w;ny=q.y+sd.y*w;crossed=q.d>=q.l1+q.l2*0.5;
        vy=v0+(vS-v0)*s;poff=sgn*(-8+16*s);
      }
      if(crossed)entered++;
      if(e3>0){
        var sid=top?1:3,T=strandPt(sid,m.col),Q=strandPt(sid,m.col-0.5);
        nx=nx*(1-e3)+T.x*e3;ny=ny*(1-e3)+T.y*e3;
        var px0=nx,py0=ny;
        vy=vy*(1-e3)+(T.ty-T.y)*e3;z=0.4*(1-e3)+T.z*e3;pz=0.4*(1-e3)+Q.z*e3;col=lerpC(SLATE,NEW,e3);
        m._Q=Q;
        if(err&&top&&m.col===ERR_COL&&e3>0.98)shorten=7;
      }
      if(attOf(m.col)>=0.98)landed++;
    }
    var phx=nx-13,phy=ny+poff;
    if(m.used&&e3>0){phx=phx*(1-e3)+m._Q.x*e3;phy=phy*(1-e3)+m._Q.y*e3;}
    pushNuc({nx:nx,ny:ny,vx:0,vy:vy,px:phx,py:phy,pz:pz,z:z,letter:m.letter,col:col,sh:shorten});
  });
  st.entered=entered;st.landed=landed;
  /* hidrojen bağları */
  for(i=0;i<N;i++){
    var o=openAt(i),x=X0+i*DX;
    if(o<0.6){
      (function(x,o){
        if(o>0.01){items.push({z:0.9,f:function(){
          ctx.save();ctx.globalAlpha=1-o/0.6;ctx.setLineDash([4,4]);ctx.strokeStyle='#8a93b3';ctx.lineWidth=2;
          ctx.beginPath();ctx.moveTo(x,CY-DLe*o);ctx.lineTo(x,CY+DLe*o);ctx.stroke();ctx.restore();}});}
        if(o<0.2){dots(x,CY);}
      })(x,o);
    }
    if(attOf(i)>=0.98){
      if(!(err&&i===ERR_COL))dots(x,CY-DLe*o);
      dots(x,CY+DLe*o);
    }
  }
  /* enzim: adım 1 */
  var xf=X0+p1*DX+6,ea=(u1>0&&u1<1)?clamp01((N+2.4-p1)/0.8):(u1<=0?1:0);
  if(st.T<1&&ea>0){
    items.push({z:-2,f:function(){
      ctx.save();ctx.globalAlpha=ea*0.95;
      var g=ctx.createRadialGradient(xf-8,CY-14,6,xf,CY,60);g.addColorStop(0,'#e3f9ee');g.addColorStop(1,'#9fe0c0');
      ctx.beginPath();ctx.ellipse(xf,CY,38,58,0,0,6.283);ctx.fillStyle=g;ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='#1f9d63';ctx.stroke();ctx.restore();}});
    overlay.push(function(){
      ctx.save();ctx.globalAlpha=ea;
      var lx=xf+52,ly=CY-96;
      ctx.strokeStyle='#1f9d63';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(xf+20,CY-42);ctx.lineTo(lx-28,ly+14);ctx.stroke();
      rr(lx-34,ly-15,68,30,15);ctx.fillStyle='#fff';ctx.fill();ctx.strokeStyle='#1f9d63';ctx.lineWidth=2.5;ctx.stroke();
      ctx.fillStyle='#0d6b41';ctx.font='700 17px "Nunito Sans",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('Enzim',lx,ly+1);
      ctx.restore();});
  }
  /* hata göstergesi */
  if(err&&attOf(ERR_COL)>=0.98){
    var ex=X0+ERR_COL*DX,ey=CY-DLe,pul=0.5+0.5*Math.sin(st.t*5);
    overlay.push(function(){
      ctx.save();
      var g=ctx.createRadialGradient(ex,ey,2,ex,ey,26);g.addColorStop(0,'rgba(217,45,58,'+(0.35+0.25*pul)+')');g.addColorStop(1,'rgba(217,45,58,0)');
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(ex,ey,26,0,6.283);ctx.fill();
      ctx.strokeStyle='#d92d3a';ctx.lineWidth=4;ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(ex-7,ey-7);ctx.lineTo(ex+7,ey+7);ctx.moveTo(ex+7,ey-7);ctx.lineTo(ex-7,ey+7);ctx.stroke();
      ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(ex,ey+RD+16);ctx.lineTo(ex,ey+64);ctx.stroke();
      rr(ex-82,ey+64,164,34,17);ctx.fillStyle='#d92d3a';ctx.fill();
      ctx.fillStyle='#fff';ctx.font='700 17px "Nunito Sans",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('Yanlış eşleşme',ex,ey+82);
      ctx.restore();});
  }
  /* adım 4: DNA adları */
  if(u4>0){
    var la=sm(u4*2);
    [['DNA 1',CY-DLe+64],['DNA 2',CY+DLe-64]].forEach(function(l){
      overlay.push(function(){
        ctx.save();ctx.globalAlpha=la;rr(290-40,l[1]-16,80,32,16);ctx.fillStyle='#fff';ctx.fill();ctx.lineWidth=2.5;ctx.strokeStyle='#2b3a67';ctx.stroke();
        ctx.fillStyle='#2b3a67';ctx.font='700 17px "Sora",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(l[0],290,l[1]+1);ctx.restore();});
    });
  }
}
function drawScene(){
  var T=st.T;u1=clamp01(T);u2=clamp01(T-1);u3=clamp01(T-2);u4=clamp01(T-3);
  p1=u1*(N+3);DLe=DL+8*sm(u4);phase=reduce?0.6:st.t*0.35;
  ctx=mainCtx;ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);
  if(off.width){ctx.drawImage(off,0,0);}
  ctx.setTransform(sc,0,0,sc,0,0);
  build();
  items.sort(function(a,b){return a.z-b.z;});
  items.forEach(function(it){it.f();});
  overlay.forEach(function(f){f();});
  if(st.labels)drawLabels();
}

/* ---------- panels ---------- */
var seqCells={d1new:[],d2new:[],d1old:[],d2old:[],p1:[],p2:[]};
function rowEl(parent,kind,key){
  var row=document.createElement('div');row.className='seqrow';
  var bar=document.createElement('i');bar.className='bar '+kind;row.appendChild(bar);
  var cells=document.createElement('div');cells.className='cells';
  for(var i=0;i<N;i++){var c=document.createElement('div');c.className='cell';cells.appendChild(c);seqCells[key].push(c);}
  row.appendChild(cells);parent.appendChild(row);
}
function setCell(c,l){if(l){c.dataset.l=l;c.textContent=l;c.classList.remove('empty');}else{c.removeAttribute('data-l');c.textContent='';c.classList.add('empty');}c.classList.remove('bad');}
function buildSeq(){
  var box=$('seq');
  function blk(title,rows){
    var b=document.createElement('div');b.className='blk';
    var h=document.createElement('h3');h.textContent=title;b.appendChild(h);
    var rs=document.createElement('div');rs.className='rows';b.appendChild(rs);
    rows.forEach(function(r){rowEl(rs,r[0],r[1]);});box.appendChild(b);
  }
  blk('Ana DNA',[['old','p1'],['old','p2']]);
  blk('DNA 1',[['old','d1old'],['new','d1new']]);
  blk('DNA 2',[['new','d2new'],['old','d2old']]);
  for(var i=0;i<N;i++){
    setCell(seqCells.p1[i],SEQ[i]);setCell(seqCells.p2[i],COMP[SEQ[i]]);
    setCell(seqCells.d1old[i],SEQ[i]);setCell(seqCells.d2old[i],COMP[SEQ[i]]);
  }
}
function updateSeq(){
  var n=0,i;for(i=0;i<N;i++){if(attOf(i)>=0.999)n++;}
  var key=n+st.mode+st.errLetter;if(st.last.seq===key)return;st.last.seq=key;
  for(i=0;i<N;i++){
    if(i<n){
      var l1=(st.mode==='err'&&i===ERR_COL)?st.errLetter:COMP[SEQ[i]];
      setCell(seqCells.d1new[i],l1);setCell(seqCells.d2new[i],SEQ[i]);
      if(st.mode==='err'&&i===ERR_COL){seqCells.d1new[i].classList.add('bad');}
    }else{setCell(seqCells.d1new[i],null);setCell(seqCells.d2new[i],null);}
  }
}
function verdicts(done){
  var err=st.mode==='err',v=$('verdicts'),k=done?(err?'e':'o'):'w';
  if(st.last.ver===k)return;st.last.ver=k;
  var list;
  if(!done){list=[['','Sonuç, eşlenme bitince görünür.']];}
  else{list=[err?['no','DNA 1 ile DNA 2 aynı değil: bir nükleotit farklı (mutasyon).']:['yes','DNA 1 ile DNA 2 aynı: birbirinin kopyası.'],['info','Yeni zincirler aynı değil: biri diğerini tamamlar.']];}
  v.innerHTML=list.map(function(x){return '<div class="verdict '+x[0]+'">'+x[1]+'</div>';}).join('');
}
function setNum(id,val,tile){
  var e=$(id);if(e.textContent!==String(val)){e.textContent=val;var t=$(tile);if(t){t.classList.remove('flash');void t.offsetWidth;t.classList.add('flash');}}
}
var stepBtns=[].slice.call(document.querySelectorAll('#steps button'));
function panels(){
  var T=st.T,done=T>=3.6,ended=T>=TMAX-0.0001,err=st.mode==='err';
  var entered=st.entered||0,landed=st.landed||0;
  setNum('cCyt',P0-entered,'tCyt');setNum('cNucFree',entered-landed,'tNucFree');
  setNum('cDna',done?2:1,'tDna');setNum('cChain',done?4:2,'tChain');setNum('cNuc',CHAIN0+landed,'tNuc');
  $('prog').style.width=(100*clamp01(T/TMAX)).toFixed(1)+'%';
  updateSeq();verdicts(done);
  var ph=Math.min(3,Math.floor(T+1e-6));
  stepBtns.forEach(function(b,k){b.className=(ended||k<ph)?'done':(k===ph&&T>0?'on':'');if(ended&&k===3)b.className='on';});
  var step,text,cls='';
  if(T<=0.001&&!st.playing){step='Hazır';text='Hücrenin çekirdeğinde bir DNA var. Başlat\'a bas.';}
  else if(done){step='4 · İki DNA';if(err){text='DNA\'lardan birinde yanlış nükleotit var. Dizi değişti, buna mutasyon denir.';cls='bad';}else{text='İki DNA oluştu. İkisi birbirinin kopyası. Her birinde 1 eski, 1 yeni zincir var.';cls='good';}}
  else if(err&&attOf(ERR_COL)>=0.98){step='Hata';text='Yanlış nükleotit eşleşti. Bu bir eşlenme hatasıdır.';cls='bad';}
  else if(ph===0){step='1 · Ayrılma';text='Enzim, DNA\'nın iki zincirini fermuar gibi birbirinden ayırıyor.';}
  else if(ph===1){step='2 · Giriş';text='Sitoplazmadaki serbest nükleotitler, çekirdek zarındaki gözeneklerden çekirdeğe giriyor.';}
  else{step='3 · Eşleşme';text='Nükleotitler kalıp zincirlere A–T ve G–C kuralıyla eşleşip yeni zincirleri oluşturuyor.';}
  var key=step+text+cls;
  if(st.last.cap!==key){st.last.cap=key;$('capStep').textContent=step;$('capText').textContent=text;$('caption').className='caption '+cls;}
  var lab=ended?'Tekrar oynat':st.playing?'Duraklat':T>0.001?'Devam et':'Başlat';
  if($('btnPlay').textContent!==lab)$('btnPlay').textContent=lab;
  $('btnStep').disabled=ended;
}

/* ---------- controls ---------- */
function resetAll(){newState();}
$('btnPlay').addEventListener('click',function(){
  if(st.T>=TMAX-0.0001){resetAll();st.playing=true;return;}
  st.stepTarget=null;st.playing=!st.playing;
});
$('btnStep').addEventListener('click',function(){
  if(st.T>=TMAX-0.0001)return;
  st.playing=false;st.stepTarget=Math.min(TMAX,Math.floor(st.T+1e-6)+1);
});
$('btnReset').addEventListener('click',resetAll);
stepBtns.forEach(function(b){b.addEventListener('click',function(){st.T=parseInt(b.dataset.k,10);st.playing=false;st.stepTarget=null;});});
function segCtl(idEl,fn){
  var g=$(idEl);
  g.addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b)return;
    g.querySelectorAll('button').forEach(function(x){x.setAttribute('aria-pressed',x===b?'true':'false');});
    fn(b.dataset.v);
  });
}
segCtl('segMode',function(v){st.mode=v;resetAll();});
segCtl('segSpeed',function(v){st.speed=parseFloat(v);});
segCtl('segLabels',function(v){st.labels=v==='1';});
document.addEventListener('keydown',function(e){if(e.code==='Space'&&e.target.tagName!=='BUTTON'){e.preventDefault();$('btnPlay').click();}});

function resize(){
  var box=$('stagebox'),dpr=Math.min(2,window.devicePixelRatio||1);
  var bw=box.clientWidth||600,bh=box.clientHeight||600,narrow=window.innerWidth<=900;
  var w=narrow?bw:Math.min(bw,bh*W/H);
  cv.style.width=w+'px';cv.style.height=(w*H/W)+'px';
  cv.width=Math.round(w*dpr);cv.height=Math.round(w*dpr*H/W);sc=cv.width/W;
  off.width=cv.width;off.height=cv.height;drawStatic();
}
window.addEventListener('resize',resize);
if(window.ResizeObserver){new ResizeObserver(resize).observe($('stagebox'));}

var lastT=performance.now();
function tick(now){
  var dt=Math.min(0.05,(now-lastT)/1000);lastT=now;st.t+=dt;
  if(st.playing){st.T=Math.min(TMAX,st.T+st.speed*dt);if(st.T>=TMAX)st.playing=false;}
  else if(st.stepTarget!==null){st.T=Math.min(st.stepTarget,st.T+0.32*dt);if(st.T>=st.stepTarget)st.stepTarget=null;}
  drawScene();panels();
  requestAnimationFrame(tick);
}
newState();buildSeq();resize();
requestAnimationFrame(tick);
})();
</script>
