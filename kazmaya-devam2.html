<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Kazmaya Devam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#120c08; --panel:#1d1510; --panel2:#2a1f17; --line:#3d2e22;
  --ink:#f7ecdf; --muted:#bfa992; --accent:#ffb43f; --ok:#4cd07d; --bad:#ff5d5d; --blue:#5cc8ff; --gold:#ffd23f;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:'Fredoka',system-ui,'Segoe UI',sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
button{font-family:inherit;cursor:pointer;border:none}
#app{display:flex;height:100vh;width:100vw}
#gameWrap{position:relative;flex:1;min-width:0;overflow:hidden}
#game{display:block;width:100%;height:100%;touch-action:none}
#hud{width:310px;flex-shrink:0;background:var(--panel);border-left:2px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:8px;overflow-y:auto}
.brand{font-size:22px;font-weight:700;color:var(--accent)}
.brand small{display:block;font-size:12px;font-weight:400;color:var(--muted)}
.card{background:var(--panel2);border-radius:14px;padding:8px 12px}
.lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.lbl b{float:right;color:var(--ink);font-weight:600;letter-spacing:0}
#depth{font-size:30px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
#zoneName{font-size:14px;color:var(--accent);font-weight:500}
.two{display:grid;grid-template-columns:1fr 1.25fr;gap:8px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.stat{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat small{display:block;font-size:10px;color:var(--muted);font-weight:400;text-transform:uppercase;letter-spacing:1px}
.bar{height:14px;border-radius:9px;background:#0d0906;overflow:hidden;margin-top:4px;border:1px solid var(--line)}
.bar>div{height:100%;width:100%;transition:width .25s,background .25s}
#drillName{font-size:16px;font-weight:600;margin-top:2px}
#owed{font-size:12px;color:#ffb3a3;margin-top:4px;display:none}
.rocks{display:flex;flex-direction:column;gap:3px;margin-top:4px}
.rock{display:flex;align-items:center;gap:8px;font-size:14px}
.sw{width:20px;height:20px;border-radius:5px;flex-shrink:0;border:1px solid rgba(0,0,0,.4)}
.chip{margin-left:auto;font-size:11px;padding:2px 8px;border-radius:99px;font-weight:600;color:#1a1000}
#parca{display:none;font-size:14px}
#mini{width:100%;max-width:150px;align-self:center;aspect-ratio:1}
.hbtns{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;margin-top:auto}
.hbtns .btn{font-size:15px;white-space:nowrap;padding:11px 8px}
.btn{background:var(--accent);color:#2a1700;font-weight:600;font-size:17px;padding:11px 12px;border-radius:14px;box-shadow:0 4px 0 #a96a10;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #a96a10}
.btn.ghost{background:var(--panel2);color:var(--ink);box-shadow:0 4px 0 #0d0906}
.btn.blue{background:#4fb6f0;color:#06263a;box-shadow:0 4px 0 #20709c}
.btn:disabled{opacity:.4}
#pad{position:absolute;right:18px;bottom:18px;display:grid;grid-template-columns:repeat(3,78px);grid-template-rows:repeat(2,78px);gap:8px;touch-action:none}
#pad button{background:rgba(255,255,255,.14);backdrop-filter:blur(4px);border:2px solid rgba(255,255,255,.25);border-radius:18px;color:#fff;font-size:34px;display:flex;align-items:center;justify-content:center}
#pad button:active,#pad button.on{background:rgba(255,180,63,.55)}
#pad .u{grid-column:2}#pad .l{grid-column:1;grid-row:2}#pad .d{grid-column:2;grid-row:2}#pad .r{grid-column:3;grid-row:2}
#banner{position:absolute;left:50%;top:14%;transform:translate(-50%,-20px);text-align:center;pointer-events:none;opacity:0;transition:opacity .5s,transform .5s;width:min(90%,700px)}
#banner.show{opacity:1;transform:translate(-50%,0)}
#banner .bz{font-size:15px;letter-spacing:3px;color:var(--accent);text-transform:uppercase;text-shadow:0 2px 8px #000}
#banner .bt{font-size:48px;font-weight:700;text-shadow:0 4px 18px #000}
#banner .bi{font-size:20px;color:#f1e3d2;text-shadow:0 2px 10px #000;margin-top:4px}
#toast{position:absolute;left:50%;top:18px;transform:translateX(-50%);background:rgba(20,13,8,.94);border:1px solid var(--line);padding:10px 18px;border-radius:14px;font-size:18px;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90%;text-align:center}
#toast.show{opacity:1}
#overlay{position:fixed;inset:0;background:rgba(5,3,2,.72);display:none;align-items:center;justify-content:center;z-index:10;padding:16px}
#overlay.show{display:flex}
#modal{background:var(--panel);border:2px solid var(--line);border-radius:24px;padding:24px 28px;width:min(660px,100%);max-height:94vh;overflow-y:auto;box-shadow:0 20px 60px #000;animation:pop .28s cubic-bezier(.2,1.4,.5,1)}
#modal.legend{border-color:var(--gold);box-shadow:0 0 40px rgba(255,210,63,.35),0 20px 60px #000}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.tag{display:inline-block;font-size:13px;letter-spacing:2px;text-transform:uppercase;padding:4px 10px;border-radius:99px;background:var(--panel2);color:var(--accent);margin-bottom:10px}
.tag.haz{color:var(--bad)}.tag.lm{color:var(--blue)}.tag.ok{color:var(--ok)}.tag.gold{color:#1a1000;background:var(--gold)}
.memoji{font-size:80px;line-height:1;text-align:center;margin:4px 0 8px}
.mt{font-size:30px;font-weight:700;text-align:center;line-height:1.15}
.md{font-size:14px;color:var(--muted);text-align:center;margin-top:4px}
.mx{font-size:20px;line-height:1.45;margin-top:14px;text-align:center}
.mact{display:flex;gap:10px;justify-content:center;margin-top:20px;flex-wrap:wrap}
.mact .btn{font-size:20px;padding:14px 26px}
.q{font-size:23px;font-weight:600;text-align:center;margin:10px 0 14px;line-height:1.3}
.qimg{display:block;margin:6px auto 4px;width:120px;height:120px;border-radius:16px;border:3px solid var(--line)}
.opts{display:grid;gap:10px}
.opts.tf{grid-template-columns:1fr 1fr}
.opt{background:var(--panel2);color:var(--ink);font-size:20px;padding:15px;border-radius:14px;border:2px solid var(--line);text-align:left}
.opts.tf .opt{text-align:center;font-size:24px}
.opt.right{background:#1f5135;border-color:var(--ok)}
.opt.wrong{background:#5a2222;border-color:var(--bad)}
.opt.sel{border-color:var(--accent)}
.opt .num{display:none;min-width:30px;height:30px;line-height:30px;border-radius:99px;background:var(--accent);color:#1a1000;text-align:center;margin-right:8px;font-weight:700}
.opt.sel .num,.opt.right .num,.opt.wrong .num{display:inline-block}
.ex{margin-top:14px;font-size:18px;line-height:1.4;padding:12px 14px;border-radius:12px;background:var(--panel2)}
.reward{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.reward span{background:var(--panel2);border-radius:99px;padding:6px 12px;font-size:16px}
.reward span.good{background:#1f5135}.reward span.bad{background:#5a2222}
.howto{display:grid;gap:7px;margin-top:14px;font-size:18px}
.howto div{background:var(--panel2);border-radius:12px;padding:9px 14px}
.note{font-size:14px;color:var(--muted);margin-top:12px;text-align:center}
.zoneh{font-size:15px;color:var(--accent);margin:14px 0 8px;letter-spacing:1px;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.tile{background:var(--panel2);border-radius:12px;padding:10px 6px;text-align:center;border:2px solid transparent;color:var(--ink);position:relative}
.tile .te{font-size:32px}.tile .tn{font-size:12px;margin-top:4px;line-height:1.2}
.tile.no{opacity:.4}.tile.yes{border-color:#5a4632}.tile.leg{border-color:var(--gold)}
.endstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.endstats div{background:var(--panel2);border-radius:14px;padding:10px;text-align:center;font-size:24px;font-weight:700}
.endstats small{display:block;font-size:12px;font-weight:400;color:var(--muted)}
.bonus{font-size:15px;color:var(--muted);text-align:center;margin-top:8px}
.numpad{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}
.numpad button{background:var(--panel2);color:var(--ink);font-size:24px;padding:12px 0;border-radius:12px;border:2px solid var(--line)}
.numdisp{font-size:40px;font-weight:700;text-align:center;background:#0d0906;border-radius:14px;padding:6px;margin-top:10px;min-height:62px;letter-spacing:4px}
table.lb{width:100%;border-collapse:collapse;margin-top:10px;font-size:18px}
table.lb td,table.lb th{padding:7px 8px;text-align:center;border-bottom:1px solid var(--line)}
table.lb th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-weight:400}
table.lb tr.me td{background:#3a2a10;color:var(--gold);font-weight:700}
.seedrow{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:12px;font-size:17px}
@media (max-aspect-ratio:1/1),(max-width:820px){
  #app{flex-direction:column-reverse}
  #hud{width:100%;flex-direction:row;flex-wrap:wrap;border-left:none;border-top:2px solid var(--line);padding:8px;gap:6px;max-height:38vh}
  #hud>*{flex:1 1 150px}
  .brand,#mini{display:none}
  #depth{font-size:22px}
  .hbtns{margin-top:0;flex-basis:100%}
  #pad{grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,64px)}
  #banner .bt{font-size:32px}
  .endstats{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<div id="app">
  <div id="gameWrap">
    <canvas id="game"></canvas>
    <div id="banner"><div class="bz" id="bz"></div><div class="bt" id="bt"></div><div class="bi" id="bi"></div></div>
    <div id="toast"></div>
    <div id="pad">
      <button class="u" data-d="u" aria-label="Yukarı">▲</button>
      <button class="l" data-d="l" aria-label="Sol">◀</button>
      <button class="d" data-d="d" aria-label="Aşağı">▼</button>
      <button class="r" data-d="r" aria-label="Sağ">▶</button>
    </div>
  </div>
  <aside id="hud">
    <div class="brand">⛏️ Kazmaya Devam<small id="seedTxt">Harita #0000</small></div>
    <div class="card"><div class="lbl">Derinlik</div><div id="depth">0 m</div><div id="zoneName">Yüzey</div></div>
    <div class="card two">
      <div class="stat"><small>Sıcaklık</small><span id="temp">15 °C</span></div>
      <div class="stat"><small>Basınç</small><span id="press">1 atm</span></div>
    </div>
    <div class="card"><div class="lbl">⚡ Enerji <b id="enTxt">100</b></div><div class="bar"><div id="energyFill"></div></div></div>
    <div class="card">
      <div class="lbl">🔧 Matkap <b id="lvTxt">Seviye 1</b></div>
      <div id="drillName">🔩 Demir uç</div>
      <div class="lbl" style="margin-top:6px">Dayanıklılık <b id="durTxt">100</b></div>
      <div class="bar"><div id="durFill"></div></div>
      <div id="owed"></div>
    </div>
    <div class="card"><div class="lbl">Bu katmanın kayaçları</div><div class="rocks" id="rocks"></div></div>
    <div class="card three">
      <div class="stat"><small>Puan</small><span id="score">0</span></div>
      <div class="stat"><small>Keşif</small><span id="found">0</span></div>
      <div class="stat"><small>Süre</small><span id="time">0:00</span></div>
    </div>
    <div class="card" id="parca"></div>
    <canvas id="mini" width="300" height="300"></canvas>
    <div class="hbtns">
      <button class="btn blue" id="btnScan">📡 Tara (3)</button>
      <button class="btn ghost" id="btnMuseum">🏛️ Koleksiyon</button>
      <button class="btn ghost" id="btnSound" aria-label="Ses">🔊</button>
    </div>
  </aside>
</div>
<div id="overlay"><div id="modal"></div></div>

<script>
(()=>{
'use strict';
/* ====================================================== VERİ */
const COLS = 11;
const EMOJI_FONT = '"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';

// d = kazma zorluğu. Matkap seviyesinden ne kadar yüksekse matkap o kadar aşınır.
const MATS = {

  ferroperiklaz:{name:'Ferroperiklaz',c:'#583636',s:'#875a5a',d:8,info:'Alt mantoda bulunan, demir ve magnezyum içeren mineral.'},

  icdemir:{name:'Katı demir-nikel',c:'#e6c96a',s:'#fff3b8',s2:'#f5dc85',d:9,glow:1,info:'İç çekirdek, muazzam basınç yüzünden bu sıcaklıkta bile katıdır.'},
  tunnel:{name:'Metro tüneli'},oda:{name:'Yeraltı odası'},gate:{name:'Katman sınırı'},center:{name:'Merkez'}

const DRILLS=['','🔩 Demir uç','⚙️ Çelik uç','🛠️ Sertleştirilmiş çelik','🔶 Titanyum kaplama','🔷 Tungsten karbür','💠 Kübik bor nitrür','💎 Elmas kaplama','💎 Elmas uç','✨ Süper elmas'];
const MAXLV=9;
const TIER_COL=['','#9aa3ad','#c9d1d9','#d08a4a','#e0e0e8','#5ad1ff','#a98bff','#86f06a','#ff7ad1','#ffffff'];

const FINDS = {
  solucan:{z:0,e:'🪱',t:'Solucan',x:'Solucanlar toprağı kazarak havalandırır ve bitki atıklarını gübreye çevirir. Bir solucan bir günde neredeyse kendi ağırlığı kadar toprağı sindirebilir.'},
  karinca:{z:0,e:'🐜',t:'Karınca Yuvası',x:'Karıncalar toprağın altında odaları ve tünelleri olan koloniler kurar. Bazı yuvalarda milyonlarca karınca yaşar!'},

  sikke:{z:1,e:'🪙',t:'Antik Sikke',x:'Anadolu binlerce yıldır insanların yaşadığı bir yer. Bu yüzden toprak altından sık sık antik sikke ve eşyalar çıkar.'},
  mamut:{z:1,e:'🦣',t:'Mamut Dişi',x:'Buzul çağında yaşamış mamutların kemikleri ve dişleri bazen yalnızca birkaç metre derinlikte bulunur.'},

  ammonit:{z:2,e:'🐚',t:'Ammonit Fosili',x:'Ammonitler, dinozorlarla aynı dönemde denizlerde yaşamış sarmal kabuklu canlılardır. Karada bulunmaları, orasının bir zamanlar deniz olduğunu gösterir.'},
  trilobit:{z:2,e:'🪲',t:'Trilobit Fosili',x:'Trilobitler, 250 milyon yıldan daha uzun zaman önce yok olmuş deniz eklembacaklılarıdır.'},
  yaprak:{z:2,e:'🍃',t:'Yaprak Fosili',x:'Fosiller genellikle tortul kayaçlarda oluşur: Canlı kalıntısı çamurla örtülür ve milyonlarca yıl içinde taşlaşır.'},

function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function interp(tab,d){for(let i=1;i<tab.length;i++){if(d<=tab[i][0]){const[a,va]=tab[i-1],[b,vb]=tab[i];return va+(vb-va)*(d-a)/(b-a);}}return tab[tab.length-1][1];}

function buildWorld(sd){
  const R=mulberry(sd);
  const rp=a=>a[Math.floor(R()*a.length)];
  const rint=(a,b)=>a+Math.floor(R()*(b-a+1));
  const rsh=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
  rows=[{z:-1,d:0,type:'surface'}];
  grid=[Array.from({length:COLS},()=>({m:'air',dug:true}))];
  ZONES.forEach((Z,zi)=>{
    Z.first=rows.length;
    const n=Math.max(8,Z.rows+rint(-3,3));
    for(let i=0;i<n;i++){
      const last=i===n-1;const type=last?(Z.gate?'gate':'center'):'rock';
      rows.push({z:zi,d:Z.start+(Z.end-Z.start)*(i+1)/n,type});
      const r=rows.length-1,row=[];
      for(let c=0;c<COLS;c++){
        if(type!=='rock'){row.push({m:type,dug:false,seed:0});continue;}
        // damar oluşumu: komşudan kopyala ya da yeni seç
        let m;const up=grid[r-1]&&grid[r-1][c],left=row[c-1];const roll=R();
        if(roll<.32&&left&&MATS[left.m].d&&Z.mats.includes(left.m))m=left.m;
        else if(roll<.62&&up&&Z.mats.includes(up.m))m=up.m;
        else m=rp(Z.mats);
        row.push({m,dug:false,seed:(R()*1e9)|0});
      }
      grid.push(row);
    }
    Z.last=rows.length-1;
  });
  LANDMARKS.forEach(L=>{
    L.seen=false;L.row=rows.findIndex(r=>r.d>=L.d);
    if(rows[L.row].type!=='rock')L.row++;
    if(L.kind==='tunnel'){grid[L.row].forEach(c=>{c.m='tunnel';c.dug=true;c.res=1;});}
    if(L.kind==='oda'){const s=rint(0,COLS-5);for(let c=s;c<s+4;c++)grid[L.row][c]={m:'oda',dug:true,res:1};for(let c=s+1;c<s+3;c++)grid[L.row+1][c]={m:'oda',dug:true,res:1};}
  });
  const free=(r,c)=>{const g=grid[r][c];return rows[r].type==='rock'&&!g.dug&&!g.res&&!g.f&&!g.hz&&!g.en&&!g.b&&!g.mys&&!g.rep&&!g.pc;};
  const place=(Z,fn,cond)=>{for(let t=0;t<500;t++){const r=rint(Z.first+1,Z.last-1),c=rint(0,COLS-1);if(free(r,c)&&(!cond||cond(rows[r].d))){fn(grid[r][c]);return true;}}return false;};
  ZONES.forEach((Z,zi)=>{
    // sert blok kümeleri
    if(Z.boulder){const n=Math.floor(Z.rows*.22)+rint(0,2);
      for(let k=0;k<n;k++){let r=rint(Z.first+1,Z.last-1),c=rint(0,COLS-1);const len=rint(1,3);
        for(let j=0;j<len;j++){if(free(r,c)){grid[r][c].b=1;grid[r][c].m=Z.boulder;}if(R()<.5)c=Math.min(COLS-1,Math.max(0,c+(R()<.5?-1:1)));else r=Math.min(Z.last-1,r+1);}}
      for(let r=Z.first;r<=Z.last;r++){let cnt=0;grid[r].forEach(g=>{if(g.b&&++cnt>4){g.b=0;g.m=rp(Z.mats);}});}
    }
    // keşifler: havuzdan rastgele alt küme
    const pool=rsh(Object.keys(FINDS).filter(k=>FINDS[k].z===zi&&!FINDS[k].legend&&!FINDS[k].set));
    pool.slice(0,Z.place).forEach(id=>{
      const cond=id==='elmas'?d=>d>=140000&&d<=220000:id==='ringvudit'?d=>d>=400000:id==='astenosfer'?d=>d<=300000:id==='dkatman'?d=>d>=2600000:null;
      place(Z,g=>{g.f=id;},cond)||place(Z,g=>{g.f=id;});
    });
    Object.keys(FINDS).filter(k=>FINDS[k].z===zi&&FINDS[k].legend).forEach(id=>{if(R()<.45)place(Z,g=>{g.f=id;});});
    if(Z.haz){const n=Math.max(1,Z.haz[1]+rint(-1,1));for(let k=0;k<n;k++)place(Z,g=>{g.hz=Z.haz[0];});}
    const en=zi===0?1:rint(1,2);for(let k=0;k<en;k++)place(Z,g=>{g.en=1;});
    if(zi>0){const rp2=rint(0,2);for(let k=0;k<rp2;k++)place(Z,g=>{g.rep=1;});}
    const my=rint(1,2);for(let k=0;k<my;k++)place(Z,g=>{g.mys=1;});
    if(zi===2){for(let k=0;k<3;k++)place(Z,g=>{g.pc=1;});}
  });
  parca={id:rp(SETS),got:0};
}

let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(f,d,type='sine',vol=.15,delay=0,slide=0){if(!soundOn)return;const a=ac();if(!a)return;const t=a.currentTime+delay,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.02);}
function noise(d,vol=.12,freq=900){if(!soundOn)return;const a=ac();if(!a)return;const n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),x=buf.getChannelData(0);for(let i=0;i<n;i++)x[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();f.type='bandpass';f.frequency.value=freq;g.gain.value=vol;s.buffer=buf;s.connect(f).connect(g).connect(a.destination);s.start();}

function tryMove(dir){
  if(busy||modalOpen||finished)return;
  if(!startTime)startTime=performance.now();
  const dr={u:-1,d:1,l:0,r:0}[dir],dc={u:0,d:0,l:-1,r:1}[dir];
  P.face=dir;
  const nr=P.r+dr,nc=P.c+dc;
  if(nc<0||nc>=COLS||nr<0||nr>=rows.length){sfx.bump();return;}
  const row=rows[nr],g=grid[nr][nc];
  if(row.type==='gate'&&gateState[row.z]===null){askGate(row.z,()=>moveTo(nr,nc));return;}
  if(row.type==='center'||row.type==='gate'||g.dug){moveTo(nr,nc);return;}
  if(g.b){sfx.bump();toast('🪨 Bu kaya bloğu hiçbir matkapla delinemez! Etrafından dolaş.');shake(4);return;}
  if(energy<1){toStation('energy');return;}
  const rh=rhOf(g),M=MATS[g.m];
  busy=true;P.dig=true;
  const t=rh<=0?120:rh===1?230:rh===2?360:500;
  sfx.dig(rh);if(rh>=2)sfx.grind();
  const iv=setInterval(()=>spawnDust(nr,nc,M,rh),40);
  setTimeout(()=>{
    clearInterval(iv);P.dig=false;g.dug=true;energy-=1;
    if(!seenMats.has(g.m)){seenMats.add(g.m);toast(`🪨 <b>${M.name}</b>: ${M.info}`,4200);}
    const w=wearOf(rh);
    moveTo(nr,nc,()=>{ if(w)applyWear(w,nr,nc,rh); afterDig(g,nr,nc); });
  },t);
}
function moveTo(nr,nc,cb){
  busy=true;P.fr=P.ar;P.fc=P.ac;P.r=nr;P.c=nc;P.t0=performance.now();P.dur=110;
  setTimeout(()=>{busy=false;P.ar=nr;P.ac=nc;cb&&cb();afterMove();},P.dur);
}
function applyWear(w,r,c,rh){
  dur-=w;floater(r,c,'-'+w+' 🔧',diffCol(rh));
  if(firstWear&&rh>=1){firstWear=false;toast('⚠️ Bu kayaç matkabından sert: Matkap aşınıyor! Kolay (yeşil) kayaçları seç ya da kapılarda doğru cevap verip matkabını yükselt.',5200);}
  if(dur<=0){
    if(lv>1){lv--;dur=100;sfx.lvdown();shake(10);
      showCard({tag:'🔧 Matkap köreldi',tagc:'haz',e:'🪛',t:'Matkap seviyesi düştü!',d:'Şimdi: '+DRILLS[lv],x:'Matkabından sert kayaçları kazdıkça ucu aşındı ve bir seviye geriledi. Sert kayaçlardan kaçın, 🔧 tamir kitlerini topla!'});}
    else{dur=0;toStation('broken');}
  }
}
function afterDig(g,r,c){
  if(g.f){const id=g.f,F=FINDS[id];g.f=null;foundRun.add(id);const isNew=!foundEver.has(id);foundEver.add(id);
    const pts=F.legend?250:F.rare?100:50;score+=pts;floater(r,c,'+'+pts,F.legend?'#ffd23f':'#fff');
    F.legend?sfx.legend():F.rare?sfx.rare():sfx.find();burst(r,c,F.legend||F.rare?'#ffd23f':'#ffffff');
    if(F.energy)energy=Math.min(100,energy+F.energy);
    showCard({tag:F.legend?'🌟 Efsanevi keşif':F.rare?'⭐ Nadir keşif':'Keşif',tagc:F.legend?'gold':'',legend:F.legend,e:F.e,t:F.t,d:fmtDepth(rows[r].d)+' • '+ZONES[rows[r].z].name+(isNew?' • 🆕 Koleksiyona eklendi':''),x:F.x});}
  if(g.pc){g.pc=0;parca.got++;score+=40;sfx.find();burst(r,c,'#e8d7b0');floater(r,c,'🦴 '+parca.got+'/3','#e8d7b0');
    if(parca.got===3){const F=FINDS[parca.id];foundRun.add(parca.id);foundEver.add(parca.id);score+=300;sfx.legend();
      showCard({tag:'🦴 İskelet tamamlandı',tagc:'gold',legend:1,e:F.e,t:F.t,d:'+300 puan',x:F.x});}
    else toast(`🦴 Fosil parçası buldun! (${parca.got}/3) Hepsini bul, iskeleti tamamla.`,3200);}
  if(g.en){g.en=0;energy=Math.min(100,energy+20);score+=10;sfx.energy();floater(r,c,'+20 ⚡','#7dff9a');burst(r,c,'#7dff9a');}
  if(g.rep){g.rep=0;dur=Math.min(100,dur+40);score+=10;sfx.energy();floater(r,c,'+40 🔧','#8fd3ff');burst(r,c,'#8fd3ff');}
  if(g.mys){g.mys=0;mystery(r,c);}
  if(g.hz){const Hz=HAZ[g.hz],k=g.hz;g.hz=null;energy=Math.max(0,energy-Hz.en);sfx.bad();shake(Hz.shake?14:8);burst(r,c,'#ff7b3a');
    floater(r,c,'-'+Hz.en+' ⚡','#ff6b6b');
    if(!seenHaz.has(k)){seenHaz.add(k);showCard({tag:'⚠️ Tehlike',tagc:'haz',e:Hz.e,t:Hz.t,d:'−'+Hz.en+' enerji'+(Hz.wr?' • −'+Hz.wr+' dayanıklılık':''),x:Hz.x});}
    else toast(`${Hz.e} ${Hz.t} −${Hz.en} enerji`);
    if(Hz.wr)applyWear(Hz.wr,r,c,3);
    if(energy<=0)toStation('energy');}
  updateHUD();
}
function afterMove(){
  const row=rows[P.r];
  if(row.z>=0&&!seenZones.has(row.z)){seenZones.add(row.z);zoneBanner(row.z);}
  LANDMARKS.forEach(L=>{if(!L.seen&&P.r>=L.row){L.seen=true;score+=25;sfx.lm();showCard({tag:'📍 Önemli nokta',tagc:'lm',e:L.e,t:L.t,d:fmtDepth(L.d),x:L.x});}});
  if(row.type==='center'&&!finished){finished=true;endTime=performance.now();setTimeout(endGame,300);}
  updateHUD();
}

/* ====================================================== GİZEMLİ KUTU */
function mystery(r,c){
  const roll=Math.random();sfx.rare();burst(r,c,'#c58cff');
  if(roll<.22){energy=Math.min(100,energy+35);showCard({tag:'❓ Gizemli kutu',e:'🔋',t:'Yedek batarya!',x:'+35 enerji. Kutudan dolu bir batarya çıktı.'});}
  else if(roll<.42){dur=100;showCard({tag:'❓ Gizemli kutu',e:'🧰',t:'Tamir çantası!',x:'Matkap dayanıklılığı tamamen yenilendi.'});}
  else if(roll<.52&&lv<MAXLV){lv++;dur=100;showCard({tag:'❓ Gizemli kutu',tagc:'gold',legend:1,e:'⬆️',t:'Yeni matkap ucu!',d:DRILLS[lv],x:'Şanslısın! Matkabın bir seviye yükseldi.'});}
  else if(roll<.66){score+=150;showCard({tag:'❓ Gizemli kutu',e:'🎁',t:'Hazine!',x:'+150 puan kazandın.'});}
  else if(roll<.8){energy=Math.max(1,energy-20);sfx.bad();shake(10);showCard({tag:'❓ Gizemli kutu',tagc:'haz',e:'🪤',t:'Tuzak!',x:'Kutudan kaya tozu fışkırdı, filtreler tıkandı: −20 enerji.'});}
  else{ // risk sorusu
    const q=makeQuestion(Math.max(0,rows[r].z-1),'tf');
    enqueue(()=>renderQuestion(q,{tag:'❓ Risk sorusu',title:'Ya hep ya hiç!',sub:'Doğru: +200 puan • Yanlış: −50 puan'},ok=>{score+=ok?200:-50;updateHUD();return [ok?['+200 puan','good']:['−50 puan','bad']];},'Devam ⛏️'));
  }
  updateHUD();
}

/* ====================================================== SORULAR */
function swatch(mk){const c=document.createElement('canvas');c.width=c.height=120;const x=c.getContext('2d');drawMat(x,0,0,120,MATS[mk],(Math.random()*1e9)|0);return c.toDataURL();}
function makeQuestion(z,force){
  const types=[];const add=(t,w)=>{for(let i=0;i<w;i++)types.push(t);};
  add('mc',5);add('tf',3);
  const seenZoneMats=[...new Set(ZONES[z].mats)].filter(m=>seenMats.has(m));
  if(seenZoneMats.length)add('rock',2);
  const found=[...foundRun].filter(id=>!FINDS[id].set);
  if(found.length)add('find',2);
  add('deep',1);if(z>=4)add('order',1);
  let type=force||pickM(types);
  const zq=ZONES[z].qs;
  if(type==='mc'||type==='tf'){
    let pool=zq.filter(q=>q.type===type&&!lastQ.has(q.q));if(!pool.length)pool=zq.filter(q=>q.type===type);
    if(!pool.length)pool=zq;const q=pickM(pool);lastQ.add(q.q);return q;
  }
  if(type==='rock'){
    const mk=pickM(seenZoneMats);const others=shuffleM(Object.keys(MATS).filter(k=>MATS[k].d&&k!==mk&&Math.abs(MATS[k].d-MATS[mk].d)<=2&&!MATS[k].glow)).slice(0,2);
    return {type:'mc',q:'Yolda kazdığın bu kayaç hangisi?',img:swatch(mk),a:[MATS[mk].name,...others.map(k=>MATS[k].name)],ex:`Bu ${MATS[mk].name}. ${MATS[mk].info}`};
  }
  if(type==='find'){
    const id=pickM(found),F=FINDS[id];
    const others=shuffleM(Object.keys(FINDS).filter(k=>k!==id&&!FINDS[k].set)).slice(0,2);
    const masked=F.x.replace(/\(\+\d+ enerji\)/,'');
    return {type:'mc',q:'Bu bilgi hangi keşfine ait?<div class="ex" style="font-weight:400;font-size:18px;text-align:left">“'+masked+'”</div>',a:[F.e+' '+F.t,...others.map(k=>FINDS[k].e+' '+FINDS[k].t)],ex:`Bu bilgi ${F.t} keşfine ait.`};
  }
  if(type==='deep'){
    const pool=shuffleM(LANDMARKS.filter(L=>!L.t.includes('Süreksizliği')));
    const a=pool[0],b=pool.find(x=>Math.abs(x.d-a.d)>500);
    const deep=a.d>b.d?a:b,sh=a.d>b.d?b:a;
    const name=L=>L.e+' '+L.t.replace(' Kadar!','').replace('!','');
    return {type:'mc',q:'Hangisi daha derindir (ya da daha uzaktır)?',a:[name(deep),name(sh)],ex:`${name(deep)}: ${fmtDepth(deep.d)} • ${name(sh)}: ${fmtDepth(sh.d)}`,two:1};
  }
  if(type==='order'){
    const st=Math.floor(Math.random()*2);const items=LAYER_ORDER.slice(st,st+4);
    return {type:'order',q:'Katmanları <b>yüzeyden merkeze</b> doğru sırayla dokun:',items,ex:'Doğru sıra: '+items.join(' → ')};
  }
  return pickM(zq);
}
// q: soru, meta: {tag,title,sub}, onAnswer(ok)-> ödül listesi [[metin,sınıf]], btnTxt, after()
function renderQuestion(q,meta,onAnswer,btnTxt,after){
  askedN++;
  let html=`<div style="text-align:center"><span class="tag">${meta.tag}</span></div><div class="mt">${meta.title}</div>${meta.sub?`<div class="md">${meta.sub}</div>`:''}`;
  html+=`<div class="q">${q.type==='tf'?'Doğru mu, yanlış mı?<br>':''}${q.q}</div>${q.img?`<img class="qimg" src="${q.img}" alt="">`:''}`;
  let opts=[],correctKey;
  if(q.type==='tf'){opts=['✅ Doğru','❌ Yanlış'];correctKey=q.ans?opts[0]:opts[1];html+=`<div class="opts tf">${opts.map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join('')}</div>`;}
  else if(q.type==='mc'){opts=shuffleM([...q.a]);correctKey=q.a[0];html+=`<div class="opts">${opts.map((o,i)=>`<button class="opt" data-i="${i}">${String.fromCharCode(65+i)}) ${o}</button>`).join('')}</div>`;}
  else if(q.type==='order'){opts=shuffleM([...q.items]);html+=`<div class="opts">${opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="num"> </span>${o}</button>`).join('')}</div>`;}
  html+='<div id="exBox"></div>';
  md.innerHTML=html;
  const finish=(ok)=>{
    if(ok){correctN++;sfx.ok();}else sfx.no();
    const rewards=onAnswer(ok)||[];
    $('exBox').innerHTML=`<div class="ex">${ok?'✅ <b>Doğru!</b> ':'❌ <b>Olmadı.</b> '}${q.ex}</div>
      <div class="reward">${rewards.map(([t,c])=>`<span class="${c}">${t}</span>`).join('')}</div>
      <div class="mact"><button class="btn" id="mOk">${btnTxt}</button></div>`;
    $('mOk').onclick=()=>{closeModal();after&&after();updateHUD();};
    md.scrollTop=md.scrollHeight;updateHUD();
  };
  if(q.type==='order'){
    const seq=[];
    md.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      if(b.classList.contains('sel')||seq.length>=opts.length)return;
      seq.push(opts[+b.dataset.i]);b.classList.add('sel');b.querySelector('.num').textContent=seq.length;tone(500+seq.length*120,.1,'triangle',.1);
      if(seq.length===opts.length){const ok=seq.every((v,i)=>v===q.items[i]);
        md.querySelectorAll('.opt').forEach(x=>{const v=opts[+x.dataset.i];x.classList.add(seq.indexOf(v)===q.items.indexOf(v)?'right':'wrong');});finish(ok);}
    });
  } else {
    let done=false;
    md.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      if(done)return;done=true;const v=opts[+b.dataset.i],ok=v===correctKey;
      md.querySelectorAll('.opt').forEach(x=>{if(opts[+x.dataset.i]===correctKey)x.classList.add('right');});
      if(!ok)b.classList.add('wrong');finish(ok);
    });
  }
}
function askGate(zi,done){
  const Z=ZONES[zi];const q=makeQuestion(zi);
  enqueue(()=>renderQuestion(q,{tag:'🚧 Katman kapısı',title:Z.gate,sub:fmtDepth(Z.end)+' • Doğru cevap matkabını yükseltir ve enerjini doldurur'},ok=>{
    gateState[zi]=ok?'ok':'fail';
    if(ok){score+=100;lv=Math.min(MAXLV,lv+1);energy=100;dur=100;
      return [['+100 puan','good'],['⬆️ '+DRILLS[lv],'good'],['⚡ Enerji doldu','good'],['🔧 Matkap tamir edildi','good']];}
    owed++;
    return [['Puan yok','bad'],['Matkap güçlenmedi','bad'],['Enerji dolmadı','bad'],['Kapıdan geçebilirsin ama dikkat!','']];
  },'Kapıdan geç ⬇️',done));
}
function lastStationRow(){let gr=0;for(let z=ZONES.length-1;z>=0;z--){if(gateState[z]){gr=ZONES[z].last;break;}}return gr;}
function stationZone(){for(let z=ZONES.length-1;z>=0;z--){if(gateState[z])return z;}return 0;}
let stationPending=false;
function toStation(reason){
  if(stationPending)return;stationPending=true;
  failCount++;score=Math.max(0,score-50);sfx.bad();
  const fn=()=>{
    const z=stationZone();const q=makeQuestion(z);
    const head=reason==='energy'?{e:'🪫',t:'Enerji bitti!'}:{e:'💔',t:'Matkap kırıldı!'};
    md.innerHTML=cardHTML({tag:'🏗️ İstasyona dönüş',tagc:'haz',e:head.e,t:head.t,d:'−50 puan',
      x:'Kurtarma ekibi seni son istasyona çekti. Kazdığın tüneller duruyor. Teknisyen bir soru soruyor: Doğru cevap tam onarım demek!'+(owed?'<br><b>Bonus:</b> Daha önce yanlış geçtiğin bir kapının matkap yükseltmesini de geri kazanabilirsin.':''),btn:'Soruya geç 🛠️'});
    $('mOk').onclick=()=>{
      renderQuestion(q,{tag:'🛠️ İstasyon sorusu',title:'Teknisyenin sorusu',sub:'Doğru: tam onarım'+(owed?' + kayıp seviye':'')+' • Yanlış: yarım onarım'},ok=>{
        stationPending=false;const gr=lastStationRow();P.r=P.ar=P.fr=gr;P.fc=P.ac=P.c;P.t0=0;
        if(ok){energy=100;dur=100;const out=[['⚡ Enerji %100','good'],['🔧 Dayanıklılık %100','good']];
          if(owed>0&&lv<MAXLV){owed--;lv++;out.push(['⬆️ '+DRILLS[lv],'good']);}return out;}
        energy=Math.max(energy,50);dur=Math.max(dur,60);if(lv<1)lv=1;return [['⚡ Enerji %50','bad'],['🔧 Dayanıklılık %60','bad']];
      },'Kazmaya devam ⛏️');
    };
  };fn.station=1;
  enqueue(fn);
}

/* ====================================================== TARAMA */
function doScan(){
  if(busy||modalOpen||finished||scans<=0)return;
  if(energy<6){toast('Tarama için en az 6 enerji gerekir.');return;}
  if(!startTime)startTime=performance.now();
  scans--;energy-=5;sfx.scan();
  scanFx={r:P.r,c:P.c,t0:performance.now()};
  let n=0;for(let r=Math.max(0,P.r-7);r<=Math.min(rows.length-1,P.r+7);r++)for(let c=0;c<COLS;c++){const g=grid[r][c];if(!g.dug&&(g.f||g.pc)&&Math.hypot(r-P.r,c-P.c)<=7){n++;}}
  toast(`📡 Sismik dalga gönderildi! Yakında <b>${n}</b> gizli şey var.`,3000);
  updateHUD();
}

/* ====================================================== HUD */

  $('depth').textContent=fmtDepth(d);
  $('zoneName').textContent=z<0?'Yüzey':ZONES[z].name;
  $('temp').textContent='≈ '+fmtNum(interp(TEMP,d))+' °C';
  const atm=interp(PRESS,d)*9869;
  $('press').textContent=atm<10?atm.toFixed(1).replace('.',',')+' atm':atm<1e6?fmtNum(atm)+' atm':(atm/1e6).toFixed(2).replace('.',',')+' milyon atm';
  $('enTxt').textContent=Math.round(energy);

    ctx.strokeStyle='rgba(255,255,255,.2)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x+s*.25,y+s*.2);ctx.lineTo(x+s*.45,y+s*.5);ctx.lineTo(x+s*.35,y+s*.8);ctx.moveTo(x+s*.45,y+s*.5);ctx.lineTo(x+s*.75,y+s*.6);ctx.stroke();return;}
