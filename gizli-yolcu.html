      body: ["“Bunu birlikte yapalım, üsle de bağlantı kuralım,” diyorsun. Dr. Elif gülümsüyor: “Tam bir Ufuk Bekçisi gibi düşünüyorsun.” Üsle bağlantı kurulurken modeli birlikte hazırlıyorsunuz."],
      choices: [{ label: "Devam Et", solo: true, next: "final_model", effect: function () { state.approach = "team"; } }]
    },

    final_model: {
      act: 3,
      kicker: "SAHNE · SON GÖREV",
      title: "Rota Hesabı",
      body: [
        "Navigasyon ekranında üç model beliriyor. Hangisi Güneş, Dünya ve Ay’ın gerçek konumlarını, hareketlerini ve büyüklüklerini doğru temsil ediyor?"
      ],
      choices: [
        { label: "Güneş merkezde sabit ve en büyük; Dünya onun etrafında dönerek dolanır; çok daha küçük olan Ay da Dünya’nın etrafında döner", tag: "A", next: "ENDING_RESOLVE" },
        { label: "Dünya merkezde sabit durur; Güneş ve Ay onun etrafında eşit hızda döner", tag: "B", next: "final_wrong" }
      ]
    },
    final_wrong: {
      act: 3, kicker: "ROTA SAPMASI", title: "Yeniden Hesapla", warn: "YENİDEN HESAPLA",
      body: ["Cihaz kırmızı yanıp sönüyor. Dr. Elif: “Gerçek düzende Güneş merkezdedir; Dünya ve diğer gezegenler onun etrafında döner, Ay da Dünya’nın etrafında döner. Ay, Dünya’dan bile küçüktür.” Rotayı yeniden hesaplaman için bir şansın daha var."],
      choices: [{ label: "Tekrar Dene", solo: true, next: "final_model" }]
    },

    ending_bold: {
      act: 3,
      kicker: "GÖREV TAMAMLANDI · CESUR KAŞİF",
      title: "Işık Hızında Bir Kurtarma",
      ending: true,
      body: function () {
        return [
          "Gemi, hesapladığın koordinatlara var gücüyle yöneliyor. Heyecanlı ama gergin dakikaların ardından, uzaktan çekilen görüntülerde küçük, tozlu ama sapasağlam duran İlk Işık sondası beliriyor! Hız kazandırdığın bu kurtarma, geminin yakıtından biraz fazla harcamasına mal olsa da, tam zamanında yetişmişsinizdir.",
          (state.route === "cesur"
            ? "Baştan beri cesur seçimler yapan bir kâşif oldun — ve bu sefer cesaretin işe yaradı."
            : "Yolun başında temkinli davranmış olsan da, sonunda cesur bir kâşif gibi harekete geçtin.") +
            " Baban gururla gülümsüyor: “Bu görevde resmi olarak kayıtlı değildin ama kesinlikle bir Ufuk Bekçisi gibi çalıştın.”",
          "<span class=\"log\">GÖREV KAYDI KAPANDI · İLK IŞIK HIZLI KURTARMAYLA BULUNDU</span>"
        ];
      },
      choices: [{ label: "Baştan Başla", solo: true, next: "RESTART" }]
    },

    ending_careful: {
      act: 3,
      kicker: "GÖREV TAMAMLANDI · TİTİZ KAŞİF",
      title: "Kusursuz Hesap",
      ending: true,
      body: function () {
        return [
          "Modeli defalarca kontrol edip her hesabı doğruladıktan sonra gemi, tam isabetle İlk Işık’ın yanına yanaşıyor. Sonda sapasağlam, hatta antenindeki küçük bir arıza bile senin dikkatli gözlemlerinle fark ediliyor.",
          (state.route === "temkinli"
            ? "Yolculuk boyunca hep dikkatli ve planlı davrandın — ve bu titizlik, en zor anda işe yaradı."
            : "Yolun başında cesurca atılmış olsan da, sonunda titiz bir bilim insanı gibi çalıştın.") +
            " Dr. Elif sana sandıktaki parlak rozeti takdim ediyor: “Bu rozet, gerçek bir Ufuk Bekçisi’ne layık.”",
          "<span class=\"log\">GÖREV KAYDI KAPANDI · İLK IŞIK KUSURSUZ BİR HESAPLA BULUNDU</span>"
        ];
      },
      choices: [{ label: "Baştan Başla", solo: true, next: "RESTART" }]
    },

    ending_team: {
      act: 3,
      kicker: "GÖREV TAMAMLANDI · TAKIM KAŞİFİ",
      title: "Birlikte Başardık",
      ending: true,
      body: [
        "Üsle sürekli bağlantı hâlinde, Dr. Elif ile omuz omuza çalışarak İlk Işık’ı buluyorsunuz. Millî Uzay Programı’nın tüm ekibi, senin gönderdiğin koordinatları izleyerek yeni bir kurtarma görevi planlamaya başlıyor — bu artık sadece senin değil, hepinizin başarısı.",
        "Baban telsizden gülüyor: “İşte böyle bir ekip olunur.”",
        "<span class=\"log\">GÖREV KAYDI KAPANDI · İLK IŞIK, TAKIM ÇALIŞMASIYLA BULUNDU</span>"
      ],
      choices: [{ label: "Baştan Başla", solo: true, next: "RESTART" }]
    }
  };

  var cardEl = document.getElementById("card");
  var kickerEl = document.getElementById("kicker");
  var titleEl = document.getElementById("title");
  var bodyEl = document.getElementById("body");
  var choicesEl = document.getElementById("choices");
  var badgesEl = document.getElementById("badges");
  var actTrackEl = document.getElementById("actTrack");
  var actLabels = [null, document.getElementById("actLabel1"), document.getElementById("actLabel2"), document.getElementById("actLabel3")];
  var puzzleEl = document.getElementById("puzzle");
  var puzzleInput = document.getElementById("puzzleInput");
  var puzzleCheck = document.getElementById("puzzleCheck");
  var puzzleHint = document.getElementById("puzzleHint");

  if (!actTrackEl.children.length) {
    for (var i = 0; i < 3; i++) {
      var d = document.createElement("div");
      d.className = "act-dot";
      actTrackEl.appendChild(d);
    }
  }

  function renderBadges() {
    badgesEl.innerHTML = "";
    BADGES.forEach(function (b) {
      var lit = !!state.badgesLit[b.key];
      var div = document.createElement("div");
      div.className = "badge" + (lit ? " lit" : "");
      div.innerHTML = ICONS[b.key] + '<span class="badge-label">' + b.label + "</span>";
      badgesEl.appendChild(div);
    });
  }

  function renderAct(act) {
    var dots = actTrackEl.children;
    for (var i = 0; i < dots.length; i++) {
      var n = i + 1;
      dots[i].className = "act-dot" + (n < act ? " done" : n === act ? " active" : "");
    }
    for (var j = 1; j <= 3; j++) {
      actLabels[j].className = j === act ? "current" : "";
    }
  }

  function resolveEnding() {
    if (state.approach === "bold") { return "ending_bold"; }
    if (state.approach === "careful") { return "ending_careful"; }
    return "ending_team";
  }

  var currentPuzzle = null;

  function submitPuzzle() {
    if (!currentPuzzle) { return; }
    var val = puzzleInput.value;
    if (matches(val, currentPuzzle.accept, currentPuzzle.matchMode)) {
      go(currentPuzzle.successNext);
    } else {
      puzzleInput.classList.add("shake");
      setTimeout(function () { puzzleInput.classList.remove("shake"); }, 400);
      go(currentPuzzle.failNext);
    }
  }

  puzzleCheck.addEventListener("click", submitPuzzle);
  puzzleInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { submitPuzzle(); }
  });

  function go(id) {
    if (id === "RESTART") { state = freshState(); id = "start"; }
    if (id === "ENDING_RESOLVE") { id = resolveEnding(); }

    var scene = SCENES[id];
    if (!scene) { return; }

    if (scene.badge) { state.badgesLit[scene.badge] = true; }

    kickerEl.textContent = scene.kicker;
    titleEl.textContent = scene.title;

    var bodyArr = typeof scene.body === "function" ? scene.body() : scene.body;
    var html = bodyArr.map(function (p) { return "<p>" + p + "</p>"; }).join("");
    if (scene.warn) { html += '<span class="notice warn">' + scene.warn + "</span>"; }
    if (scene.good) { html += '<span class="notice good">' + scene.good + "</span>"; }
    bodyEl.innerHTML = html;

    if (scene.kind === "input") {
      choicesEl.style.display = "none";
      choicesEl.innerHTML = "";
      puzzleEl.style.display = "block";
      puzzleInput.value = "";
      puzzleHint.textContent = scene.hint || "";
      currentPuzzle = scene;
      setTimeout(function () { puzzleInput.focus(); }, 50);
    } else {
      puzzleEl.style.display = "none";
      currentPuzzle = null;
      choicesEl.style.display = "flex";
      choicesEl.innerHTML = "";
      scene.choices.forEach(function (choice) {
        var btn = document.createElement("button");
        btn.className = "choice" + (choice.solo ? " solo" : "");
        btn.type = "button";
        if (!choice.solo) {
          var tag = document.createElement("span");
          tag.className = "tag";
          tag.textContent = choice.tag;
          btn.appendChild(tag);
        }
        var label = document.createElement("span");
        label.textContent = choice.label;
        btn.appendChild(label);
        btn.addEventListener("click", function () {
          if (choice.effect) { choice.effect(); }
          go(choice.next);
        });
        choicesEl.appendChild(btn);
      });
    }

    renderBadges();
    renderAct(scene.act || 1);

    cardEl.classList.remove("fade-in");
    void cardEl.offsetWidth;
    cardEl.classList.add("fade-in");
    cardEl.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  renderBadges();
  go("start");
})();
</script>
