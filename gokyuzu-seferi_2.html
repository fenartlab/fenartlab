<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Gökyüzü Seferi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Yerleşim: kokpit. Solda büyük gözlem penceresi, sağda gemi bilgisayarı paneli (not, kontroller, bilgi kartı, görev kartları), üstte durak şeridi. Tek (koyu) görünüm bilinçli seçildi. */
:root{
  color-scheme: dark;
  --void:#060914; --hull:#0c1226; --hull-2:#131b37; --line:#283360;
  --ink:#e9eeff; --ink-dim:#9ba7d0; --amber:#ffb84d; --amber-ink:#2a1900;
  --comm:#82dbff; --ok:#6fe3a8; --bad:#ff8a8a;
  --f-display:"Chakra Petch","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
html,body{height:100%}
body{background:var(--void);color:var(--ink);font-family:var(--f-body);font-size:18px;line-height:1.5;-webkit-user-select:none;user-select:none;touch-action:manipulation}
input{-webkit-user-select:text;user-select:text}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:3px solid var(--comm);outline-offset:2px}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);grid-template-columns:minmax(0,1fr)}
header.bar{min-width:0;display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--hull)}
.brand{font-family:var(--f-display);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:21px;white-space:nowrap;line-height:1.1}
.brand small{display:block;font-family:var(--f-mono);font-weight:400;font-size:11px;color:var(--ink-dim);letter-spacing:.16em;margin-top:3px}
.route{position:relative;display:flex;gap:6px;overflow-x:auto;flex:1;min-width:0;padding:2px}
.wp{flex:0 0 auto;display:flex;align-items:center;gap:7px;background:transparent;border:1px solid var(--line);color:var(--ink-dim);border-radius:999px;padding:5px 13px 5px 5px;font:600 15px var(--f-display);cursor:pointer}
.wp .n{min-width:26px;height:26px;border-radius:13px;display:grid;place-items:center;background:var(--hull-2);font:600 12px var(--f-mono);padding:0 4px}
.wp.seen{color:var(--ink)}
.wp.full .n{background:var(--ok);color:#06240f}
.wp.cur{border-color:var(--amber);color:var(--ink)}
.wp.cur .n{background:var(--amber);color:var(--amber-ink)}
.reset{flex:0 0 auto;font:600 15px var(--f-display);color:var(--ink-dim);background:transparent;border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer}
.reset.warn{color:var(--amber-ink);background:var(--amber);border-color:var(--amber)}
main.deck{min-width:0;display:grid;grid-template-columns:minmax(0,1fr) 420px;min-height:0}
.view{position:relative;min-width:0;min-height:0;overflow:hidden;background:var(--void)}
.view canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.scene{position:absolute;inset:0;display:grid;place-items:center;padding:8px}
.scene>svg{width:100%;height:100%;display:block}
.flabel{position:absolute;top:10px;left:14px;font:12px var(--f-mono);letter-spacing:.16em;color:var(--ink-dim);text-transform:uppercase;pointer-events:none}
.back{position:absolute;left:12px;bottom:12px;font:700 16px var(--f-display);color:var(--ink);background:rgba(12,18,38,.85);border:1px solid var(--line);border-radius:10px;padding:10px 16px;cursor:pointer;min-height:48px}
aside.comp{display:flex;flex-direction:column;min-height:0;border-left:1px solid var(--line);background:var(--hull)}
.comp-h{padding:11px 16px;font:600 13px var(--f-mono);letter-spacing:.16em;color:var(--comm);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.comp-h .dot{width:9px;height:9px;border-radius:50%;background:var(--comm);box-shadow:0 0 10px var(--comm);animation:blink 2.2s infinite}
.pscroll{flex:1 1 auto;overflow-y:auto;display:flex;flex-direction:column}
.sec{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.sec:empty{display:none}
.sec h3{margin:0;font:600 12px var(--f-mono);letter-spacing:.14em;color:var(--ink-dim);text-transform:uppercase}
.note p{margin:0;border-left:3px solid var(--comm);padding-left:12px}
.note b,.infocard b{color:var(--amber)}
.hint{display:flex;flex-direction:column;gap:8px}
.hint p{border-left-color:var(--amber);background:var(--hull-2);padding:8px 12px;border-radius:0 8px 8px 0;font-size:16px;animation:in .3s ease-out}
.hbtn{align-self:flex-start;font:600 15px var(--f-display);color:var(--comm);background:transparent;border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer;min-height:42px}
.ctl{background:var(--hull-2)}
.infocard{animation:in .3s ease-out}
.infocard .it{font:700 20px var(--f-display);color:var(--ink);margin:0 0 4px}
.infocard p{margin:0}
.infocard.empty{color:var(--ink-dim);font-size:16px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1 1 auto}
button.act{font:700 18px var(--f-display);letter-spacing:.03em;padding:11px 16px;border-radius:10px;border:0;background:var(--amber);color:var(--amber-ink);cursor:pointer;min-height:52px}
button.act.sec2{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.act:disabled{opacity:.35;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:600 16px var(--f-display);color:var(--ink);background:var(--hull);border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer;min-height:46px;display:inline-flex;align-items:center;gap:8px}
.chip .sw{width:14px;height:14px;border-radius:50%;flex:0 0 auto}
.chip.sel,.chip.on{border-color:var(--amber);background:rgba(255,184,77,.18)}
.chip.used{opacity:.3}
.chip.right{border-color:var(--ok)} .chip.wrong{border-color:var(--bad)}
.chip:disabled{cursor:default}
.lbl{font:600 12px var(--f-mono);letter-spacing:.12em;color:var(--ink-dim);text-transform:uppercase}
/* görev kartları */
.tcard{border:1px solid var(--line);border-radius:10px;background:var(--hull)}
.tcard.open{border-color:var(--comm)}
.th{width:100%;display:flex;align-items:center;gap:10px;text-align:left;background:transparent;border:0;color:var(--ink);font:600 16px var(--f-display);padding:11px 12px;cursor:pointer;min-height:50px}
.th .ti{flex:0 0 auto;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line);font:600 13px var(--f-mono);color:var(--ink-dim)}
.th .tk{font:600 11px var(--f-mono);letter-spacing:.1em;color:var(--ink-dim);text-transform:uppercase;display:block}
.tcard.ok .ti{background:var(--ok);border-color:var(--ok);color:#06240f}
.tcard.bad .ti{border-color:var(--bad);color:var(--bad)}
.tcard.part .ti{border-color:var(--amber);color:var(--amber);font-size:11px}
.tb{padding:0 12px 12px;display:flex;flex-direction:column;gap:8px}
.q p{margin:0;font-weight:700;text-wrap:balance}
.opt{text-align:left;font:400 17px var(--f-body);color:var(--ink);background:var(--hull-2);border:1px solid var(--line);border-radius:8px;padding:10px 13px;cursor:pointer;min-height:48px}
.opt:disabled{cursor:default;color:var(--ink)}
.opt.right{border-color:var(--ok);background:rgba(111,227,168,.13)}
.opt.wrong{border-color:var(--bad);background:rgba(255,138,138,.13)}
.why{font-size:16px;color:var(--ink-dim)}
.okt{color:var(--ok)} .badt{color:var(--bad)}
.bins{display:flex;flex-direction:column;gap:8px}
.bin{border:1px dashed var(--line);border-radius:10px;padding:8px 10px;cursor:pointer;min-height:60px;display:flex;flex-direction:column;gap:6px;background:var(--hull-2)}
.bin .bh{font:600 12px var(--f-mono);letter-spacing:.1em;color:var(--ink-dim);text-transform:uppercase}
.bin.armed{border-color:var(--amber);border-style:solid}
.slots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.slotbox{border:1px dashed var(--line);border-radius:8px;min-height:58px;padding:6px;font:600 15px var(--f-display);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:2px}
.slotbox small{font:400 11px var(--f-mono);color:var(--ink-dim);letter-spacing:.08em}
.slotbox.right{border:1px solid var(--ok)} .slotbox.wrong{border:1px solid var(--bad)}
.stoplist{display:flex;flex-direction:column;gap:6px}
.stopbtn{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--hull);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--ink);font:600 16px var(--f-display);cursor:pointer;min-height:50px;text-align:left}
.stopbtn span:last-child{font:13px var(--f-mono);color:var(--ink-dim);white-space:nowrap}
/* rapor panosu */
.board{position:relative;width:100%;height:100%;overflow-y:auto;padding:40px clamp(16px,3vw,40px) 80px;display:flex;flex-direction:column;gap:18px;background:rgba(6,9,20,.86)}
.board h2{margin:0;font:700 clamp(24px,2.6vw,34px) var(--f-display);letter-spacing:.04em;text-wrap:balance}
.board .sub{margin:0;color:var(--ink-dim)}
.rows{margin:0;padding-left:28px;display:flex;flex-direction:column;gap:14px;font-size:clamp(18px,1.6vw,22px)}
.rows li{padding-left:4px;line-height:2}
.slot{font:700 clamp(17px,1.5vw,21px) var(--f-display);color:var(--ink-dim);background:var(--hull);border:2px dashed var(--line);border-radius:8px;padding:2px 14px;min-width:150px;min-height:44px;cursor:pointer;margin:0 6px;vertical-align:middle}
.slot.full{color:var(--amber);border-style:solid;border-color:var(--amber)}
.slot.right{color:var(--ok);border-color:var(--ok)}
.slot.wrong{color:var(--bad);border-color:var(--bad)}
.fix{color:var(--ok);font-size:.85em;margin-left:6px}
.bank{display:flex;flex-wrap:wrap;gap:10px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--hull)}
.bank .chip{font-size:19px;min-height:52px;padding:10px 18px}
.report{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.rc{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--hull);display:flex;flex-direction:column;gap:4px}
.rc .rn{font:600 13px var(--f-mono);letter-spacing:.1em;color:var(--ink-dim);text-transform:uppercase}
.rc .rs{font:700 26px var(--f-display);color:var(--amber);letter-spacing:.1em}
.rc .rv{font:15px var(--f-mono);color:var(--ink);font-variant-numeric:tabular-nums}
.rc.low .rs{color:var(--bad);font-size:18px;letter-spacing:.02em}
.rc.none .rs{color:var(--ink-dim);font-size:18px;letter-spacing:.02em}
.namebox{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.namebox input{max-width:420px;font:600 20px var(--f-display);padding:10px 14px;border-radius:8px;border:1px solid var(--line);background:var(--hull);color:var(--ink);min-width:0;flex:1 1 220px}
.total{font:700 clamp(20px,2vw,26px) var(--f-display);margin:0}
.recap{border-left:3px solid var(--amber);padding:10px 14px;background:var(--hull);border-radius:0 10px 10px 0;margin:0}
/* SVG */
.t-lbl{font-family:var(--f-display);font-weight:600;font-size:20px;fill:var(--ink)}
.t-dim{font-family:var(--f-mono);font-size:14px;letter-spacing:.12em;fill:var(--ink-dim)}
.t-big{font-family:var(--f-mono);font-weight:600;font-size:52px;fill:var(--amber)}
.t-mid{font-family:var(--f-body);font-size:22px;fill:var(--ink)}
.t-amber{font-family:var(--f-display);font-weight:700;font-size:22px;fill:var(--amber)}
.t-name{font-family:var(--f-display);font-weight:700;font-size:34px;fill:var(--ink)}
.t-cap{font-family:var(--f-body);font-size:22px;fill:var(--ink)}
.t-ok{font-family:var(--f-mono);font-size:14px;letter-spacing:.12em;fill:var(--ok)}
.nd{cursor:pointer}
.nd rect{fill:var(--hull-2);stroke:var(--line);stroke-width:2}
.nd text{font-family:var(--f-display);font-weight:600;font-size:16px;fill:var(--ink-dim)}
.nd.seen rect{stroke:var(--amber)}
.nd.seen text{fill:var(--ink)}
.nd.now rect{fill:var(--amber);stroke:var(--amber)}
.nd.now text{fill:var(--amber-ink)}
.ed{stroke:var(--line);stroke-width:2.5;fill:none}
.ed.seen{stroke:var(--amber)}
.tap{cursor:pointer}
.cl-line{stroke:var(--comm);stroke-opacity:.22;stroke-width:2;fill:none;transition:stroke-opacity .3s}
.nolines .cl-line{stroke-opacity:0}
.con.on .cl-line{stroke-opacity:.85}
.cl-name{opacity:0;transition:opacity .3s}
.con.on .cl-name,.names .cl-name{opacity:1}
.star.sel{fill:var(--amber)}
.mapnode .ring{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:5 6}
.mapnode.seen .ring{stroke:var(--comm);stroke-dasharray:none}
.mapnode.full .ring{stroke:var(--ok);stroke-width:3;stroke-dasharray:none}
.pop{animation:pop .6s ease-out}
.flame{animation:flick .12s infinite alternate}
.ringx{transform-box:fill-box;transform-origin:center;animation:ring 1.8s ease-out infinite}
.spin{transform-box:view-box;transform-origin:280px 240px;animation:spin 2.4s linear infinite}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.3s ease-in-out infinite}
.bob{animation:bob 3s ease-in-out infinite}
.zout{transform-box:view-box;transform-origin:500px 300px;animation:zout .8s ease-out}
.zin{transform-box:view-box;transform-origin:500px 300px;animation:zin .8s ease-out}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes blink{50%{opacity:.35}}
@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
@keyframes flick{from{transform:scaleY(.8)}to{transform:scaleY(1.15)}}
@keyframes ring{from{transform:scale(.4);opacity:1}to{transform:scale(1.5);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{transform:scale(1.25);opacity:.5}}
@keyframes bob{50%{transform:translateY(-8px)}}
@keyframes zout{from{transform:scale(1.9);opacity:0}to{transform:none;opacity:1}}
@keyframes zin{from{transform:scale(.45);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
@media (max-width:900px){
  html,body{height:auto}
  .app{height:auto}
  main.deck{grid-template-columns:1fr}
  .view{aspect-ratio:5/3}
  .view.tall{aspect-ratio:auto;min-height:85vh}
  aside.comp{border-left:0;border-top:1px solid var(--line)}
  .brand small{display:none}
}
</style>

<div class="app">
  <header class="bar">
    <div class="brand">Keşif-7<small>GÖKYÜZÜ SEFERİ · 7. SINIF</small></div>
    <nav class="route" id="route" aria-label="Duraklar"></nav>
    <button class="reset" id="reset" type="button">↺ Baştan</button>
  </header>
  <main class="deck">
    <section class="view" id="view">
      <canvas id="stars"></canvas>
      <div class="scene" id="scene"></div>
      <div class="flabel" id="flabel"></div>
      <button class="back" id="back" type="button" hidden>◀ Haritaya dön</button>
    </section>
    <aside class="comp">
      <div class="comp-h"><span class="dot"></span>GEMİ BİLGİSAYARI</div>
      <div class="pscroll" id="pscroll">
        <div class="sec note" id="note"></div>
        <div class="sec ctl" id="ctl"></div>
        <div class="sec" id="info"></div>
        <div class="sec" id="tasks"></div>
      </div>
    </aside>
  </main>
</div>

<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
const NS="http://www.w3.org/2000/svg";
const RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
function put(e,attrs,kids){
  for(const [k,v] of Object.entries(attrs||{})){
    if(k==="class") e.setAttribute("class",v);
    else if(k==="html") e.innerHTML=v;
    else if(k.slice(0,2)==="on") e.addEventListener(k.slice(2),v);
    else if(v!==false && v!=null) e.setAttribute(k,v);
  }
  for(const k of kids.flat(3)){ if(k==null||k===false) continue; e.append(k.nodeType?k:document.createTextNode(String(k))); }
  return e;
}
const h=(t,a,...k)=>put(document.createElement(t),a,k);
const s=(t,a,...k)=>put(document.createElementNS(NS,t),a,k);
const T=(x,y,str,cls,extra)=>s("text",Object.assign({x,y,"text-anchor":"middle"},cls?{class:cls}:{},extra||{}),str);
const tr=(n,d)=>n.toFixed(d==null?2:d).replace(".",",");
const fmt=n=>Math.round(n).toLocaleString("tr-TR");
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
function rng(seed){ let x=seed%2147483647; if(x<=0)x+=2147483646; return ()=>{ x=x*16807%2147483647; return (x-1)/2147483646; }; }
function shuffle(a){ const b=a.slice(); for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; }

function lin(id,stops,x1,y1,x2,y2){ return s("linearGradient",{id,x1,y1,x2,y2},stops.map(st=>s("stop",{offset:st[0],"stop-color":st[1],"stop-opacity":st[2]==null?1:st[2]}))); }
function rad(id,stops){ return s("radialGradient",{id},stops.map(st=>s("stop",{offset:st[0],"stop-color":st[1],"stop-opacity":st[2]==null?1:st[2]}))); }
function blur(id,sd){ return s("filter",{id,x:"-60%",y:"-60%",width:"220%",height:"220%"},s("feGaussianBlur",{stdDeviation:sd})); }
function svgRoot(){ const v=s("svg",{viewBox:"0 0 1000 600",preserveAspectRatio:"xMidYMid meet",role:"img"});
  v.append(s("defs",{},blur("b4",4),blur("b8",8),blur("b14",14),blur("b24",24),blur("b40",40),
    lin("earthG",[[0,"#5bb0ff"],[1,"#163f7a"]],0,0,0,1),
    rad("redG",[[0,"#ffc08a"],[.65,"#ff6a3a"],[1,"#c2321c"]]),
    rad("starG",[[0,"#ffffff"],[.5,"#fff1b0"],[1,"#ffc94d"]]),
    lin("tempG",[[0,"#7fb2ff"],[.25,"#eef3ff"],[.5,"#ffd25e"],[.75,"#ff9a52"],[1,"#ff4a32"]],0,0,1,0)));
  return v; }
const glow=(cx,cy,r,fill,op,f)=>s("circle",{cx,cy,r,fill,opacity:op,filter:"url(#"+f+")"});
const ell=(cx,cy,rx,ry,fill,op,f,extra)=>s("ellipse",Object.assign({cx,cy,rx,ry,fill,opacity:op},f?{filter:"url(#"+f+")"}:{},extra||{}));

/* ---------- durum ---------- */
const S={cur:"harita",seen:new Set(["harita"]),res:{},mis:{},last:"dunya",name:""};
let L=null;
function newLife(){ if(L){ L.alive=false; L.timers.forEach(clearTimeout); L.rafs.forEach(cancelAnimationFrame); } L={alive:true,timers:[],rafs:[]}; }
function later(fn,ms){ const l=L; l.timers.push(setTimeout(()=>{ if(l.alive) fn(); },RM?Math.min(ms,60):ms)); }
function animate(dur,step,done){
  const l=L; if(RM){ step(1); if(done) done(); return; }
  const t0=performance.now();
  const f=now=>{ if(!l.alive) return; const p=Math.min(1,(now-t0)/dur); step(p); if(p<1) l.rafs.push(requestAnimationFrame(f)); else if(done) done(); };
  l.rafs.push(requestAnimationFrame(f));
}
const sceneEl=$("#scene"), flabel=$("#flabel"), routeEl=$("#route"), viewEl=$("#view"), backBtn=$("#back");
const noteEl=$("#note"), ctlEl=$("#ctl"), infoEl=$("#info"), tasksEl=$("#tasks"), pscroll=$("#pscroll");
function scene(node){ sceneEl.replaceChildren(node); }
function ctl(...nodes){ ctlEl.replaceChildren(...nodes.flat()); }
function info(title,html){ infoEl.replaceChildren(h("h3",{},"Bilgi kartı"),h("div",{class:"infocard"},h("p",{class:"it"},title),h("p",{html}))); }
function infoEmpty(txt){ infoEl.replaceChildren(h("h3",{},"Bilgi kartı"),h("div",{class:"infocard empty"},txt||"Ekrandaki cisimlere dokun. Bilgileri burada göreceksin.")); }

/* ---------- görev kartları ---------- */
function taskState(t){
  if(t.type==="m") return S.mis[t.id]?"ok":"";
  const r=S.res[t.id]; if(!r) return "";
  if(t.type==="q") return r.c?"ok":"bad";
  return r.c===r.t?"ok":"part";
}
function taskIcon(t,i){ const st=taskState(t); if(st==="ok") return "✓"; if(st==="bad") return "✗"; if(st==="part") return S.res[t.id].c+"/"+S.res[t.id].t; return t.type==="m"?"◇":String(i+1); }
let openTask=null;
function renderTasks(){
  const st=STOPS[S.cur]; if(!st.tasks||!st.tasks.length){ return; }

function frame(now){
  requestAnimationFrame(frame);

  cx.globalAlpha=1; cx.fillStyle=warp?"rgba(6,9,20,0.35)":"#060914"; cx.fillRect(0,0,W,H);
  for(const st of field){

    if(st.z<=0.03){ st.z=1; st.x=Math.random()*2-1; st.y=Math.random()*2-1; continue; }
    const x=W/2+st.x/st.z*f, y=H/2+st.y/st.z*f, r=Math.max(.5,(1-st.z)*2.2);
    cx.globalAlpha=Math.min(1,.25+(1-st.z));
    if(warp){ cx.strokeStyle="#cfe0ff"; cx.lineWidth=r; cx.beginPath(); cx.moveTo(W/2+st.x/pz*f,H/2+st.y/pz*f); cx.lineTo(x,y); cx.stroke(); }
    else { cx.fillStyle="#dfe8ff"; cx.beginPath(); cx.arc(x,y,r,0,7); cx.fill(); }

}

          T(nb.x,Y+R+35,nb.n,"t-lbl"),seen?T(nb.x,Y+R+60,"✓ İNCELENDİ","t-ok"):null)); });
