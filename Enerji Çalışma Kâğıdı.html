function radioCheck(box,items,pts){
  var got=0;
  $$('.qi',box).forEach(function(row,i){
    var it=items[i],sel=row.querySelector('input:checked'),ok=!!sel&&+sel.value===it.a;
    $$('label.choice',row).forEach(function(l){var v=+l.querySelector('input').value;l.classList.remove('ok','no');if(v===it.a)l.classList.add('ok');else if(sel&&l.contains(sel))l.classList.add('no')});
    row.classList.toggle('ok',ok);row.classList.toggle('no',!ok);
    var fb=row.querySelector('.fb');fb.className='fb '+(ok?'good':'bad');fb.textContent=(ok?'Doğru. ':sel?'Yanlış. ':'Boş bırakıldı. ')+(it.w||'');
    if(ok)got+=pts;
  });
  return {got:got,max:items.length*pts};
}
function radios(name,labels,cls){return '<div class="choices '+(cls||'')+'">'+labels.map(function(t,j){return '<label class="choice"><input type="radio" name="'+name+'" value="'+j+'"><span>'+t+'</span></label>'}).join('')+'</div>'}

SECS.push({id:'hyp',title:'7. Hipotez ve değişkenler',pts:2,n:HYP.length,desc:'Hipotez, deneyle sınanabilen tahmindir. Deneyde değiştirdiğin şey bağımsız, ölçtüğün şey bağımlı değişkendir; diğer her şeyi sabit tutarsın. Her soru 2 puan.',

 check:function(b){var got=0,max=0;$$('.qi',b).forEach(function(row,i){$('.sample',row).hidden=false;$('.selfs',row).hidden=false;var c=$$('input.self:checked',row).length;got+=c;max+=OPEN[i].k.length;var fb=$('.fb',row);fb.className='fb '+(c===OPEN[i].k.length?'good':'');fb.textContent=c+' / '+OPEN[i].k.length+' nokta. Örnek cevapla karşılaştırıp kutuları işaretle, sonra yeniden kontrol et.'});return {got:got,max:max}}});

/* ---------- ÇİZİM ---------- */
var TOTAL=0;
function build(){
  RES={};TOTAL=0;
  var main=$('#main');main.innerHTML='';
  SECS.forEach(function(s){
    var max=s.id==='open'?OPEN.reduce(function(a,o){return a+o.k.length},0):s.n*s.pts;s.max=max;TOTAL+=max;
    var sec=document.createElement('section');sec.className='ws';sec.id='s-'+s.id;
    sec.innerHTML='<div class="gorev"><h2>'+s.title+'</h2><span class="pts">'+max+' puan</span></div><p class="lead">'+s.desc+'</p><div class="body"></div><div class="row"><button class="btn" type="button" data-sec="'+s.id+'">Bu bölümü kontrol et</button><span class="result" id="r-'+s.id+'" aria-live="polite"></span></div>';
    main.appendChild(sec);s.render($('.body',sec));
  });
  $('#finalbox').innerHTML='';
  updateScore();
}
function getSec(id){return SECS.filter(function(s){return s.id===id})[0]}
function runSec(id){
  var s=getSec(id),r=s.check($('#s-'+id+' .body'));RES[id]=r;
  $('#r-'+id).textContent=r.got+' / '+r.max+' puan';
  updateScore();
}
function updateScore(){
  var got=0;Object.keys(RES).forEach(function(k){got+=RES[k].got});
  $('#score').textContent='Puan: '+got+' / '+TOTAL;
  $('#pbar').style.width=(TOTAL?got/TOTAL*100:0)+'%';
}
$('#main').addEventListener('click',function(e){var b=e.target.closest('button[data-sec]');if(b)runSec(b.dataset.sec)});
$('#resetAll').addEventListener('click',function(){build();window.scrollTo(0,0)});
$('#checkAll').addEventListener('click',function(){
  SECS.forEach(function(s){runSec(s.id)});
  var got=0;Object.keys(RES).forEach(function(k){got+=RES[k].got});
  var pc=Math.round(got/TOTAL*100);
  var msg=pc>=85?'Çok iyi. Enerji konusunu iyi kavramışsın.':pc>=60?'İyi gidiyorsun. Kırmızı işaretli sorulara ders notundaki laboratuvarlarla tekrar bak.':'Ders notundaki laboratuvarları ve kontrol noktalarını tekrar çalış, sonra kâğıdı sıfırlayıp yeniden dene.';
  var rows=SECS.map(function(s){return '<tr><td>'+s.title+'</td><td class="mono">'+RES[s.id].got+' / '+RES[s.id].max+'</td></tr>'}).join('');
  var name=$('#ad').value.trim();
  var txt='Enerji Çalışma Kâğıdı\nAd Soyad: '+(name||'-')+'\nSınıf: '+($('#sinif').value.trim()||'-')+'\nPuan: '+got+' / '+TOTAL+' (%'+pc+')\n'+SECS.map(function(s){return s.title+': '+RES[s.id].got+' / '+RES[s.id].max}).join('\n');
  var fb=$('#finalbox');
  fb.innerHTML='<div class="final"><div class="big">'+got+' / '+TOTAL+'</div><p>'+msg+'</p><div class="tablebox"><table><tr><th>Bölüm</th><th>Puan</th></tr>'+rows+'</table></div><div class="row"><button class="btn primary" id="copyBtn" type="button">Sonucumu kopyala</button><span class="result" id="copyMsg" aria-live="polite"></span></div><div id="copyFallback"></div></div>';
  $('#copyBtn').addEventListener('click',function(){
    var done=function(ok){
      if(ok){$('#copyMsg').textContent='Kopyalandı.';$('#copyFallback').innerHTML=''}
      else{$('#copyMsg').textContent='Kopyalanamadı. Aşağıdaki metni seçip kopyala.';$('#copyFallback').innerHTML='<textarea class="copybox" id="cb" readonly></textarea>';var t=$('#cb');t.value=txt;t.focus();t.select()}
    };
    try{navigator.clipboard.writeText(txt).then(function(){done(true)},function(){done(false)})}catch(e){done(false)}
  });
  fb.scrollIntoView({behavior:'smooth',block:'start'});
});
build();
})();
</script>
