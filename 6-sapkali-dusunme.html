<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>6 Şapkalı Düşünme</title>
<style>
html,body{margin:0;padding:0;height:100%}
#sh-app{position:fixed;top:0;left:0;right:0;bottom:0;overflow-x:hidden;overflow-y:auto;background:linear-gradient(165deg,#fff8ec 0%,#ffe9c2 55%,#ffd699 100%);color:#3a2b12;font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;display:flex;flex-direction:column}
#sh-app *{box-sizing:border-box}
#sh-app button{font-family:inherit;cursor:pointer}
.sh-top{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:12px 20px;gap:12px}
.sh-title{font-size:clamp(18px,2.4vw,26px);font-weight:900;letter-spacing:.3px;text-align:center}
.sh-ico{width:42px;height:42px;border-radius:12px;border:1px solid rgba(0,0,0,.1);background:rgba(255,255,255,.6);color:#3a2b12;font-size:19px}
.sh-ico:hover{background:#fff}
.sh-ico.off{opacity:.45}
.sh-main{flex:1 0 auto;display:flex;gap:20px;padding:0 20px 20px;min-height:0}
.sh-stage{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:min(560px,calc(100vh - 80px));gap:18px}
.sh-dots{display:flex;gap:8px}
.sh-dot{width:10px;height:10px;border-radius:50%;background:rgba(0,0,0,.15);transition:transform .2s,background .2s}
.sh-dot.on{background:#e2434f;transform:scale(1.35)}
.sh-card{width:min(560px,92vw);border-radius:28px;padding:34px 30px;text-align:center;box-shadow:0 20px 50px -18px rgba(0,0,0,.35);animation:sh-in .45s cubic-bezier(.2,1.3,.4,1) both}
@keyframes sh-in{0%{transform:scale(.85) translateY(20px);opacity:0}100%{transform:scale(1) translateY(0);opacity:1}}
.sh-hatcircle{font-size:54px;line-height:1;margin-bottom:10px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.25))}
.sh-hname{font-size:clamp(24px,3.4vw,34px);font-weight:900;letter-spacing:.3px}
.sh-htag{font-size:clamp(14px,1.6vw,17px);font-weight:700;opacity:.85;margin-top:4px;margin-bottom:18px;text-transform:uppercase;letter-spacing:.06em}
.sh-qlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;text-align:left}
.sh-qlist li{background:rgba(255,255,255,.4);border-radius:12px;padding:11px 16px;font-size:clamp(14px,1.6vw,17px);font-weight:700;line-height:1.4}
.sh-nav{display:flex;gap:14px}
.sh-navbtn{padding:12px 22px;border-radius:14px;border:1px solid rgba(0,0,0,.1);background:#fff;color:#3a2b12;font-size:15px;font-weight:800}
.sh-navbtn:hover{background:#fff3e0}
.sh-panel{width:300px;flex-shrink:0;background:#fffaf1;border:1px solid #f0dfc0;border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:10px;align-self:flex-start}
.sh-lbl{font-size:12px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:#c2712f;margin-top:4px}
.sh-jumps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sh-jbtn{padding:10px 4px;border-radius:12px;border:2px solid transparent;font-size:22px;background:rgba(0,0,0,.04)}
.sh-jbtn.cur{border-color:#e2434f;transform:translateY(-2px)}
.sh-modes{display:flex;gap:8px}
.sh-mbtn{flex:1;padding:11px 6px;border-radius:12px;border:1px solid rgba(0,0,0,.1);background:#fff;color:#6b5636;font-size:14px;font-weight:800}
.sh-mbtn.on{background:linear-gradient(135deg,#ffb066,#ff7a59);color:#fff;border-color:transparent}
.sh-switch{display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px;cursor:pointer;margin-top:6px;user-select:none;color:#3a2b12}
.sh-switch input{display:none}
.sh-sub{font-weight:500;color:#a4855c;font-size:12px}
.sh-sl{width:44px;height:24px;border-radius:999px;background:rgba(0,0,0,.12);position:relative;flex-shrink:0;transition:background .2s}
.sh-sl:after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s}
.sh-switch input:checked + .sh-sl{background:#d97a3d}
.sh-switch input:checked + .sh-sl:after{transform:translateX(20px)}
.sh-stepper{display:flex;align-items:stretch;gap:6px}
.sh-stepper button{width:42px;border-radius:12px;border:1px solid rgba(0,0,0,.1);background:#fff;color:#3a2b12;font-size:22px;font-weight:700}
.sh-stepper input{flex:1;min-width:0;text-align:center;font-size:22px;font-weight:800;border-radius:12px;padding:6px}
#sh-app input[type=text]{background:#fff;color:#3a2b12;border:1px solid #e6cfa0;box-shadow:none;opacity:1}
#sh-app input[type=text]:focus{outline:2px solid #ff9d4d;border-color:#ff9d4d}
.sh-tdisp{text-align:center;font-size:30px;font-weight:900;font-variant-numeric:tabular-nums;color:#e2434f}
.sh-tdisp.warn{color:#d97a3d}
.sh-tdisp.done{color:#c22e2e}
.sh-tgo{padding:13px;border:none;border-radius:14px;font-size:16px;font-weight:900;color:#fff;background:linear-gradient(135deg,#ffb066,#ff7a59)}
.sh-hint2{font-size:12.5px;color:#7a5b34;line-height:1.5;background:rgba(217,122,61,.1);border-radius:10px;padding:9px 10px}
@media (max-width:980px){.sh-panel{width:250px;padding:16px}.sh-main{gap:12px;padding:0 12px 12px}}
@media (max-width:640px){.sh-main{flex-direction:column-reverse}.sh-top{padding:10px 12px}.sh-title{font-size:16px}.sh-panel{width:100%;align-self:stretch}.sh-card{padding:24px 18px}.sh-hatcircle{font-size:42px}}
</style>
</head>
<body>
<div id="sh-app">
<div class="sh-top">
<div style="width:42px"></div>
<div class="sh-title">🎩 6 Şapkalı Düşünme</div>
<button type="button" id="sh-snd" class="sh-ico" title="Ses">🔊</button>
</div>
<div class="sh-main">
<div class="sh-stage">
<div class="sh-dots" id="sh-dots"></div>
<div class="sh-card" id="sh-card">
<div class="sh-hatcircle" id="sh-hatcircle">🎩</div>
<div class="sh-hname" id="sh-hname"></div>
<div class="sh-htag" id="sh-htag"></div>
<ul class="sh-qlist" id="sh-qlist"></ul>
</div>
<div class="sh-nav"><button type="button" id="sh-prev" class="sh-navbtn">← Önceki</button><button type="button" id="sh-next" class="sh-navbtn">Sonraki →</button></div>
</div>
<div class="sh-panel">
<div class="sh-lbl">Şapkaya git</div>
<div class="sh-jumps" id="sh-jumps"></div>
<div class="sh-lbl">Sıra</div>
<div class="sh-modes"><button type="button" id="sh-m-order" class="sh-mbtn on">Sıralı</button><button type="button" id="sh-m-rand" class="sh-mbtn">Karışık</button></div>
<label class="sh-switch"><input type="checkbox" id="sh-timer-on"><span class="sh-sl"></span>Süre sınırı <span class="sh-sub">(her şapka için)</span></label>
<div id="sh-timerbox" style="display:none">
<div class="sh-lbl">Süre (dakika)</div>
<div class="sh-stepper"><button type="button" id="sh-tm">−</button><input id="sh-tmin" type="text" value="3" inputmode="numeric" autocomplete="off"><button type="button" id="sh-tp">+</button></div>
<div class="sh-tdisp" id="sh-tdisp">03:00</div>
<button type="button" id="sh-tgo" class="sh-tgo">▶ Süreyi Başlat</button>
</div>
<div class="sh-lbl">Yöntem</div>
<div class="sh-hint2">Sınıfı gruplara ayırın, her grup ya da tüm sınıf aynı şapkayla o açıdan düşünsün. Mavi şapka tartışmayı başlatır ve kapatır.</div>
</div>
</div>
</div>
<script>
(function(){
var el=function(id){return document.getElementById(id)};
var card=el('sh-card'),hn=el('sh-hname'),ht=el('sh-htag'),ql=el('sh-qlist'),dots=el('sh-dots'),jumps=el('sh-jumps'),tmin=el('sh-tmin'),tdisp=el('sh-tdisp'),tbox=el('sh-timerbox');
var hats=[
{c:'#eef1f3',tc:'#1a2530',n:'Beyaz Şapka',t:'Veri ve Bilgi',q:['Bu konuda hangi verilere/gözlemlere sahibiz?','Deneyde ölçtüğümüz sayılar neler?','Neyi henüz bilmiyoruz?']},
{c:'#e2434f',tc:'#ffffff',n:'Kırmızı Şapka',t:'Duygu ve Sezgi',q:['Bu konu/sonuç hakkında ilk hissiniz nedir?','Sonuç sizi şaşırttı mı? Neden?','Hangi açıklama size daha mantıklı geliyor?']},
{c:'#2b2f36',tc:'#ffffff',n:'Siyah Şapka',t:'Risk ve Eleştiri',q:['Bu yöntemin/deneyin zayıf yönleri neler?','Hangi hatalar sonucu etkilemiş olabilir?','Bu fikrin işe yaramayacağı bir durum var mı?']},
{c:'#f4c13a',tc:'#3a2b00',n:'Sarı Şapka',t:'Fayda ve İyimserlik',q:['Bu bilginin/yöntemin avantajları neler?','Günlük hayatta nerede işimize yarar?','En iyi ihtimalde ne olur?']},
{c:'#3fae6a',tc:'#ffffff',n:'Yeşil Şapka',t:'Yaratıcılık',q:['Farklı bir deney ya da yöntem önerebilir misiniz?','Bunu geliştirmenin bir yolu var mı?','Hiç denenmemiş bir fikir söyleyin.']},
{c:'#3a6fd8',tc:'#ffffff',n:'Mavi Şapka',t:'Süreç ve Özet',q:['Bugün ne öğrendik, özetleyelim.','Sırada ne var?','Hangi şapka en çok işimize yaradı?']}
];
var order='seq',cur=0,visited=[0],sound=true,actx=null,timerOn=false,tsec=180,ttot=180,trunning=false,tint=null;
function ac(){if(!sound){return null}try{if(!actx){actx=new (window.AudioContext||window.webkitAudioContext)()}return actx}catch(e){return null}}
function tone(f,d,v){var a=ac();if(!a){return}var o=a.createOscillator(),g=a.createGain(),t=a.currentTime;o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.02)}
function alarm(){for(var r=0;r!==6;r++){(function(dl){setTimeout(function(){tone(1046,.2,.28)},dl)})(r*260)}}
function p(n){return n>9?''+n:'0'+n}
function fmtT(s){return p(Math.floor(s/60))+':'+p(s%60)}
function stopTimer(){trunning=false;clearInterval(tint)}
function renderTimer(){tdisp.textContent=fmtT(tsec);tdisp.classList.toggle('warn',tsec<=10&&tsec>0);tdisp.classList.toggle('done',tsec===0)}
function resetTimer(){stopTimer();ttot=Math.max(30,Math.min(3600,(parseInt(tmin.value,10)||3)*60));tsec=ttot;renderTimer();el('sh-tgo').textContent='▶ Süreyi Başlat'}
function tickTimer(){tsec--;if(tsec<=0){tsec=0;renderTimer();stopTimer();alarm();el('sh-tgo').textContent='↺ Yeniden Başlat';return}renderTimer();if(tsec<=10){tone(700,.06,.1)}}
function toggleTimer(){if(tsec===0){resetTimer();return}if(trunning){stopTimer();el('sh-tgo').textContent='▶ Devam'}else{ac();trunning=true;tint=setInterval(tickTimer,1000);el('sh-tgo').textContent='⏸ Duraklat'}}
function renderDots(){dots.textContent='';hats.forEach(function(h,i){var d=document.createElement('span');d.className='sh-dot'+(i===cur?' on':'');dots.appendChild(d)})}
function renderJumps(){jumps.textContent='';hats.forEach(function(h,i){var b=document.createElement('button');b.type='button';b.className='sh-jbtn'+(i===cur?' cur':'');b.style.background=h.c;b.textContent='🎩';b.title=h.n;b.addEventListener('click',function(){go(i)});jumps.appendChild(b)})}
function render(){var h=hats[cur];card.style.background=h.c;card.style.color=h.tc;hn.textContent=h.n;ht.textContent=h.t;ql.textContent='';h.q.forEach(function(q){var li=document.createElement('li');li.textContent=q;ql.appendChild(li)});card.style.animation='none';void card.offsetWidth;card.style.animation='';renderDots();renderJumps();if(timerOn){resetTimer()}}
function go(i){cur=i;if(visited.indexOf(i)===-1){visited.push(i)}render()}
function next(){if(order==='seq'){go((cur+1)%hats.length);return}if(visited.length>=hats.length){visited=[cur]}var opts=[];for(var i=0;i!==hats.length;i++){if(visited.indexOf(i)===-1){opts.push(i)}}go(opts[Math.floor(Math.random()*opts.length)])}
function prev(){go((cur-1+hats.length)%hats.length)}
el('sh-next').addEventListener('click',next);
el('sh-prev').addEventListener('click',prev);
el('sh-m-order').addEventListener('click',function(){order='seq';this.classList.add('on');el('sh-m-rand').classList.remove('on')});
el('sh-m-rand').addEventListener('click',function(){order='rand';this.classList.add('on');el('sh-m-order').classList.remove('on')});
el('sh-timer-on').addEventListener('change',function(){timerOn=this.checked;tbox.style.display=timerOn?'block':'none';if(timerOn){resetTimer()}else{stopTimer()}});
el('sh-tm').addEventListener('click',function(){tmin.value=Math.max(1,(parseInt(tmin.value,10)||3)-1);resetTimer()});
el('sh-tp').addEventListener('click',function(){tmin.value=Math.min(60,(parseInt(tmin.value,10)||3)+1);resetTimer()});
tmin.addEventListener('change',resetTimer);
el('sh-tgo').addEventListener('click',toggleTimer);
el('sh-snd').addEventListener('click',function(){sound=!sound;this.classList.toggle('off',!sound);this.textContent=sound?'🔊':'🔇'});
document.addEventListener('keydown',function(e){var tg=(e.target.tagName||'').toLowerCase();if(tg==='input'){if(e.key==='Enter'){e.target.blur()}return}if(e.key==='ArrowRight'){next()}else if(e.key==='ArrowLeft'){prev()}else if(e.code==='Space'&&timerOn){e.preventDefault();toggleTimer()}});
render();
})();
</script>
</body>
</html>
