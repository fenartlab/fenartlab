<title>Güneş Gözlemevi</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
  :root{
    --bg: #150f28;
    --bg-deep: #0d0a1c;
    --panel: #211a3d;
    --panel-edge: #352a5e;
    --sun-core: #fff3c4;
    --sun-mid: #ffb648;
    --sun-edge: #ff6a3d;
    --sun-flare: #ffdb8a;
    --accent: #8fb8ff;
    --accent-dim: #5c7ecb;
    --ink: #f5efe2;
    --ink-dim: #b6acd6;
    --ink-faint: #7c73a0;
    --safe: #7fd28f;
    --danger: #ff6b6b;
    --font-display: 'Baloo 2', 'Segoe UI Rounded', sans-serif;
    --font-body: 'Figtree', 'Segoe UI', sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, monospace;
    color-scheme: dark;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    overflow-x: hidden;
  }

  h1,h2,h3{ font-family: var(--font-display); text-wrap: balance; margin:0; }
  p{ margin:0; }
  button{ font-family: inherit; }

  ::selection{ background: var(--sun-mid); color: var(--bg-deep); }

  :focus-visible{
    outline: 2px solid var(--accent);
    outline-offset: 3px;
    border-radius: 6px;
  }

  /* ---------- stage ---------- */
  .stage{
    position: relative;
    min-height: 100vh;
    background:
      radial-gradient(120% 90% at 50% -10%, #241a49 0%, transparent 55%),
      radial-gradient(140% 100% at 85% 110%, #1a1338 0%, transparent 50%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg-deep) 100%);
    padding: clamp(18px, 4vw, 40px);
    isolation: isolate;
  }

  #stars{
    position: absolute; inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 0;
  }
  .star{
    position: absolute;
    width: var(--s, 2px); height: var(--s, 2px);
    background: #fff;
    border-radius: 50%;
    opacity: var(--o, .5);
    animation: twinkle var(--dur, 4s) ease-in-out infinite;
    animation-delay: var(--delay, 0s);
  }
  @keyframes twinkle{
    0%, 100%{ opacity: var(--o, .5); }
    50%{ opacity: .08; }
  }

  .deck{
    position: relative;
    z-index: 1;
    max-width: 980px;
    margin: 0 auto;
  }

  /* ---------- header ---------- */
  .deck-head{
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: clamp(20px, 4vw, 36px);
  }
  .brand-kicker{
    display: inline-block;
    font-family: var(--font-mono);
    font-size: .72rem;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--accent);
    background: rgba(143,184,255,.1);
    border: 1px solid rgba(143,184,255,.25);
    padding: 4px 10px;
    border-radius: 999px;
    margin-bottom: 10px;
  }
  .deck-head h1{
    font-size: clamp(1.8rem, 4vw, 2.5rem);
    font-weight: 700;
    color: var(--ink);
    letter-spacing: .01em;
  }
  .brand-sub{
    color: var(--ink-dim);
    font-size: 1rem;
    margin-top: 6px;
    max-width: 46ch;
  }

  .progress{
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(33,26,61,.7);
    border: 1px solid var(--panel-edge);
    padding: 8px 14px 8px 8px;
    border-radius: 999px;
    backdrop-filter: blur(6px);
  }
  .progress-ring{
    width: 34px; height: 34px;
    border-radius: 50%;
    background: conic-gradient(var(--sun-mid) calc(var(--pct, 0) * 1%), rgba(255,255,255,.12) 0);
    display: grid;
    place-items: center;
    flex-shrink: 0;
    transition: background 1s cubic-bezier(.4,1.6,.5,1);
  }
  .progress-ring::after{
    content: "";
    width: 24px; height: 24px;
    border-radius: 50%;
    background: var(--panel);
  }
  .progress-label{
    font-family: var(--font-mono);
    font-size: .78rem;
    color: var(--ink-dim);
    white-space: nowrap;
  }
  .progress-label b{ color: var(--sun-flare); font-weight: 600; }

  /* ---------- observatory / sun / orbit ---------- */
  .observatory{
    position: relative;
    display: grid;
    place-items: center;
    min-height: min(560px, 78vw);
    margin-bottom: 8px;
  }

  .sun-wrap{
    position: relative;
    width: clamp(150px, 26vw, 220px);
    height: clamp(150px, 26vw, 220px);
    z-index: 2;
  }
  .sun-glow{
    position: absolute;
    inset: -70%;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,182,72,.35) 0%, rgba(255,106,61,.12) 45%, transparent 72%);
    animation: breathe 5s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes breathe{
    0%, 100%{ transform: scale(1); opacity: .85; }
    50%{ transform: scale(1.08); opacity: 1; }
  }
  .sun{
    position: absolute; inset: 0;
    border-radius: 50%;
    background: radial-gradient(circle at 38% 32%, var(--sun-core) 0%, var(--sun-mid) 42%, var(--sun-edge) 78%, #c73f1a 100%);
    box-shadow: 0 0 60px 6px rgba(255,140,60,.45), 0 0 130px 30px rgba(255,106,61,.2);
    overflow: hidden;
    cursor: pointer;
    transition: filter .25s, transform .25s;
  }
  .sun:hover, .sun:focus-visible{
    filter: brightness(1.08);
    transform: scale(1.015);
  }
  .sun-surface{
    position: absolute; inset: 0;
    border-radius: 50%;
    background:
      radial-gradient(circle at 30% 70%, rgba(255,255,255,.16) 0%, transparent 30%),
      radial-gradient(circle at 68% 22%, rgba(255,255,255,.1) 0%, transparent 26%);
    pointer-events: none;
  }
  .granule-field{
    position: absolute; inset: 0;
    border-radius: 50%;
    overflow: hidden;
    pointer-events: none;
  }
  .granule{
    position: absolute;
    width: 15%; height: 8.5%;
    border-radius: 50%;
    background: radial-gradient(ellipse, rgba(110,38,8,.6) 0%, rgba(110,38,8,0) 78%);
  }
  .sun-hint{
    position: absolute;
    left: 50%; bottom: -30px;
    transform: translateX(-50%);
    font-family: var(--font-mono);
    font-size: .68rem;
    letter-spacing: .05em;
    color: var(--ink-faint);
    white-space: nowrap;
    opacity: 0;
    transition: opacity .2s;
    pointer-events: none;
  }
  .sun-wrap:hover .sun-hint, .sun:focus-visible ~ .sun-hint{ opacity: 1; }

  .orbit{
    position: absolute;
    inset: 0;
    z-index: 3;
    pointer-events: none;
  }
  .orbit-btn{
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) translate(var(--x, 0px), var(--y, 0px));
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    width: 96px;
    background: none;
    border: none;
    color: var(--ink-dim);
    cursor: pointer;
    padding: 4px;
    pointer-events: auto;
  }
  .orbit-btn .ring{
    width: 56px; height: 56px;
    border-radius: 50%;
    background: rgba(33,26,61,.85);
    border: 1.5px solid var(--panel-edge);
    display: grid;
    place-items: center;
    transition: transform .25s cubic-bezier(.4,1.6,.5,1), border-color .25s, box-shadow .25s, background .25s;
    backdrop-filter: blur(4px);
  }
  .orbit-btn svg{ width: 26px; height: 26px; stroke: var(--ink-dim); transition: stroke .25s; }
  .orbit-btn span{
    font-size: .74rem;
    font-weight: 600;
    line-height: 1.15;
    text-align: center;
    color: var(--ink-dim);
    transition: color .25s;
  }
  .orbit-btn:hover .ring, .orbit-btn:focus-visible .ring{
    transform: scale(1.08);
    border-color: var(--accent);
    box-shadow: 0 0 0 5px rgba(143,184,255,.14);
  }
  .orbit-btn:hover svg, .orbit-btn:focus-visible svg,
  .orbit-btn:hover span, .orbit-btn:focus-visible span{ stroke: var(--accent); color: var(--ink); }
  .orbit-btn.done .ring{ border-color: var(--safe); background: rgba(127,210,143,.12); }
  .orbit-btn.done svg{ stroke: var(--safe); }
  .orbit-btn .check{
    position: absolute;
    top: -2px; right: 2px;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: var(--safe);
    color: var(--bg-deep);
    display: none;
    place-items: center;
    font-size: 11px;
    font-weight: 800;
    border: 2px solid var(--bg);
  }
  .orbit-btn.done .check{ display: grid; }

  .orbit--stacked{
    position: static;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px 4px;
    margin-top: 26px;
  }
  .orbit--stacked .orbit-btn{
    position: static;
    transform: none !important;
    width: auto;
  }

  /* ---------- bonus chip ---------- */
  .bonus-chip{
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 4px auto 0;
    background: rgba(143,184,255,.08);
    border: 1px dashed var(--accent-dim);
    color: var(--ink-dim);
    font-family: var(--font-body);
    font-weight: 600;
    font-size: .88rem;
    padding: 10px 16px;
    border-radius: 999px;
    cursor: pointer;
    max-width: fit-content;
    transition: border-color .2s, color .2s, background .2s;
  }
  .bonus-chip:hover{ border-color: var(--accent); color: var(--ink); background: rgba(143,184,255,.14); }
  .bonus-chip svg{ width: 18px; height: 18px; stroke: var(--accent); flex-shrink: 0; }

  /* ---------- panel (instrument drawer) ---------- */
  .scrim{
    position: fixed; inset: 0;
    background: rgba(9,7,20,.55);
    backdrop-filter: blur(2px);
    opacity: 0;
    pointer-events: none;
    transition: opacity .3s ease;
    z-index: 9;
  }
  .scrim.open{ opacity: 1; pointer-events: auto; }

  .panel{
    position: fixed;
    top: 0; right: 0;
    height: 100%;
    width: min(480px, 100%);
    background: linear-gradient(180deg, var(--panel) 0%, #1a1533 100%);
    border-left: 1px solid var(--panel-edge);
    box-shadow: -30px 0 60px rgba(0,0,0,.4);
    transform: translateX(100%);
    transition: transform .38s cubic-bezier(.32,.9,.35,1);
    z-index: 10;
    display: flex;
    flex-direction: column;
  }
  .panel.open{ transform: translateX(0); }
  .panel-inner{
    overflow-y: auto;
    padding: clamp(20px, 4vw, 34px);
    padding-top: 60px;
    flex: 1;
  }
  .panel-close{
    position: absolute;
    top: 18px; right: 18px;
    width: 38px; height: 38px;
    border-radius: 50%;
    border: 1px solid var(--panel-edge);
    background: rgba(21,15,40,.6);
    color: var(--ink-dim);
    font-size: 1.1rem;
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: color .2s, border-color .2s, transform .2s;
  }
  .panel-close:hover{ color: var(--ink); border-color: var(--accent); transform: rotate(90deg); }

  .panel-eyebrow{
    font-family: var(--font-mono);
    font-size: .72rem;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 8px;
  }
  .panel-body h2{
    font-size: 1.5rem;
    color: var(--ink);
    margin-bottom: 14px;
  }
  .panel-body p.lead{
    color: var(--ink-dim);
    font-size: .98rem;
    line-height: 1.6;
    margin-bottom: 20px;
    max-width: 52ch;
  }
  .panel-section{ margin-bottom: 26px; }
  .panel-section:last-child{ margin-bottom: 0; }

  .fact-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px; }
  .fact-list li{
    display: flex;
    gap: 10px;
    align-items: flex-start;
    color: var(--ink);
    font-size: .95rem;
    line-height: 1.5;
    background: rgba(255,255,255,.03);
    border: 1px solid var(--panel-edge);
    border-radius: 12px;
    padding: 12px 14px;
  }
  .fact-list li .dot{
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--sun-mid);
    margin-top: 6px;
    flex-shrink: 0;
  }

  .callout{
    border-radius: 14px;
    padding: 14px 16px;
    font-size: .9rem;
    line-height: 1.55;
    display: flex;
    gap: 10px;
  }
  .callout.warn{
    background: rgba(255,107,107,.08);
    border: 1px solid rgba(255,107,107,.3);
    color: #ffd7d7;
  }
  .callout.info{
    background: rgba(143,184,255,.08);
    border: 1px solid rgba(143,184,255,.3);
    color: #dbe7ff;
  }
  .callout b{ color: inherit; }

  /* tabs */
  .tabbar{ display: flex; gap: 6px; margin-bottom: 18px; background: rgba(0,0,0,.2); padding: 4px; border-radius: 12px; }
  .tabbar button{
    flex: 1;
    border: none;
    background: transparent;
    color: var(--ink-dim);
    padding: 9px 8px;
    border-radius: 9px;
    font-weight: 600;
    font-size: .84rem;
    cursor: pointer;
    transition: background .2s, color .2s;
  }
  .tabbar button.active{ background: var(--accent-dim); color: #fff; }

  /* shape widget */
  .shape-stage{
    display: grid;
    place-items: center;
    min-height: 190px;
    margin-bottom: 14px;
  }
  .mini-sun{
    width: 130px; height: 130px;
    border-radius: 50%;
    background: radial-gradient(circle at 36% 30%, var(--sun-core), var(--sun-mid) 45%, var(--sun-edge) 80%, #c73f1a 100%);
    box-shadow: 0 0 40px 4px rgba(255,140,60,.4);
    position: relative;
    overflow: hidden;
  }
  .mini-sun .tex{
    position: absolute; inset: -20%;
    background: radial-gradient(circle at 30% 70%, rgba(255,255,255,.16) 0%, transparent 20%),
                radial-gradient(circle at 65% 30%, rgba(255,255,255,.12) 0%, transparent 16%);
    animation: mini-churn 16s linear infinite;
  }
  @keyframes mini-churn{
    from{ transform: rotate(0deg); }
    to{ transform: rotate(360deg); }
  }

  .cutaway{ width: 190px; height: 190px; position: relative; }
  .cutaway .zone{
    position: absolute;
    border-radius: 50%;
    cursor: pointer;
    border: 1.5px solid rgba(255,255,255,.25);
    display: grid;
    place-items: center;
    transition: filter .2s, transform .15s;
  }
  .cutaway .zone:hover, .cutaway .zone:focus-visible{ filter: brightness(1.18); transform: scale(1.02); }
  .cutaway .surface{
    inset: 0;
    background: radial-gradient(circle at 40% 35%, var(--sun-mid), var(--sun-edge) 85%);
  }
  .cutaway .core{
    inset: 28%;
    background: radial-gradient(circle at 40% 35%, #fffdf0, var(--sun-core) 60%, #ffdc8f 100%);
    box-shadow: 0 0 20px 4px rgba(255,243,196,.6);
  }
  .cutaway .zone-label{
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    font-size: .68rem;
    font-weight: 700;
    color: #3a2200;
    text-shadow: 0 1px 0 rgba(255,255,255,.3);
  }
  .cutaway .zone-label.top{
    position: absolute;
    top: 14px; left: 50%;
    transform: translateX(-50%);
  }
  .cutaway .zone-temp{
    font-family: var(--font-mono);
    font-weight: 600;
    font-size: .6rem;
    color: #4a2a00;
    opacity: .85;
  }
  .zone-info{
    min-height: 62px;
    background: rgba(255,255,255,.04);
    border: 1px solid var(--panel-edge);
    border-radius: 12px;
    padding: 12px 14px;
    font-size: .88rem;
    color: var(--ink-dim);
    line-height: 1.5;
  }
  .zone-info b{ color: var(--sun-flare); }

  /* star widget */
  .star-orbit-demo{
    position: relative;
    width: 180px; height: 180px;
    margin: 6px auto 18px;
  }
  .star-orbit-demo .track{
    position: absolute; inset: 0;
    border: 1px dashed var(--panel-edge);
    border-radius: 50%;
  }
  .star-orbit-demo .sd-sun{
    position: absolute; top: 50%; left: 50%;
    width: 46px; height: 46px;
    margin: -23px 0 0 -23px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, var(--sun-core), var(--sun-mid) 55%, var(--sun-edge) 100%);
    box-shadow: 0 0 26px 4px rgba(255,140,60,.45);
  }
  .star-orbit-demo .sd-earth{
    position: absolute; top: 50%; left: 50%;
    width: 16px; height: 16px;
    margin: -8px 0 0 -8px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #8fd0ff, #3f7fd6 70%);
    box-shadow: 0 0 8px rgba(90,160,255,.6);
    animation: orbit-spin 9s linear infinite;
    transform-origin: -74px center;
  }
  @keyframes orbit-spin{ from{ transform: rotate(0deg) translateX(74px) rotate(0deg); } to{ transform: rotate(-360deg) translateX(74px) rotate(360deg); } }
  .star-orbit-demo .sd-cap{
    position: absolute;
    bottom: -6px; left: 50%; transform: translateX(-50%);
    font-family: var(--font-mono);
    font-size: .68rem;
    color: var(--ink-faint);
    white-space: nowrap;
  }

  /* spots widget */
  .spot-readout{
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-family: var(--font-mono);
    font-size: .78rem;
    color: var(--accent);
    letter-spacing: .04em;
    margin-bottom: 10px;
  }
  .spot-disk-wrap{ display: grid; place-items: center; margin-bottom: 14px; }
  .spot-disk{
    width: 220px; height: 220px;
    border-radius: 50%;
    position: relative;
    background: radial-gradient(circle at 38% 34%, var(--sun-core) 0%, var(--sun-mid) 46%, var(--sun-edge) 84%, #b8360f 100%);
    box-shadow: inset 0 0 30px rgba(0,0,0,.25), 0 0 40px 6px rgba(255,140,60,.3);
    overflow: hidden;
  }
  .spot{
    position: absolute;
    width: 20px; height: 14px;
    border-radius: 50%;
    background: radial-gradient(circle, #3a1806 0%, #1c0c02 80%);
    transform: translate(-50%, -50%);
    transition: left .5s cubic-bezier(.4,.2,.2,1), top .5s cubic-bezier(.4,.2,.2,1), opacity .5s;
  }
  .spot::after{
    content: attr(data-label);
    position: absolute;
    top: -16px; left: 50%;
    transform: translateX(-50%);
    font-family: var(--font-mono);
    font-size: .62rem;
    color: var(--ink);
    background: rgba(0,0,0,.5);
    padding: 0 4px;
    border-radius: 3px;
  }
  .spot-controls{ display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .spot-controls input[type="range"]{ flex: 1; }
  .play-btn{
    width: 40px; height: 40px;
    border-radius: 50%;
    border: 1px solid var(--accent-dim);
    background: rgba(143,184,255,.1);
    color: var(--accent);
    font-size: 1rem;
    cursor: pointer;
    flex-shrink: 0;
    display: grid; place-items: center;
    transition: background .2s;
  }
  .play-btn:hover{ background: rgba(143,184,255,.22); }

  input[type="range"]{
    -webkit-appearance: none;
    height: 6px;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--sun-mid) 0%, var(--sun-mid) var(--fill, 0%), rgba(255,255,255,.12) var(--fill, 0%));
    outline: none;
  }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance: none;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: var(--ink);
    border: 3px solid var(--sun-mid);
    cursor: pointer;
    margin-top: -6px;
  }
  input[type="range"]::-moz-range-thumb{
    width: 18px; height: 18px; border-radius: 50%;
    background: var(--ink); border: 3px solid var(--sun-mid); cursor: pointer;
  }

  .reveal-btn{
    background: none;
    border: 1px solid var(--accent-dim);
    color: var(--accent);
    font-weight: 600;
    font-size: .85rem;
    padding: 8px 14px;
    border-radius: 10px;
    cursor: pointer;
    transition: background .2s;
  }
  .reveal-btn:hover{ background: rgba(143,184,255,.12); }
  .reveal-answer{
    margin-top: 10px;
    font-size: .88rem;
    color: var(--ink-dim);
    line-height: 1.55;
    display: none;
    border-left: 2px solid var(--sun-mid);
    padding-left: 12px;
  }
  .reveal-answer.show{ display: block; }

  /* size-distance widget */
  .size-demo{
    background: rgba(255,255,255,.03);
    border: 1px solid var(--panel-edge);
    border-radius: 16px;
    padding: 18px;
    margin-bottom: 16px;
  }
  .size-track{
    position: relative;
    height: 130px;
    margin: 8px 0 18px;
    border-bottom: 1px dashed var(--panel-edge);
  }
  .observer{
    position: absolute; left: 4px; bottom: -4px;
    font-size: 1.3rem;
  }
  .ball{
    position: absolute;
    bottom: 0;
    border-radius: 50%;
    transform: translateX(-50%);
  }
  .ball.small{
    left: 70px;
    width: 30px; height: 30px;
    background: radial-gradient(circle at 35% 30%, #ffe8b0, #e08a2e 75%);
  }
  .ball.big{
    background: radial-gradient(circle at 35% 30%, var(--sun-core), var(--sun-edge) 85%);
    box-shadow: 0 0 18px 2px rgba(255,140,60,.35);
  }
  .size-readout{
    font-family: var(--font-mono);
    font-size: .74rem;
    color: var(--ink-faint);
    margin-bottom: 6px;
  }
  .size-readout b{ color: var(--accent); font-weight: 600; }
  .match-note{
    font-size: .82rem;
    color: var(--sun-flare);
    font-weight: 600;
    margin-top: 10px;
    min-height: 1.3em;
  }
  .size-legend{
    display: flex;
    gap: 18px;
    margin-top: 14px;

  }

  /* safety widget */
  .safety-grid{
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 18px;
  }
  .safety-card{
    background: rgba(255,255,255,.03);
    border: 1px solid var(--panel-edge);
    border-radius: 14px;
    padding: 12px;
    cursor: pointer;
    text-align: left;
    color: var(--ink);
    font-family: inherit;
    transition: border-color .2s, background .2s;
  }
  .safety-card:hover{ border-color: var(--accent-dim); }
  .safety-card .icon{ font-size: 1.3rem; margin-bottom: 6px; display: block; }
  .safety-card .name{ font-weight: 700; font-size: .85rem; display: block; margin-bottom: 4px; }
  .safety-card .verdict{
    display: none;
    font-size: .78rem;
    line-height: 1.4;
    margin-top: 6px;

    border-top: 1px solid var(--panel-edge);
  }
  .safety-card.revealed .verdict{ display: block; }
  .safety-card.revealed.safe{ border-color: var(--safe); background: rgba(127,210,143,.08); }
  .safety-card.revealed.unsafe{ border-color: var(--danger); background: rgba(255,107,107,.08); }
  .safety-card .tag{
    display: none;
    font-family: var(--font-mono);
    font-size: .68rem;
    font-weight: 600;
    letter-spacing: .05em;
    margin-top: 4px;
  }
  .safety-card.revealed .tag{ display: inline-block; }
  .safety-card.revealed.safe .tag{ color: var(--safe); }
  .safety-card.revealed.unsafe .tag{ color: var(--danger); }

  /* bonus panel */
  .bonus-visual{
    display: grid;
    place-items: center;
    min-height: 140px;
    margin-bottom: 16px;
    position: relative;
  }
  .bonus-visual .b-sun{
    width: 90px; height: 90px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, var(--sun-core), var(--sun-mid) 50%, var(--sun-edge) 100%);
    box-shadow: 0 0 34px 6px rgba(255,140,60,.4);
  }
  .bonus-visual .probe{
    position: absolute;
    font-size: 1.4rem;
    animation: probe-approach 4s ease-in-out infinite;
  }
  @keyframes probe-approach{
    0%{ transform: translate(70px, -60px) scale(1); }
    50%{ transform: translate(20px, -10px) scale(1.15); }
    100%{ transform: translate(70px, -60px) scale(1); }
  }

  .toast{
    position: fixed;
    bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--panel);
    border: 1px solid var(--sun-mid);
    color: var(--ink);
    padding: 14px 22px;
    border-radius: 14px;
    font-weight: 600;
    font-size: .92rem;
    box-shadow: 0 10px 30px rgba(0,0,0,.4);
    opacity: 0;
    pointer-events: none;
    transition: opacity .4s, transform .4s;
    z-index: 20;
    text-align: center;
  }
  .toast.show{ opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 720px){
    .safety-grid{ grid-template-columns: 1fr; }
  }

  @media (prefers-reduced-motion: reduce){
    .sun-glow, .mini-sun .tex, .sd-earth, .probe{ animation: none !important; }
  }
</style>

    <div class="observatory">

<script>
(function(){
  "use strict";

  /* ---------- starfield ---------- */
  var starsEl = document.getElementById('stars');
  var starHtml = '';
  for (var i = 0; i < 70; i++){
    var top = Math.random()*100, left = Math.random()*100;
    var size = (Math.random()*1.6 + 0.6).toFixed(2);
    var dur = (Math.random()*3 + 2.5).toFixed(2);
    var delay = (Math.random()*4).toFixed(2);
    var op = (Math.random()*0.5 + 0.25).toFixed(2);
    starHtml += '<div class="star" style="top:'+top+'%;left:'+left+'%;--s:'+size+'px;--dur:'+dur+'s;--delay:'+delay+'s;--o:'+op+'"></div>';
  }
  starsEl.innerHTML = starHtml;

  /* ---------- hero sun rotation ----------
     Granules sweep left-to-right across the visible face (angle increasing),
     then pass behind the disk and reappear on the left, like a real rotating
     sphere viewed edge-on — not a flat spinning texture. */
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var granules = Array.prototype.slice.call(document.querySelectorAll('.granule'));
  if (granules.length && !reduceMotion){
    var rotStart = performance.now();
    var DEG_PER_SEC = 22;
    (function heroRotate(now){
      var elapsed = (now - rotStart) / 1000;
      granules.forEach(function(g){
        var phase = parseFloat(g.getAttribute('data-phase'));
        var lat = parseFloat(g.getAttribute('data-lat'));
        var angleDeg = phase + elapsed * DEG_PER_SEC;
        var rad = angleDeg * Math.PI / 180;
        var sinA = Math.sin(rad), cosA = Math.cos(rad);
        var xPct = 50 + sinA * 40;
        var squash = Math.max(cosA, 0.04);
        var op = cosA > 0 ? Math.min(1, cosA * 1.5) : 0;
        g.style.left = xPct + '%';
        g.style.top = (lat * 100) + '%';
        g.style.opacity = op;
        g.style.transform = 'translate(-50%, -50%) scaleX(' + squash.toFixed(3) + ')';
      });
      requestAnimationFrame(heroRotate);
    })(rotStart);
  } else if (granules.length){
    granules.forEach(function(g){
      var lat = parseFloat(g.getAttribute('data-lat'));
      g.style.left = '50%';
      g.style.top = (lat * 100) + '%';
      g.style.opacity = '.7';
      g.style.transform = 'translate(-50%, -50%)';
    });
  }

  /* ---------- topic data ---------- */
  var TOPICS = [
    {
      key: 'shape',
      label: 'Şekli ve Yapısı',
      icon: '<circle cx="12" cy="12" r="8"/><path d="M4 12h16M12 4a12 12 0 0 1 0 16 12 12 0 0 1 0-16Z"/>',
      eyebrow: 'İstasyon 1 · Şekil & Yapı'
    },
    {
      key: 'star',
      label: 'Bir Yıldız mı?',
      icon: '<path d="M12 3v5M12 16v5M3 12h5M16 12h5M6 6l3.5 3.5M14.5 14.5 18 18M18 6l-3.5 3.5M9.5 14.5 6 18"/>',
      eyebrow: 'İstasyon 2 · Nedir?'
    },
    {
      key: 'spots',
      label: 'Güneş Lekeleri',
      icon: '<circle cx="12" cy="12" r="8.5"/><circle cx="9" cy="10" r="1.4" fill="currentColor" stroke="none"/><circle cx="14" cy="13" r="1.1" fill="currentColor" stroke="none"/><circle cx="10.5" cy="15" r="0.9" fill="currentColor" stroke="none"/>',
      eyebrow: 'İstasyon 3 · Gözlem'
    },
    {
      key: 'size',
      label: 'Neden Küçük Görünür?',
      icon: '<circle cx="6" cy="16" r="2.5"/><circle cx="17" cy="9" r="4.5"/><path d="M8.5 15 13 11" stroke-dasharray="2 2"/>',
      eyebrow: 'İstasyon 4 · Büyüklük'
    },
    {
      key: 'safety',
      label: 'Güvenli Gözlem',
      icon: '<path d="M12 3l7 3v6c0 5-3 8-7 9-4-1-7-4-7-9V6l7-3Z"/><path d="M9 12l2 2 4-4" />',
      eyebrow: 'İstasyon 5 · Güvenlik'
    }
  ];

  var state = { explored: new Set(), spotsTimer: null };

  /* ---------- orbit nav ---------- */
  var orbitNav = document.getElementById('orbitNav');
  var mq = window.matchMedia('(max-width: 640px)');

  function buildOrbit(){
    orbitNav.innerHTML = '';
    orbitNav.className = mq.matches ? 'orbit orbit--stacked' : 'orbit';
    var n = TOPICS.length;
    var radius = mq.matches ? 0 : Math.min(orbitNav.parentElement.clientWidth, orbitNav.parentElement.clientHeight) * 0.42;
    TOPICS.forEach(function(t, i){
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'orbit-btn' + (state.explored.has(t.key) ? ' done' : '');
      btn.setAttribute('data-topic', t.key);
      if (!mq.matches){
        var angle = (-90 + i * (360/n)) * Math.PI/180;
        var x = Math.cos(angle) * radius;
        var y = Math.sin(angle) * radius;
        btn.style.setProperty('--x', x.toFixed(1)+'px');
        btn.style.setProperty('--y', y.toFixed(1)+'px');
      }
      btn.innerHTML = '<span class="ring"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">'+t.icon+'</svg><span class="check">✓</span></span><span>'+t.label+'</span>';
      btn.addEventListener('click', function(){ openPanel(t.key); });
      orbitNav.appendChild(btn);
    });
  }
  buildOrbit();
  window.addEventListener('resize', debounce(buildOrbit, 150));
  mq.addEventListener ? mq.addEventListener('change', buildOrbit) : mq.addListener(buildOrbit);

  function debounce(fn, ms){ var t; return function(){ clearTimeout(t); t = setTimeout(fn, ms); }; }

  /* ---------- panel plumbing ---------- */
  var panel = document.getElementById('panel');
  var scrim = document.getElementById('scrim');
  var panelBody = document.getElementById('panelBody');
  var lastTrigger = null;

  function markExplored(key){
    if (state.explored.has(key)) return;
    state.explored.add(key);
    document.getElementById('exploredCount').textContent = state.explored.size;
    document.getElementById('progressRing').style.setProperty('--pct', Math.round(state.explored.size/TOPICS.length*100));
    var btn = orbitNav.querySelector('[data-topic="'+key+'"]');
    if (btn) btn.classList.add('done');
    if (state.explored.size === TOPICS.length){
      showToast('🌞 Tebrikler! Güneş gözlemevindeki tüm istasyonları tamamladın.');
    }
  }

  var RENDERERS = {
    shape: renderShape,
    star: renderStar,
    spots: renderSpots,
    size: renderSize,
    safety: renderSafety,
    bonus: renderBonus
  };

  var pendingShapeTab = 'outer';

  function openPanel(key, trigger, opts){
    stopSpotsTimer();
    lastTrigger = trigger || document.activeElement;
    if (key === 'shape') pendingShapeTab = (opts && opts.tab) || 'outer';
    var meta = TOPICS.filter(function(t){ return t.key === key; })[0];
    panelBody.innerHTML = RENDERERS[key](meta);
    panel.classList.add('open');
    scrim.classList.add('open');
    panel.setAttribute('aria-hidden', 'false');
    if (key !== 'bonus') markExplored(key);
    document.getElementById('panelClose').focus();
  }

  var sunCoreBtn = document.getElementById('sunCore');
  sunCoreBtn.addEventListener('click', function(e){ openPanel('shape', e.currentTarget, { tab: 'cut' }); });
  sunCoreBtn.addEventListener('keydown', function(e){
    if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openPanel('shape', e.currentTarget, { tab: 'cut' }); }
  });

  function closePanel(){
    stopSpotsTimer();
    panel.classList.remove('open');
    scrim.classList.remove('open');
    panel.setAttribute('aria-hidden', 'true');
    if (lastTrigger && lastTrigger.focus) lastTrigger.focus();
  }

  document.getElementById('panelClose').addEventListener('click', closePanel);
  scrim.addEventListener('click', closePanel);
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && panel.classList.contains('open')) closePanel(); });
  document.getElementById('bonusChip').addEventListener('click', function(e){ openPanel('bonus', e.currentTarget); });

  function stopSpotsTimer(){ if (state.spotsTimer){ clearInterval(state.spotsTimer); state.spotsTimer = null; } }

  function showToast(msg){
    var toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(function(){ toast.classList.remove('show'); }, 3600);
  }

  /* ---------- panel: shape ---------- */
  function renderShape(meta){
    var outerActive = pendingShapeTab !== 'cut';
    return '' +
      '<p class="panel-eyebrow">'+meta.eyebrow+'</p>' +
      '<h2>Güneş\'in şekli ve yapısı</h2>' +
      '<p class="lead">Güneş\'in şekli, tıpkı Dünya gibi küreye benzer. Sıcak gazlardan oluşur ve farklı katmanları vardır. Aşağıdan görünümünü değiştirip inceleyebilirsin.</p>' +
      '<div class="tabbar" role="tablist">' +
        '<button class="'+(outerActive?'active':'')+'" data-tab="outer" type="button" role="tab">Dıştan Görünüşü</button>' +
        '<button class="'+(outerActive?'':'active')+'" data-tab="cut" type="button" role="tab">İçini Kesit Al</button>' +
      '</div>' +
      '<div id="shapeStage"></div>';
  }

  function mountShapeStage(){
    var stage = document.getElementById('shapeStage');
    if (!stage) return;
    var tabs = document.querySelectorAll('.tabbar [data-tab]');
    tabs.forEach(function(tb){
      tb.addEventListener('click', function(){
        tabs.forEach(function(x){ x.classList.remove('active'); });
        tb.classList.add('active');
        paintShape(tb.getAttribute('data-tab'));
      });
    });
    paintShape(pendingShapeTab);
  }

  function paintShape(mode){
    var stage = document.getElementById('shapeStage');
    if (mode === 'outer'){
      stage.innerHTML =
        '<div class="shape-stage"><div class="mini-sun"><div class="tex"></div></div></div>' +
        '<div class="callout info"><span>🌐</span><span><b>Küreye benzer.</b> Güneş\'i her yönden görebilseydik, tıpkı bir top ya da Dünya gibi yuvarlak (küre) olduğunu görürdün.</span></div>';
    } else {
      stage.innerHTML =
        '<div class="shape-stage"><div class="cutaway">' +
          '<div class="zone surface" data-zone="surface" tabindex="0" role="button" aria-label="Yüzey, yaklaşık 5.500 derece">' +
            '<span class="zone-label top">YÜZEY<span class="zone-temp">~5.500 °C</span></span>' +
          '</div>' +
          '<div class="zone core" data-zone="core" tabindex="0" role="button" aria-label="Merkez, yaklaşık 15 milyon derece">' +
            '<span class="zone-label">MERKEZ<span class="zone-temp">~15.000.000 °C</span></span>' +
          '</div>' +
        '</div></div>' +
        '<div class="zone-info" id="zoneInfo">Bir bölgeye dokun veya tıkla, ne olduğunu öğren.</div>';
      var infoBox = document.getElementById('zoneInfo');
      var texts = {
        core: '<b>Merkez (çekirdek): yaklaşık 15.000.000 °C</b> — Güneş\'in en sıcak bölgesi burasıdır. Yüzeydeki sıcaklıktan çok daha yüksektir.',
        surface: '<b>Yüzey: yaklaşık 5.500 °C</b> — Bizim gördüğümüz parlak dış kısım. Güneş lekeleri de bu yüzeyde görünür.'
      };
      document.querySelectorAll('.cutaway .zone').forEach(function(z){
        function act(){ infoBox.innerHTML = texts[z.getAttribute('data-zone')]; }
        z.addEventListener('click', act);
        z.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); act(); } });
      });
    }
  }

  /* ---------- panel: star ---------- */
  function renderStar(meta){
    return '' +
      '<p class="panel-eyebrow">'+meta.eyebrow+'</p>' +
      '<h2>Güneş bir yıldız mı?</h2>' +
      '<p class="lead">Çevresine ısı ve ışık yayan gök cisimlerine <b style="color:var(--ink)">yıldız</b> denir. Güneş de bir yıldızdır!</p>' +
      '<div class="star-orbit-demo">' +
        '<div class="track"></div>' +
        '<div class="sd-sun"></div>' +
        '<div class="sd-earth"></div>' +
        '<div class="sd-cap">Dünya, Güneş\'in etrafında dolanır</div>' +
      '</div>' +
      '<ul class="fact-list">' +
        '<li><span class="dot"></span><span>Güneş, milyarlarca yıldız arasından Dünya\'ya <b style="color:var(--sun-flare)">en yakın</b> olanıdır.</span></li>' +
        '<li><span class="dot"></span><span>Dünya\'nın ısı ve ışık kaynağıdır.</span></li>' +
        '<li><span class="dot"></span><span>Dünya, Güneş\'in etrafında dolanır — Güneş, Dünya\'nın etrafında değil!</span></li>' +
      '</ul>';
  }

  /* ---------- panel: spots ---------- */
  var spotConfig = [
    { id: 'A', y: 44, start: -70 },
    { id: 'B', y: 50, start: -58 },
    { id: 'C', y: 58, start: -46 }
  ];
  var spotDay = 1;

  function renderSpots(meta){
    spotDay = 1;
    return '' +
      '<p class="panel-eyebrow">'+meta.eyebrow+'</p>' +
      '<h2>Güneş lekelerini gözlemle</h2>' +
      '<p class="lead">Ders kitabındaki Ayşe de teleskobuna güvenli bir filtre takıp Güneş\'i günler boyunca gözlemlemiş ve yüzeydeki koyu bölgelerin konumunu çizmişti. Kaydırıcıyı hareket ettirerek sen de gözlemle.</p>' +
      '<div class="spot-readout"><span>GÖZLEM GÜNLÜĞÜ</span><span id="spotDayLabel">1 / 5. gözlem</span></div>' +
      '<div class="spot-disk-wrap"><div class="spot-disk" id="spotDisk">' +
        spotConfig.map(function(s){ return '<div class="spot" data-id="'+s.id+'" data-label="'+s.id+'"></div>'; }).join('') +
      '</div></div>' +
      '<div class="spot-controls">' +
        '<button class="play-btn" id="spotPlay" type="button" aria-label="Oynat">▶</button>' +
        '<input type="range" id="spotSlider" min="1" max="5" step="1" value="1">' +
      '</div>' +
      '<div class="callout warn"><span>⚠️</span><span><b>Dikkat, karıştırma:</b> Güneş lekeleri, Güneş\'in katmanı DEĞİLDİR. Katmanlar Güneş\'in iç yapısıdır; lekeler ise yüzeyde gördüğümüz koyu bölgelerdir.</span></div>' +
      '<div class="panel-section">' +
        '<button class="reveal-btn" id="spotReveal" type="button">Lekeler neden yer değiştirir? Cevabı gör</button>' +
        '<div class="reveal-answer" id="spotAnswer">Güneş, kendi ekseni etrafında döner. Bunu ilk kez <b style="color:var(--ink)">Galileo Galilei</b>, belli aralıklarla gözlemlediği Güneş lekelerinin hep aynı yöne doğru kaydığını fark ederek kanıtlamıştır.</div>' +
      '</div>';
  }

  function mountSpots(){
    var slider = document.getElementById('spotSlider');
    if (!slider) return;
    paintSpots(1);
    slider.addEventListener('input', function(){ paintSpots(parseInt(slider.value, 10)); });
    document.getElementById('spotPlay').addEventListener('click', toggleSpotPlay);
    document.getElementById('spotReveal').addEventListener('click', function(){
      document.getElementById('spotAnswer').classList.toggle('show');
    });
  }

  function paintSpots(day){
    spotDay = day;
    var disk = document.getElementById('spotDisk');
    if (!disk) return;
    var R = 96;
    spotConfig.forEach(function(s){
      var angleDeg = s.start + (day - 1) * 34;
      var rad = angleDeg * Math.PI / 180;
      var x = 110 + Math.sin(rad) * R * 0.92;
      var visible = Math.abs(angleDeg) < 92;
      var el = disk.querySelector('[data-id="'+s.id+'"]');
      el.style.left = x.toFixed(1) + 'px';
      el.style.top = (s.y/100*220).toFixed(1) + 'px';
      el.style.opacity = visible ? (1 - Math.abs(angleDeg)/110) : 0;
    });
    document.getElementById('spotDayLabel').textContent = day + ' / 5. gözlem';
    document.getElementById('spotSlider').value = day;
    document.getElementById('spotSlider').style.setProperty('--fill', ((day-1)/4*100)+'%');
  }

  function toggleSpotPlay(){
    var btn = document.getElementById('spotPlay');
    if (state.spotsTimer){ stopSpotsTimer(); btn.textContent = '▶'; return; }
    btn.textContent = '❚❚';
    state.spotsTimer = setInterval(function(){
      var next = spotDay >= 5 ? 1 : spotDay + 1;
      paintSpots(next);
    }, 900);
  }

  /* ---------- panel: size ---------- */
  function renderSize(meta){
    return '' +
      '<p class="panel-eyebrow">'+meta.eyebrow+'</p>' +
      '<h2>Neden gökyüzünde küçük görünür?</h2>' +
      '<p class="lead">Güneş, Dünya\'dan çok daha büyüktür. Ama bize çok uzak olduğu için gökyüzünde küçük görünür. Ders kitabındaki iki top deneyini burada dene: uzaklığı değiştir, görünen boyutun nasıl değiştiğini izle.</p>' +
      '<div class="size-demo">' +
        '<div class="size-readout"><span>UZAKLIK: <b id="distVal">yakın</b></span></div>' +
        '<div class="size-track"><span class="observer">🧑</span><div class="ball small" id="ballSmall"></div><div class="ball big" id="ballBig"></div></div>' +
        '<input type="range" id="distSlider" min="0" max="100" step="1" value="15">' +
        '<div class="match-note" id="matchNote">&nbsp;</div>' +
        '<div class="size-legend">' +
          '<span><span class="swatch" style="background:#e08a2e"></span>Küçük top — gerçekte küçük, gözlemciye yakın</span>' +
          '<span><span class="swatch" style="background:var(--sun-edge)"></span>Büyük top — gerçekte çok büyük, uzaklığı sen ayarlıyorsun</span>' +
        '</div>' +
      '</div>' +
      '<div class="panel-section">' +
        '<button class="reveal-btn" id="sizeReveal" type="button">Güneş ile bağlantısı ne? Cevabı gör</button>' +
        '<div class="reveal-answer" id="sizeAnswer">Güneş de tıpkı buradaki büyük top gibi: gerçek boyutu Dünya\'dan çok daha büyük, ama Dünya\'ya çok uzak olduğu için gökyüzünde küçük bir yuvarlak gibi görünüyor.</div>' +
      '</div>';
  }

  function mountSize(){
    var slider = document.getElementById('distSlider');
    if (!slider) return;
    paintSize(15);
    slider.addEventListener('input', function(){ paintSize(parseInt(slider.value, 10)); });
    document.getElementById('sizeReveal').addEventListener('click', function(){
      document.getElementById('sizeAnswer').classList.toggle('show');
    });
  }

  function paintSize(dist){
    var big = document.getElementById('ballBig');
    var small = document.getElementById('ballSmall');
    if (!big) return;
    var trackWidth = 300;
    var leftPos = 90 + (dist/100) * (trackWidth - 110);
    var realDiameter = 92;
    var apparent = realDiameter / (1 + dist/16);
    apparent = Math.max(apparent, 10);
    big.style.left = leftPos + 'px';
    big.style.width = apparent + 'px';
    big.style.height = apparent + 'px';
    var smallApparent = 30;
    document.getElementById('distVal').textContent = dist < 25 ? 'yakın' : (dist < 65 ? 'orta' : 'çok uzak');
    document.getElementById('distSlider').style.setProperty('--fill', dist+'%');
    var note = document.getElementById('matchNote');
    if (Math.abs(apparent - smallApparent) < 5){
      note.textContent = '👀 İki top da gökyüzünde neredeyse aynı boyutta görünüyor!';
    } else {
      note.innerHTML = '&nbsp;';
    }
  }

  /* ---------- panel: safety ---------- */
  var SAFETY_ITEMS = [
    { icon: '👁️', name: 'Çıplak gözle bakmak', safe: false, note: 'Tehlikeli! Güneş\'e doğrudan bakmak gözlere kalıcı hasar, hatta görme kaybı verebilir.' },
    { icon: '🔭', name: 'Filtresiz teleskop/dürbünle bakmak', safe: false, note: 'Çok tehlikeli! Güneş ışığı, küçük bir büyüteçle bile kâğıdı tutuşturabilecek kadar yüksek enerjiye sahiptir.' },
    { icon: '🛡️', name: 'Özel filtreli teleskopla bakmak', safe: true, note: 'Güvenli. Gök bilimciler Güneş\'i incelerken teleskoplarında özel filtreler kullanır.' },
    { icon: '📽️', name: 'Görüntüyü beyaz ekrana yansıtmak', safe: true, note: 'Güvenli. Teleskoptaki görüntü, teleskoba hiç bakmadan beyaz bir ekrana yansıtılabilir.' }
  ];

  function renderSafety(meta){
    return '' +
      '<p class="panel-eyebrow">'+meta.eyebrow+'</p>' +
      '<h2>Güneş\'i güvenle gözlemlemek</h2>' +
      '<p class="lead">Güneş\'e hangi yollarla bakmak güvenli, hangileri tehlikeli? Kartlara tıklayıp tahmininin doğru olup olmadığını gör.</p>' +
      '<div class="safety-grid">' +
        SAFETY_ITEMS.map(function(it, i){
          return '<button class="safety-card" data-i="'+i+'" type="button">' +
            '<span class="icon">'+it.icon+'</span>' +
            '<span class="name">'+it.name+'</span>' +
            '<span class="tag">'+(it.safe ? '✅ GÜVENLİ' : '❌ TEHLİKELİ')+'</span>' +
            '<span class="verdict">'+it.note+'</span>' +
          '</button>';
        }).join('') +
      '</div>' +
      '<div class="callout warn"><span>🔥</span><span>Güneş ışığı, küçük bir büyüteçle bile kâğıdı tutuşturabilecek kadar yüksek enerjiye sahiptir. Bu yüzden Güneş, koruyucu filtreler olmadan asla doğrudan gözlemlenmemelidir.</span></div>';
  }

  function mountSafety(){
    document.querySelectorAll('.safety-card').forEach(function(card){
      card.addEventListener('click', function(){
        var it = SAFETY_ITEMS[parseInt(card.getAttribute('data-i'), 10)];
        card.classList.add('revealed', it.safe ? 'safe' : 'unsafe');
      });
    });
  }

  /* ---------- panel: bonus ---------- */
  function renderBonus(){
    return '' +
      '<p class="panel-eyebrow">Bonus · Biliyor muydun?</p>' +
      '<h2>Güneş\'e en yakın uzay aracı</h2>' +
      '<div class="bonus-visual"><div class="b-sun"></div><span class="probe">🛰️</span></div>' +
      '<p class="lead" style="margin-bottom:0">2018 yılında fırlatılan <b style="color:var(--ink)">Parker uzay aracı</b>, Güneş\'e en çok yaklaşan insan yapımı nesnedir. Bu araç, Güneş\'i incelemek için özel olarak yapılmıştır ve topladığı verilerle bilim insanları Güneş\'in yapısını ve dönme hareketini daha iyi anlamaktadır.</p>';
  }

  /* ---------- observe DOM for per-panel mounts ---------- */
  var mo = new MutationObserver(function(){
    mountShapeStage();
    mountSpots();
    mountSize();
    mountSafety();
  });
  mo.observe(panelBody, { childList: true });

})();
</script>
